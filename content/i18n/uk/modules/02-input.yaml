# Python Arena UA: текстові переклади. Код, tests, seed, solution залишаються в upstream.
id: input
summary: 'Отримання введених користувачем даних: input(), змінні, поєднання рядків і багаторазове
  введення.'
steps:
  - id: input-prompt
    sourceTitle: Asking the user
    title: Запитуємо дані користувача
    text: |
      Програма може не лише виводити повідомлення, а й отримувати
      інформацію від користувача. Для цього є функція **`input()`**.
      Вона очікує, доки користувач введе рядок і натисне Enter.
      
      ```python run
      city = input("Where do you live? ")
      print(city)
      ```
      
      ```input
      Lisbon
      ```
      
      ```output
      Where do you live? Lisbon
      Lisbon
      ```
      
      Текст у `input("...")` називається **запрошенням до введення**.
      Пробіл перед закривальною лапкою потрібен, щоб відповідь не злипалася
      з текстом запитання. Змінна `city` зберігає введений рядок,
      а `print(city)` виводить її значення, а не слово `city`.
      
      Форма `input()` без аргументів теж працює, але не показує запитання.
      У тестах система сама вводить дані, як це зробив би користувач.
      
      **Your turn:** заповни пропуск назвою функції для введення
      у готовому коді. Якщо користувач введе `green`, програма виведе:
      
      ```
      Favorite color: green
      green
      ```
    hints:
      - Щоб прочитати рядок, використовуй функцію `input`.
      - 'Введи лише назву `input`: дужки вже є.'
    more:
      - index: 0
        task: |
          Запитай слово через підказку `Word: `, потім виведи його між двома рядками з п’яти зірочок. Для введення `hello` очікується:
          ```
          Word: hello
          *****
          hello
          *****
          ```
        hints:
          - 'Спочатку прочитай слово: `word = input("Word: ")`.'
          - Потім зроби три виклики `print()` — для зірочок, слова і зірочок.
          - 'Змінну друкуй без лапок: `print(word)`.'
      - index: 1
        task: |
          Заміни окреме запитання через `print()` на запрошення у `input()`. Якщо відповідь `2`, результат має бути:
          ```
          How many cats do you have? 2
          2
          ```
        hints:
          - Перенеси текст запитання всередину `input("...")` і прибери зайвий `print`.
          - Не забудь пробіл наприкінці запрошення, перед закривальною лапкою.
  - id: input-variables
    sourceTitle: Variables
    title: Змінні та присвоювання
    text: |
      **Змінна (variable)** — це ім’я, за яким програма зберігає значення.
      Оператор `=` виконує **присвоювання**: бере значення справа
      і записує його у змінну зліва.
      
      ```python run
      language = "Python"
      print(language)
      ```
      
      ```output
      Python
      ```
      
      Змінну можна використовувати багато разів без повторного введення.
      Важливо відрізняти `print(food)` (виведення значення змінної)
      від `print("food")` (виведення буквального слова).
      
      ### Як називати змінні
      Ім’я може містити літери, цифри та `_`, але не пробіли.
      Воно не починається з цифри. `pet_name` — коректне ім’я,
      а `pet name` — ні. Великі й малі літери відрізняються:
      `pet_name` та `pet_Name` — різні змінні.
      
      **Your turn:** виправ неправильний регістр у назві змінної,
      щоб програма з `Rex` вивела:
      
      ```
      Pet's name: Rex
      Hello, my name is
      Rex
      ```
    hints:
      - Подивися на останній рядок повідомлення `NameError`.
      - Порівняй написання змінної в першому й третьому рядках коду.
    more:
      - index: 0
        task: |
          Передбач усі рядки виводу програми з `fruit`. Пам’ятай, що текст у лапках відрізняється від значення змінної.
        hints:
          - Змінна `fruit` містить значення `plum`.
          - '`print("fruit")` друкує слово `fruit`, а `print(fruit)` — значення змінної.'
      - index: 1
        task: |
          У початковому коді є змінна з пробілом. Замініть її назву в обох місцях на `home_town`(**snake case**), щоб для `Bergen` отримати:
          ```
          Home town: Bergen
          You come from
          Bergen
          ```
        hints:
          - У назвах змінних не допускаються пробіли.
          - 'Використай нижнє підкреслення: `home_town` в обох рядках.'
  - id: input-joining
    sourceTitle: Joining strings with +
    title: Об’єднання текстових рядків через +
    text: |
      **Конкатенація (concatenation)** — з’єднання текстових рядків в один.
      У Python для цього можна використати знак `+`.
      
      ```python run
      name = input("Your name: ")
      print("Welcome, " + name + "!")
      ```
      
      ```input
      Ada
      ```
      
      ```output
      Your name: Ada
      Welcome, Ada!
      ```
      
      Пробіли автоматично не додаються. Усі необхідні пробіли
      треба вставити всередину рядків у лапках. Також результат
      конкатенації можна зберегти в нову змінну.
      
      **Your turn:** встав два знаки `+` у готовий код, щоб
      правильно привітати користувача. Наприклад, для `Grace`:
      
      ```
      Name: Grace
      Good morning, Grace.
      ```
    hints:
      - Три частини одного тексту можна з’єднати знаком `+`.
      - Додай `+` між фразою, змінною `name` і крапкою.
    more:
      - index: 0
        task: |
          У програмі приготування смузі слова злиплися. Додай пропущені пробіли, щоб для `mango` було:
          ```
          Fruit: mango
          One mango smoothie, coming up!
          ```
        hints:
          - Перевір, між якими словами бракує пробілів.
          - Додай один пробіл після `One` та один перед `smoothie` всередині лапок.
      - index: 1
        task: |
          Створи програму, яка запитує ім’я користувача через `User name: ` та виводить його адресу у домені `example.com`. Для `ada` очікуємо:
          ```
          User name: ada
          Your address is ada@example.com
          ```
        hints:
          - Прочитай ім’я у змінну через `input()`.
          - Адреса складається з тексту `Your address is `, імені та `@example.com`.
          - З’єднай ці частини через `+`.
  - id: input-several
    sourceTitle: Several inputs
    title: Кілька введень поспіль
    text: |
      Кожен виклик `input()` читає **один рядок** введення.
      Якщо потрібно отримати декілька відповідей, викликай функцію
      декілька разів і зберігай значення в окремих змінних.
      
      ```python run
      dish = input("Dish: ")
      drink = input("Drink: ")
      print("Your order: " + dish + " with " + drink)
      ```
      
      ```input
      pizza
      lemonade
      ```
      
      ```output
      Dish: pizza
      Drink: lemonade
      Your order: pizza with lemonade
      ```
      
      ### Перезапис значення
      Повторне присвоювання новому значенню тієї самої змінної
      замінює попереднє. Якщо обидві відповіді треба зберегти,
      використовуй два різні імені.
      
      ### `print()` і коми
      `print(first, second)` додає пробіл між аргументами,
      а `print(first + second)` склеює рядки без пробілу.
      
      **Your turn:** передбач вивід програми зі змінними
      `a = "sun"` та `b = "rise"`: порівняй кому й `+`.
    hints:
      - Кома у `print()` зазвичай вставляє пробіл між значеннями, а `+` — ні.
      - 'У третьому рядку виводу дві частини: `b` та `a + "!"`.'
    more:
      - index: 0
        task: |
          Виправ програму оголошення матчу: зараз ім’я першого гравця зникає, коли вводиться друге. Для `Ada` і `Linus` очікується:
          ```
          Player 1: Ada
          Player 2: Linus
          Ada vs Linus
          ```
        hints:
          - Друге введення перезаписує ту саму змінну.
          - Використай окремі змінні `player1` та `player2`.
      - index: 1
        task: |
          Напиши програму-листівку. Запитай ім’я відправника, ім’я друга та місце подорожі. Для введень `Ada`, `Ben`, `Lisbon` результат повинен бути:
          ```
          Your name: Ada
          Friend's name: Ben
          Place: Lisbon
          Dear Ben,
          greetings from Lisbon!
          Ada
          ```
        hints:
          - Зроби три послідовні виклики `input()` та три окремі змінні.
          - Для рядків листівки використовуй три виклики `print()`.
          - Для першого рядка з’єднай `"Dear "`, змінну друга та `","` без зайвого пробілу.
