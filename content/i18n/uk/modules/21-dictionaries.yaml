      Кожна книга — це словник із ключами `"title"`, `"author"` і `"year"`. Напиши функцію `oldest_title(books)`, яка повертає назву найстарішої книги зі списку. У списку завжди є хоча б одна книга, і жодні дві книги не мають однакового року видання.

      Наприклад, для `[{'title': 'Night Trains', 'author': 'Leo Grant', 'year': 1998}, {'title': 'Paper Moons', 'author': 'Mia Stone', 'year': 1987}]` функція повертає `"Paper Moons"`.
    hints:
    - "Зберігай найстарішу знайдену книгу у змінній, починаючи з першої: `oldest = books[0]`."
    - "Перебери книги; якщо значення `\"year\"` поточної книги менше за рік найстарішої знайденої, онови змінну."
    - "Поверни тільки назву: `oldest[\"title\"]`."
  - index: 1
    task: |
      Кожна книга — це словник із ключами `"title"`, `"author"` і `"year"`. Напиши функцію `count_by_author(books)`, яка повертає словник: ключ — ім'я автора, значення — кількість його книг у списку.

      ```python fragment
