id: dictionaries
summary: Словники зберігають значення за ключами. Створення словників і робота з ними, типи ключів та значень, перебір елементів, підрахунок і групування, видалення ключів та використання словників як записів.
steps:
- id: dictionaries-basics
  title: Ключі та значення
  text: |
    Елементи списку знаходять за їхніми позиціями: 0, 1, 2 тощо. Але часто зручніше шукати значення за назвою: наприклад, ціну кави або номер телефону Ади. **Словник** (*dictionary*) зберігає пари **ключ (key) — значення**. Значення знаходять за ключем — подібно до того, як у звичайному словнику шукають слово, щоб дізнатися його значення.

    ```python run
    prices = {}
    prices["coffee"] = 2.5
    prices["tea"] = 2.0
    prices["cake"] = 3.75

    print(prices)
    print(len(prices))
    print(prices["tea"])
    ```

    ```output
    {'coffee': 2.5, 'tea': 2.0, 'cake': 3.75}
    3
    2.0
    ```

    - `{}` — порожній словник.
    - `prices["coffee"] = 2.5` додає ключ `"coffee"` зі значенням 2.5.
    - `prices["tea"]` — звернення до значення за ключем, указаним у квадратних дужках.
    - `len` рахує кількість пар, а `print` показує їх усі у фігурних дужках, відокремлюючи ключ від значення двокрапкою.

    Пари також можна записати одразу під час створення словника:

    ```python repl
    >>> capitals = {"Finland": "Helsinki", "Peru": "Lima"}
    >>> capitals["Peru"]
    'Lima'
    >>> capitals["Chile"] = "Santiago"
    >>> capitals
    {'Finland': 'Helsinki', 'Peru': 'Lima', 'Chile': 'Santiago'}
    >>> type(capitals)
    <class 'dict'>
    ```

    У Python тип словника називається `dict`.

    ### Чи існує такий ключ?

    Якщо звернутися до ключа, якого немає у словнику, програма завершиться з помилкою `KeyError`. У повідомленні буде вказано відсутній ключ:

    ```python run crash
    prices = {"coffee": 2.5, "tea": 2.0}
    print(prices["juice"])
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        print(prices["juice"])
              ~~~~~~^^^^^^^^^
    KeyError: 'juice'
    ```

    Оператор `in` дає змогу спочатку перевірити наявність ключа. У словнику він перевіряє саме **ключі**, а не значення:

    ```python repl
    >>> prices = {"coffee": 2.5, "tea": 2.0}
    >>> "tea" in prices
    True
    >>> 2.5 in prices
    False
    ```

    Поєднавши `in` із доступом за ключем, можна створити програму, яка знаходить потрібну користувачеві інформацію:

    ```python run
    prices = {"coffee": 2.5, "tea": 2.0, "cake": 3.75}

    item = input("Що бажаєте? ")
    if item in prices:
        print(f"Це коштує {prices[item]:.2f} євро.")
    else:
        print("Вибачте, цього немає в наявності.")
    ```

    ```input
    cake
    ```

    ```output
    Що бажаєте? cake
    Це коштує 3.75 євро.
    ```

    **Your turn:** заповни пропуски, щоб програма додала до словника павука з 8 лапами. Потім вона має вивести кількість тварин у словнику та загальну кількість лап птаха й павука:

    ```
    3
    10
    ```
  hints:
  - "Ключ записують у квадратних дужках після назви словника так само, як будь-який рядок: `\"spider\"` — у лапках."
  - "Перший пропуск — новий ключ `\"spider\"`, другий — ключ `\"bird\"`, за яким записано кількість лап птаха."
