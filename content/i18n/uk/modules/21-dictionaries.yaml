    - "Рахуй голоси, як у прикладі уроку: якщо ключа ще немає, спочатку присвой йому 0, а потім збільш значення на одиницю."
    - "Після циклу перебери `votes.items()` і виведи кожен варіант із кількістю його голосів."
- id: dictionaries-removing
  title: Видалення ключів
  text: |
    Оператор `del` видаляє зі словника ключ разом із його значенням:

    ```python run
    lockers = {"Ada": 12, "Max": 7, "Lin": 3}
    del lockers["Max"]
    print(lockers)
    ```

    ```output
    {'Ada': 12, 'Lin': 3}
    ```

    Спроба видалити ключ, якого немає, викликає `KeyError` — так само, як спроба прочитати його значення. Якщо не впевнений, що ключ існує, спочатку перевір це оператором `in`:

    ```python run
    lockers = {"Ada": 12, "Lin": 3}
    name = "Max"
    if name in lockers:
        del lockers[name]
        print(name, "повернув ключ")
    else:
        print(name, "не має шафки")
    ```

    ```output
    Max не має шафки
    ```

    ### Метод pop

    Метод `pop` також видаляє ключ, але водночас повертає пов'язане з ним значення. Це зручно, коли значення ще потрібно використати:

    ```python repl
    >>> lockers = {"Ada": 12, "Lin": 3}
    >>> freed = lockers.pop("Ada")
    >>> freed
    12
    >>> lockers
    {'Lin': 3}
    >>> print(lockers.pop("Max", None))
    None
    ```

    Якщо передати другий аргумент, `pop` не спричинить помилку за відсутності ключа, а поверне саме цей аргумент. Часто використовують `None` — спеціальне значення Python, що означає «немає значення». Перевірка на нього записується як `is None`:

    ```python run
    lockers = {"Ada": 12, "Lin": 3}
    freed = lockers.pop("Max", None)
    if freed is None:
        print("Max не має шафки")
    else:
        print("Шафка", freed, "звільнена")
    ```

    ```output
    Max не має шафки
    ```

    ### Не видаляй ключі під час перебору словника

    Якщо видаляти ключі в циклі `for`, який перебирає той самий словник, програма завершиться з помилкою:

    ```python run crash
    stock = {"apples": 5, "pears": 0, "plums": 0}
    for fruit in stock:
        if stock[fruit] == 0:
            del stock[fruit]
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        for fruit in stock:
                     ^^^^^
    RuntimeError: dictionary changed size during iteration
    ```

    Цикл не може правильно продовжити перебір, коли розмір словника змінюється. Натомість можна перебирати **список ключів**. Виклик `list(stock)` створює такий список, і він не змінюватиметься разом зі словником:

    ```python run
    stock = {"apples": 5, "pears": 0, "plums": 0}
    for fruit in list(stock):
        if stock[fruit] == 0:
            del stock[fruit]
    print(stock)
    ```

    ```output
    {'apples': 5}
    ```

    Щоб одразу очистити словник, використовуй метод `clear()`: `stock.clear()`.

    Як і список, словник передається функції за посиланням. Тому функція може додавати, змінювати або видаляти ключі словника, який їй передали.

    **Your turn:** визнач, що виведе програма. Запиши кожен рядок результату.
  hints:
  - "`del` видаляє груші, а `pop` — сливи та повертає їхнє значення."
  - "Ключа `\"kiwis\"` немає, тому `pop` повертає другий аргумент, а не завершує програму з помилкою."
  - Після обох видалень у словнику залишається один ключ.
  more:
  - index: 0
    task: |
      Напиши функцію `remove_below(scores, limit)`, яка видаляє з переданого словника всіх учнів, чия оцінка менша за `limit`. Функція змінює початковий словник і нічого не повертає.

      ```python fragment
      scores = {"Ada": 9, "Max": 4, "Lin": 6, "Kim": 2}
      remove_below(scores, 5)
      print(scores)
      ```

      ```
      {'Ada': 9, 'Lin': 6}
      ```
    hints:
    - "Перебери імена й видаляй кожне, чия оцінка менша за `limit`, командою `del scores[name]`."
    - "Видалення ключів під час перебору самого словника спричиняє `RuntimeError`. Натомість перебирай `list(scores)` — список його ключів."
  - index: 1
    task: |
      Напиши функцію `rename_key(data, old, new)`, яка переносить значення ключа `old` під ключ `new` у переданому словнику. Після цього ключа `old` більше не повинно бути. Якщо ключ `old` відсутній, функція нічого не змінює. Функція нічого не повертає.

      ```python fragment
      ages = {"Ada": 36, "Max": 41}
      rename_key(ages, "Max", "Maxine")
      print(ages)
      ```

      ```
      {'Ada': 36, 'Maxine': 41}
      ```
