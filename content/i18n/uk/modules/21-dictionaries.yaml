- id: dictionaries-keys-and-values
  title: Що може зберігати словник
  text: |
    Значення у словнику можуть мати будь-який тип: числа, рядки, списки й навіть інші словники. Ключами найчастіше є рядки, проте числа також підходять. У цьому прикладі ключі — числа:

    ```python run
    days = {1: "Понеділок", 2: "Вівторок", 3: "Середа"}
    for number in range(1, 4):
        print(number, days[number])
    ```

    ```output
    1 Понеділок
    2 Вівторок
    3 Середа
    ```

    Якщо значеннями є списки, кожному ключу може відповідати одразу кілька елементів. Список усередині словника можна змінювати так само, як будь-який інший список:

    ```python run
    grades = {"Ada": [9, 7], "Max": [6]}
    grades["Max"].append(8)
    grades["Lin"] = []
    print(grades)
    print(grades["Ada"][0])
    ```

    ```output
    {'Ada': [9, 7], 'Max': [6, 8], 'Lin': []}
    9
    ```

    `grades["Max"]` — це список, а `.append(8)` змінює цей список усередині словника. Вираз `grades["Ada"][0]` читаємо зліва направо: спочатку беремо значення за ключем `"Ada"`, а потім елемент цього списку з індексом 0.

    ### Одне значення для кожного ключа

    У словнику кожен ключ може бути лише один раз. Присвоювання значення вже наявному ключу замінює попереднє значення. Так можна оновлювати дані:

    ```python repl
    >>> stock = {"apples": 5}
    >>> stock["apples"] = 3
    >>> stock
    {'apples': 3}
    >>> stock["apples"] += 10
    >>> stock["apples"]
    13
    ```

    `stock["apples"] += 10` читає попереднє значення, додає 10 і записує результат за тим самим ключем. Натомість однакове значення може належати кільком ключам: у `{"Ada": 9, "Max": 9}` обидва ключі мають значення 9.

    Словник можна поступово заповнювати у циклі, додаючи по одному ключу:

    ```python run
    names = ["Ada", "Max", "Lin"]
    seat_of = {}
    for i in range(len(names)):
        seat_of[names[i]] = i + 1
    print(seat_of)
    print(seat_of["Lin"])
    ```

    ```output
    {'Ada': 1, 'Max': 2, 'Lin': 3}
    3
    ```

    ### Ключі мають бути незмінними

    Ключ повинен мати незмінний (*immutable*) тип. Числа, рядки та логічні значення підходять (як і кортежі, які розглянемо в останньому модулі цієї частини). Список не може бути ключем, адже після додавання до словника його вміст можна змінити:

    ```python run crash
    places = {}
    places[[60, 24]] = "Helsinki"
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        places[[60, 24]] = "Helsinki"
        ~~~~~~^^^^^^^^^^
    TypeError: cannot use 'list' as a dict key (unhashable type: 'list')
    ```

    Щоб швидко знаходити ключі, Python обчислює для них число — **хеш** (*hash*). Воно має залишатися сталим. Вміст списку може змінюватися, тому список є нехешованим (*unhashable*). Для значень словника такого обмеження немає.

    **Your turn:** напиши функцію `word_lengths(words)`, яка повертає словник: кожне слово зі списку є ключем, а його довжина — значенням. Наприклад, `word_lengths(["sun", "moon", "sky"])` повертає `{'sun': 3, 'moon': 4, 'sky': 3}`. Якщо слово трапляється у списку двічі, у словнику воно буде лише один раз.
  hints:
  - "Почни з порожнього словника `lengths = {}` і поверни його наприкінці функції."
  - "Перебери слова й для кожного запиши його довжину: `lengths[word] = len(word)`."
  - Якщо слово трапляється знову, значення за тим самим ключем просто замінюється такою самою довжиною.
  more:
