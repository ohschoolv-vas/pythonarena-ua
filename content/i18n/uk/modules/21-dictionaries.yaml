- id: dictionaries-looping
  title: Перебір елементів словника
  text: |
    Цикл `for` перебирає ключі словника в порядку їх додавання. За кожним ключем можна отримати відповідне значення:

    ```python run
    stock = {"apples": 5, "pears": 0, "plums": 7}
    for fruit in stock:
        print(fruit, stock[fruit])
    ```

    ```output
    apples 5
    pears 0
    plums 7
    ```

    Коли потрібні і ключ, і значення, метод `items()` надає їх парами. Тоді у циклі використовують дві змінні, розділені комою: перша отримує ключ, друга — значення.

    ```python run
    stock = {"apples": 5, "pears": 0, "plums": 7}
    for fruit, amount in stock.items():
        if amount == 0:
            print(f"{fruit}: розпродано")
        else:
            print(f"{fruit}: залишилося {amount}")
    ```

    ```output
    apples: залишилося 5
    pears: розпродано
    plums: залишилося 7
    ```

    Як одна пара потрапляє у дві змінні, пояснюється в модулі про кортежі наприкінці цієї частини.

    У циклі можна змінювати значення вже наявних ключів. А от додавання чи видалення ключів під час перебору має особливості — їх розглянемо в розділі про видалення ключів.

    ```python run
    stock = {"apples": 5, "pears": 0, "plums": 7}
    for fruit in stock:
        stock[fruit] += 10
    print(stock)
    ```

    ```output
    {'apples': 15, 'pears': 10, 'plums': 17}
    ```

    ### В алфавітному порядку

    Функція `sorted` працює і зі словником: вона повертає впорядкований список його ключів. Якщо перебирати цей список у циклі, ключі словника будуть опрацьовані в алфавітному порядку:

    ```python run
    phone_book = {"Max": "555-0199", "Ada": "555-0123", "Lin": "555-0150"}
    print(sorted(phone_book))
    for name in sorted(phone_book):
        print(name, phone_book[name])
    ```

    ```output
    ['Ada', 'Lin', 'Max']
    Ada 555-0123
    Lin 555-0150
    Max 555-0199
    ```

    ### Пара з найбільшим значенням

    Найбільше значення шукають майже так само, як у списку. Але зазвичай потрібно запам'ятати ще й ключ, якому воно відповідає:

    ```python run
    votes = {"pizza": 12, "tacos": 17, "sushi": 9}

    winner = ""
    most = 0
    for food, count in votes.items():
        if count > most:
            winner = food
            most = count

    print(f"{winner} переміг із {most} голосами")
    ```

    ```output
    tacos переміг із 17 голосами
    ```

    **Your turn:** заповни пропуски, щоб програма вивела кожне ім'я та стільки зірочок, скільки становить оцінка:

    ```
    Ada *****
    Max ***
    Lin ****
    ```
  hints:
  - "Метод `items()` дає змогу отримати одночасно ключ і значення кожної пари."
  - "На кожній ітерації `name` — ключ, а `grade` — значення. Вираз `\"*\" * grade` повторює зірочку `grade` разів."
  more:
  - index: 0
    task: |
      Напиши функцію `best_student(grades)`, яка отримує словник імен та оцінок і повертає ім'я учня з найвищою оцінкою. Якщо кілька учнів мають однакову найвищу оцінку, поверни ім'я того, хто йде у словнику першим. Оцінки — цілі числа від 1 до 5.

      Наприклад, `best_student({"Ada": 4, "Max": 3, "Lin": 5})` повертає `"Lin"`.
    hints:
    - "Заведи дві допоміжні змінні: ім'я найкращого учня та його оцінку. Перебирай пари через `items()`."
    - "Якщо оцінка більша за поточну найвищу, запам'ятай і ім'я, і оцінку."
    - "Використовуй `>`, а не `>=`, щоб пізніший учень із такою самою оцінкою не замінив першого."
  - index: 1
    task: |
      Магазин зберігає залишки товарів у словнику, де ключі — назви товарів, а значення — їхня кількість. Напиши функцію `running_low(stock, limit)`, яка повертає список товарів, кількість яких менша за `limit`, в алфавітному порядку.

      Наприклад, `running_low({"pens": 3, "clips": 50, "tape": 1}, 5)` повертає `['pens', 'tape']`.
    hints:
    - Перебери товари, порівняй їхню кількість із `limit` та додай потрібні назви до нового списку.
    - "Перебирай `sorted(stock)`, щоб одразу отримувати назви в алфавітному порядку, або відсортуй список перед поверненням."
- id: dictionaries-counting
  title: Підрахунок і групування
  text: |
    Підрахунок того, скільки разів зустрічається кожен елемент, — одне з найпоширеніших застосувань словника. Елементи стають ключами, а кількість їхніх появ — значеннями:

    ```python run
    colors = ["red", "blue", "red", "green", "blue", "red"]

    counts = {}
    for color in colors:
        if color not in counts:
            counts[color] = 0
        counts[color] += 1

    print(counts)
    ```

    ```output
    {'red': 3, 'blue': 2, 'green': 1}
    ```

    `not in` — протилежність `in`: вираз істинний, якщо ключа немає у словнику. Коли колір з'являється вперше, такого ключа ще немає, тому цикл додає його зі значенням 0. Потім за кожної появи лічильник збільшується на одиницю.

    Без умови `if` перша ж операція `+=` спричинить помилку. Адже `+=` спочатку читає попереднє значення, а його ще не існує:

    ```python run crash
    colors = ["red", "blue"]
    counts = {}
    for color in colors:
        counts[color] += 1
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 4, in <module>
        counts[color] += 1
        ~~~~~~^^^^^^^
    KeyError: 'red'
    ```

    ### Групування

    За таким самим принципом можна розподіляти елементи за групами. Значеннями стають списки, до яких додають елементи відповідних груп. Тут учнів згруповано за оцінками:

    ```python run
    results = [["Ada", 5], ["Max", 3], ["Lin", 5], ["Kim", 4], ["Bo", 3]]

    by_grade = {}
    for result in results:
        name = result[0]
        grade = result[1]
        if grade not in by_grade:
            by_grade[grade] = []
        by_grade[grade].append(name)

    for grade in sorted(by_grade):
        print(grade, by_grade[grade])
    ```

    ```output
    3 ['Max', 'Bo']
    4 ['Kim']
    5 ['Ada', 'Lin']
    ```

    Коли певна оцінка з'являється вперше, для неї створюється порожній список. Далі до списку цієї оцінки додається ім'я. В обох прикладах принцип однаковий: спочатку переконайся, що ключ існує, а потім змінюй його значення.

    **Your turn:** заповни пропуски, щоб функція `letter_counts(text)` повертала словник із кількістю появ кожного символу рядка. Наприклад, `letter_counts("banana")` повертає `{'b': 1, 'a': 3, 'n': 2}`.
  hints:
  - Умова `if` має додавати літеру, якої ще немає серед ключів. Який оператор перевіряє відсутність ключа?
  - "Лічильник нової літери починається з 0, а наступний рядок збільшує його на одиницю. Потрібний оператор — `not in`."
  more:
  - index: 0
    task: |
      Напиши функцію `group_by_length(words)`, яка повертає словник: ключами є довжини слів, а значенням для кожної довжини — список слів такої довжини у початковому порядку.

      Наприклад, `group_by_length(["sun", "moon", "sky", "star"])` повертає `{3: ['sun', 'sky'], 4: ['moon', 'star']}`.
    hints:
    - "Ключ для слова — `len(word)`, а значення — список слів."
    - "Якщо певна довжина зустрілася вперше, створи порожній список: `groups[length] = []`."
    - "Потім додай слово до відповідної групи: `groups[length].append(word)`."
  - index: 1
    task: |
      Напиши програму для підрахунку голосів. Вона запитує голоси із запрошенням `Голос: `, доки користувач не введе порожній рядок. Потім виводить кожен варіант і кількість голосів за нього в порядку першої появи варіантів. Приклад виконання:

      ```
      Vote: pizza
      Vote: tacos
      Vote: pizza
      Vote:
      pizza: 2
      tacos: 1
      ```
