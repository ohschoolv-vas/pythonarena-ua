- id: dictionaries-records
  title: Словники як записи
  text: |
    Словник зручно використовувати, щоб зберігати відомості про один об'єкт під окремими назвами ключів:

    ```python run
    person = {"name": "Ada", "age": 36, "city": "London"}
    print(person["name"], "— вік:", person["age"])
    person["age"] += 1
    print(person)
    ```

    ```output
    Ada — вік: 36
    {'name': 'Ada', 'age': 37, 'city': 'London'}
    ```

    Порівняй це із записом у вигляді списку, який ми вже розглядали: `["Ada", 36, "London"]`. Для списку потрібно пам'ятати, що вік міститься за індексом 1. У словнику про це говорить сама назва ключа: `person["age"]`. Згодом можна додати нові відомості, наприклад `person["email"] = "ada@example.com"`, не змінюючи наявні. Ключі — звичайні рядки, тому важливо завжди писати їх однаково: `person["Age"]` викличе `KeyError`.

    ### Список записів

    Список словників з однаковими ключами можна використовувати як невелику базу даних:

    ```python run
    books = [
        {"title": "The Glass Garden", "author": "Mia Stone", "pages": 312},
        {"title": "Night Trains", "author": "Leo Grant", "pages": 205},
        {"title": "Paper Moons", "author": "Mia Stone", "pages": 260},
    ]

    for book in books:
        print(f"{book['title']} — автор: {book['author']}")

    total = 0
    for book in books:
        total += book["pages"]
    print("Середня кількість сторінок:", total / len(books))
    ```

    ```output
    The Glass Garden — автор: Mia Stone
    Night Trains — автор: Leo Grant
    Paper Moons — автор: Mia Stone
    Середня кількість сторінок: 259.0
    ```

    На кожному кроці циклу `book` — це один словник, а `book["title"]` — назва книги. Усередині f-рядка, обмеженого подвійними лапками, ключ можна записати в одинарних лапках: `book['title']`.

    Функції полегшують роботу з такою базою даних. Ця функція шукає записи й повертає новий список назв відповідних книг:

    ```python run
    def short_books(books: list, max_pages: int) -> list:
        titles = []
        for book in books:
            if book["pages"] <= max_pages:
                titles.append(book["title"])
        return titles


    books = [
        {"title": "The Glass Garden", "author": "Mia Stone", "pages": 312},
        {"title": "Night Trains", "author": "Leo Grant", "pages": 205},
        {"title": "Paper Moons", "author": "Mia Stone", "pages": 260},
    ]
    print(short_books(books, 300))
    ```

    ```output
    ['Night Trains', 'Paper Moons']
    ```

    **Your turn:** заповни пропуски, щоб функція `make_book(title, author, year)` повертала запис про книгу з ключами `"title"`, `"author"` та `"year"`. Наприклад, `make_book("Night Trains", "Leo Grant", 1998)` повертає `{'title': 'Night Trains', 'author': 'Leo Grant', 'year': 1998}`.
  hints:
  - Запис починається з порожнього словника, а кожен наступний рядок додає до нього один ключ.
  - "Порожній словник — `{}`. Другий пропуск — ключ `\"author\"` у лапках, третій — параметр, що містить рік."
  more:
