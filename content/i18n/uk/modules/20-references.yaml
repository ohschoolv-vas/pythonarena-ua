- id: references-side-effects
  title: Побічні ефекти
  text: |
    Функція, яка, окрім повернення значення, змінює щось за своїми межами, має **побічний ефект**. Якщо це її призначення, як у `add_bonus` з попереднього розділу, такий ефект потрібний. Якщо ж зміна відбувається випадково, це помилка, яку складно помітити: функція повертає правильний результат, а наслідки виявляються в іншій частині програми.

    Ця функція обчислює вартість замовлення разом із доставкою:

    ```python run
    def order_total(prices: list, delivery: int) -> int:
        prices.append(delivery)
        return sum(prices)


    basket = [12, 30, 8]
    print("До сплати:", order_total(basket, 5))
    print("Кошик:", basket)
    ```

    ```output
    До сплати: 55
    Кошик: [12, 30, 8, 5]
    ```

    Сума правильна, але `append` додав плату за доставку до списку, який отримав від виклику функції. Тепер у кошику є число 5, якого покупець не додавав. Для обчислення результату функції зовсім не потрібно змінювати список:

    ```python run
    def order_total(prices: list, delivery: int) -> int:
        return sum(prices) + delivery


    basket = [12, 30, 8]
    print("До сплати:", order_total(basket, 5))
    print("Кошик:", basket)
    ```

    ```output
    До сплати: 55
    Кошик: [12, 30, 8]
    ```

    Якщо функції для обчислення відповіді все ж треба впорядкувати елементи або видалити деякі з них, слід змінювати копію, а не переданий їй список.

    ### Той самий виклик — інший результат

    Через побічний ефект функція може повертати різні результати під час повторних викликів:

    ```python run
    def sum_except_first(numbers: list) -> int:
        numbers.pop(0)
        return sum(numbers)


    bills = [100, 20, 30, 40]
    print(sum_except_first(bills))
    print(sum_except_first(bills))
    ```

    ```output
    90
    70
    ```

    Кожен виклик назавжди видаляє один елемент зі списку `bills`. Зріз створює новий список, тому `return sum(numbers[1:])` дає ту саму відповідь, не змінюючи список із коду, який викликав функцію.

    ### Чисті функції

    Функція, єдиним результатом роботи якої є повернене значення і яка нічого іншого не змінює, називається **чистою функцією**. Такі функції легше перевіряти: за тих самих аргументів вони завжди повертають однаковий результат, а їх виклик не змінює дані в інших частинах програми. Корисно дотримуватися таких правил:

    - Функція, що обчислює результат, не повинна змінювати свої аргументи. Якщо треба впорядкувати, видалити або замінити елементи, вона працює з копією (`sorted`, `copy()`, зрізом) чи власним новим списком.
    - Якщо призначення функції — змінити список, про це має бути сказано в її описі. Така функція нічого не повертає.

    Під час обчислень варто особливо уважно використовувати методи, що змінюють список: `append`, `insert`, `remove`, `pop`, `sort`, а також присвоєння за індексом або зрізом.

    **Термінологія:** `side effect` — побічний ефект; `pure function` — чиста функція.

    **Your turn:** на змаганнях зі стрибків у воду оцінки суддів зберігаються у списку. Найвищу й найнижчу оцінки відкидають, а результатом є середнє арифметичне решти. Функція `dive_score(scores)` правильно обчислює результат, але водночас видаляє дві оцінки з початкового списку. Виправ її так, щоб переданий список не змінювався.

    ```python fragment
    scores = [7, 9, 8, 5, 9]
    print(dive_score(scores))
    print(scores)
    ```

    ```
    8.0
    [7, 9, 8, 5, 9]
    ```
