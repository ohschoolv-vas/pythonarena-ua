      shout_all(words)
      print(words)
      ```

      ```
      ['HEY!', 'STOP!']
      ```
    hints:
    - "`words = loud` лише змушує параметр посилатися на новий список. Початковий список не змінюється."
    - Зміни сам початковий список. Присвоєння зрізу може замінити одразу всі його елементи.
    - "Заміни останній рядок на `words[:] = loud`."
  - index: 1
