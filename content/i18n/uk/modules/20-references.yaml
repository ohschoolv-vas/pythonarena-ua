- id: references-copying
  title: Копіювання списку
  text: |
    Якщо потрібен другий список, який можна змінювати незалежно від першого, слід створити **копію**. Довший спосіб — створити порожній список і в циклі додати до нього всі елементи:

    ```python run
    original = [3, 1, 2]
    duplicate = []
    for item in original:
        duplicate.append(item)

    duplicate.append(4)
    print(original)
    print(duplicate)
    ```

    ```output
    [3, 1, 2]
    [3, 1, 2, 4]
    ```

    Тепер маємо два окремі списки: зміни в одному не впливають на інший. У Python є три коротші способи зробити те саме. Кожен створює новий список із тими самими елементами:

    ```python repl
    >>> original = [3, 1, 2]
    >>> a = original.copy()
    >>> b = original[:]
    >>> c = list(original)
    >>> a.append(4)
    >>> b[0] = 99
    >>> c.sort()
    >>> original
    [3, 1, 2]
    >>> a
    [3, 1, 2, 4]
    >>> b
    [99, 1, 2]
    >>> c
    [1, 2, 3]
    ```

    - `copy()` — метод списку, призначений саме для копіювання.
    - `[:]` — зріз без початкового й кінцевого індексів, тому він бере всі елементи. Зріз списку завжди створює новий список.
    - `list(...)` створює новий список з отриманих елементів, як і під час перетворення `range`.

    Усі три способи працюють. `copy()` найлегше зрозуміти під час читання коду, адже його назва відразу пояснює дію.

    ### Копіювання списку списків

    Копія містить ті самі елементи, що й оригінал. Якщо ці елементи самі є списками, як у матриці, копія містить посилання на ті самі внутрішні списки. Два зовнішні списки окремі, але їхні рядки спільні:

    ```python run
    board = [[".", "."], [".", "."]]
    saved = board.copy()

    board[0][0] = "X"
    board.append(["new", "row"])
    print(saved)
    ```

    ```output
    [['X', '.'], ['.', '.']]
    ```

    Новий рядок було додано лише до `board`, оскільки зовнішні списки окремі. Але значення `"X"` потрапило до рядка, спільного для обох списків, тому воно з’явилося й у `saved`. Щоб скопіювати матрицю без спільних рядків, потрібно скопіювати також кожен рядок:

    ```python run
    board = [[".", "."], [".", "."]]
    saved = []
    for row in board:
        saved.append(row.copy())

    board[0][0] = "X"
    print(board)
    print(saved)
    ```

    ```output
    [['X', '.'], ['.', '.']]
    [['.', '.'], ['.', '.']]
    ```

    **Термінологія:** `list of lists` — список списків.

    **Your turn:** ціни зі знижкою мають становити половину звичайних цін, але звичайні ціни повинні залишитися незмінними. Заповни пропуск, створивши копію `prices`, щоб програма вивела:

    ```
    Normal: [10, 25, 40]
    Sale: [5, 12, 20]
    ```
  hints:
  - "`sale_prices = prices` не підходить: обидві назви посилатимуться на один список, тому зміна цін зі знижкою змінить також звичайні ціни."
  - "Скопіювати список можна за допомогою `prices.copy()`. Також працюють `prices[:]` і `list(prices)`."
  more:
  - index: 0
    task: |
      Що виведе ця програма? Запиши кожен рядок її виводу.
    hints:
    - "`b = a[:]` створює новий список — копію. `c = a` створює ще одну назву для списку, на який посилається `a`."
    - "Отже, `c.append(4)` змінює список `a`, а `b.append(5)` змінює лише копію."
  - index: 1
    task: |
      Напиши функцію `copy_grid(grid)`, яка повертає копію матриці. Між копією та оригіналом не повинно бути спільних рядків: якщо після копіювання змінити рядки оригіналу, копія має залишитися незмінною.

      ```python fragment
      grid = [[1, 2], [3, 4]]
      saved = copy_grid(grid)
      grid[0][0] = 99
      print(saved)
      print(grid)
      ```

      ```
      [[1, 2], [3, 4]]
      [[99, 2], [3, 4]]
      ```
    hints:
    - "`grid.copy()` недостатньо: він створює новий зовнішній список, але його рядки залишаються тими самими списками, що й у `grid`."
    - Створи новий порожній список, перебери рядки матриці й додай копію кожного рядка.
    - "Копію одного рядка створює `row.copy()`."
- id: references-list-parameters
  title: Списки як параметри функцій
  text: |
    Виклик функції працює подібно до `today = todo`: параметр отримує посилання на список, переданий як аргумент, а не копію списку. Отже, функція та код, який її викликає, використовують один список, і функція може змінити переданий їй список:

    ```python run
    def add_bonus(scores: list):
        for i in range(len(scores)):
            scores[i] += 5


    points = [10, 20, 30]
    add_bonus(points)
    print(points)
    ```

    ```output
    [15, 25, 35]
    ```

    Функція `add_bonus` не має `return`. Вона виконує свою роботу, змінюючи список, тому її викликають окремим рядком заради дії, а не заради значення, яке вона могла б повернути.

    Інший підхід — не змінювати оригінал, а повернути новий список:

    ```python run
    def with_bonus(scores: list) -> list:
        result = []
        for score in scores:
            result.append(score + 5)
        return result


    points = [10, 20, 30]
    new_points = with_bonus(points)
    print(points)
    print(new_points)
    ```

    ```output
    [10, 20, 30]
    [15, 25, 35]
    ```

    Обидва підходи правильні. Головне — розуміти й пояснювати, що саме робить функція: змінює переданий список чи повертає новий?

    ### Присвоєння параметру не змінює список за межами функції

    Ось поширена помилка. Ця функція має залишити в переданому списку тільки перші `count` імен. Вона отримує їх зрізом і присвоює цей зріз параметру:

    ```python run
    def keep_first(names: list, count: int):
        names = names[:count]


    queue = ["Ada", "Ben", "Cleo", "Dev", "Eli"]
    keep_first(queue, 3)
    print(queue)
    ```

    ```output
    ['Ada', 'Ben', 'Cleo', 'Dev', 'Eli']
    ```

    Зріз створює новий список, а команда `names = names[:count]` змушує параметр `names` посилатися на нього. Це лише нове значення однієї змінної всередині функції, як у випадку `today = ["sleep"]` на початку уроку. Список, на який посилається `queue`, не змінюється, а новий список зникає після завершення роботи функції.

    Щоб змінити список у коді, який викликав функцію, потрібно змінити **сам список**: присвоїти нові значення його елементам за індексами, як у `add_bonus`, або замінити елементи за допомогою **присвоєння зрізу**. Зріз ліворуч від `=` замінює відповідні елементи елементами списку праворуч. Їх може бути більше чи менше, тому довжина списку також може змінитися:

    ```python repl
    >>> letters = ["a", "b", "c", "d", "e"]
    >>> letters[1:4] = ["X"]
    >>> letters
    ['a', 'X', 'e']
    >>> letters[:] = ["p", "q", "r", "s"]
    >>> letters
    ['p', 'q', 'r', 's']
    ```

    `[:]` охоплює весь список, тому `letters[:] = ...` замінює всі його елементи. Саме так виправляється `keep_first`: потрібен вираз `names[:] = names[:count]`. Python спочатку обчислює праву частину — зріз із першими `count` іменами, — а потім замінює ними попередні елементи того самого списку.

    **Термінологія:** `reference` — посилання; `slice assignment` — присвоювання зрізу.

    **Your turn:** напиши функцію `cap_scores(scores, limit)`, яка змінює переданий список: кожен бал, більший за `limit`, стає рівним `limit`. Функція нічого не повертає.

    ```python fragment
    scores = [45, 120, 80, 101]
    cap_scores(scores, 100)
    print(scores)
    ```

    ```
    [45, 100, 80, 100]
    ```
  hints:
  - 'Щоб змінити елемент списку, потрібен його індекс. Перебирай індекси циклом `for i in range(len(scores)):`. '
  - "Якщо `scores[i]` більше за `limit`, виконай присвоєння `scores[i] = limit`."
  - Функції не потрібен `return`. Вона змінює переданий список, і код, який її викликав, бачить цю зміну.
  more:
  - index: 0
