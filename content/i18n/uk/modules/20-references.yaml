id: references
summary: Що насправді зберігає змінна. Дві назви для одного списку, копіювання списків, передавання списків у функції та їх змінювання, а також побічні ефекти, через які список може змінитися випадково.
steps:
- id: references-same-list
  title: Дві назви для одного списку
  text: |
    Досі було зручно казати, що команда `scores = [7, 9]` записує список у змінну `scores`. Але для списків таке уявлення може вводити в оману. Змінна не зберігає сам список — вона зберігає **посилання** на нього, яке вказує Python, де список розташований у пам’яті комп’ютера. Уявіть, що список — це будинок, а посилання — записана на аркуші адреса цього будинку.

    Здебільшого ця різниця не має значення. Але вона стає важливою, коли дві змінні посилаються на один список:

    ```python repl
    >>> todo = ["wash", "cook"]
    >>> today = todo
    >>> today.append("shop")
    >>> today[0] = "rest"
    >>> todo
    ['rest', 'cook', 'shop']
    ```

    `today = todo` не копіює список. Ця команда копіює посилання — його «адресу», тому `todo` і `today` тепер є двома назвами того самого списку. Зміна через будь-яку з цих змінних змінює спільний список, і обидві змінні «бачать» результат. У програмі це може стати несподіванкою:

    ```python run
    weekday_songs = ["Intro", "Rain", "Comets"]
    weekend_songs = weekday_songs
    weekend_songs.append("Party Time")

    print("Будні:", weekday_songs)
    print("Вихідні:", weekend_songs)
    ```

    ```output
    Будні: ['Intro', 'Rain', 'Comets', 'Party Time']
    Вихідні: ['Intro', 'Rain', 'Comets', 'Party Time']
    ```

    ### Числа та рядки не можна змінювати

    Чому з числами не відбувається того самого?

    ```python repl
    >>> x = 5
    >>> y = x
    >>> y += 1
    >>> x
    5
    >>> y
    6
    ```

    Числа, рядки та логічні значення (**Boolean**) є **незмінними**: змінити сам об’єкт неможливо. Команда `y += 1` не змінює число 5. Вона створює нове число 6 і змушує `y` посилатися на нього, тоді як `x` і далі посилається на 5. Методи рядків працюють так само: `upper` повертає новий рядок, залишаючи початковий без змін. Списки ж є **змінюваними**: `append`, `sort`, `remove`, `pop` і присвоєння за індексом змінюють сам список, а тому всі змінні, які на нього посилаються, бачать ці зміни.

    Присвоїти змінній нове значення — не те саме, що змінити список, на який вона посилається:

    ```python repl
    >>> todo = ["wash", "cook"]
    >>> today = todo
    >>> today = ["sleep"]
    >>> todo
    ['wash', 'cook']
    ```

    `today = ["sleep"]` змушує `today` посилатися на новий список. Початковий список не змінюється, і `todo` далі посилається на нього.

    ### Посилання всередині списків

    Матриця — це список, який містить посилання на свої рядки. Якщо отримати окремий рядок матриці, ми матимемо ще одну назву цього рядка, а не його копію:

    ```python run
    seats = [["free", "free"], ["free", "taken"]]
    first_row = seats[0]
    first_row[1] = "taken"
    print(seats)
    ```

    ```output
    [['free', 'taken'], ['free', 'taken']]
    ```

    Тому `row[j] = ...` у циклі перебору матриці змінює саму матрицю: `row` посилається на один з її рядків. Натомість `number *= 10`, застосоване до числа з рядка, лише змушує змінну `number` посилатися на нове число.

    **Термінологія:** `reference` — посилання; `mutable` — змінюваний; `immutable` — незмінний.

    **Your turn:** що виведе ця програма? Запиши кожен рядок її виводу.
  hints:
  - "`players = team` не копіює список: обидві назви посилаються на той самий список."
  - "Тому `players.append(\"Cleo\")` змінює і список, на який посилається `team`."
  - "`players = [\"Dev\"]` змушує `players` посилатися на новий список, а `team` зберігає посилання на старий."
  more:
