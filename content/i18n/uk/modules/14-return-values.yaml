      Що виведе ця програма? Запиши кожен рядок результату.
    hints:
    - '`upper` повертає новий рядок великими літерами. Значення змінної `name` він не змінює.'
    - '`name.lower()` дає `"grace"`, отже порівняння істинне, і `print` виводить `True`.'
    - Рядок із великих літер має стільки само символів, скільки початковий.
- id: return-values-trying-out
  sourceTitle: Trying out your functions
  title: Як перевіряти власні функції
  text: |
    У попередньому модулі ти перевіряв функцію, додаючи її виклик під визначенням. Але тут є нюанс. Перевірки завдань із функціями **завантажують (load)** твою програму так, як Python завантажує модуль, а потім самостійно викликають функцію зі своїми аргументами. Під час завантаження виконується весь код на верхньому рівні файлу. Тому твої пробні виклики теж виконаються й додадуть зайві рядки до результату перевірки. А якщо серед них буде `input()`, перевірка зупиниться, адже жодних даних для введення не передбачено.

    Отже, потрібне місце для коду, який запускатиметься під час звичайного виконання програми, але не під час її завантаження перевіркою. Для цього наприкінці файлу використовують спеціальний блок:

    ```python run
    def stars(count):
        print("*" * count)


    if __name__ == "__main__":
        stars(3)
        stars(5)
    ```

    ```output
    ***
    *****
    ```

    `if __name__ == "__main__":` — це умова, а код із відступом під нею називають **головним блоком (main block)**. Під час запуску файлу як програми умова істинна, тому блок виконується. Коли перевірка завантажує файл для виклику твоєї функції, умова хибна, і блок пропускається. Модуль 31 детально пояснить, як це працює. Поки запам’ятай правило: **пробні виклики функцій розміщуй у блоці `if __name__ == "__main__":`**. Якщо програма просто використовує власні функції, як більшість прикладів у цьому курсі, їх можна викликати й на верхньому рівні: перевірка не викликає такі функції окремо.

    Відтепер початковий код багатьох вправ із функціями вже міститиме головний блок з одним або двома викликами:

    ```python fragment
    def stars(count):
        pass


    if __name__ == "__main__":
        stars(3)
    ```

    Як і раніше, `pass` тимчасово замінює тіло функції, доки ти не напишеш справжній код. Можеш змінювати виклики в головному блоці як завгодно: перевірки їх ігнорують. Команда **Run with my input** запускає файл як звичайну програму, включно з головним блоком.

    ### Якщо перевірка не проходить

    Коли перевірка завершується невдало, вона показує виклик, який виконала. Щоб швидко з’ясувати причину, скопіюй цей виклик у головний блок і запусти програму. Так ти побачиш повне повідомлення Python про помилку:

    ```python run crash
    def initial(name):
        print(name[0] + ".")


    if __name__ == "__main__":
        initial("Grace")
        initial("")
    ```

    ```output
    G.
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 7, in <module>
        initial("")
        ~~~~~~~^^^^
      File "main.py", line 2, in initial
        print(name[0] + ".")
              ~~~~^^^
    IndexError: string index out of range
    ```

    Як ти вже бачив, повідомлення про помилку (**traceback**) усередині функції може містити дві частини. Читай його знизу вгору: останній рядок називає помилку, трохи вище зазначено місце у функції, де вона виникла (рядок 2, `initial`), а ще вище — виклик, який до неї призвів (рядок 7). Тут функцію викликали з порожнім рядком: у нього немає символу з індексом 0. Тому функція повинна окремо обробляти цей випадок.

    ### Налагоджувальне виведення

    Деякі помилки не зупиняють програму — вона просто виводить неправильний результат. Щоб побачити, що відбувається всередині функції, додай `print` зі значеннями змінних у потрібному місці. Ця функція має знаходити суму чисел від 1 до `limit`, але для 4 виводить 6 замість 10:

    ```python run
    def sum_up_to(limit):
        total = 0
        number = 1
        while number < limit:
            total += number
            print("number:", number, "total:", total)
            number += 1
        print("Sum:", total)


    if __name__ == "__main__":
        sum_up_to(4)
    ```

    ```output
    number: 1 total: 1
    number: 2 total: 3
    number: 3 total: 6
    Sum: 6
    ```

    Налагоджувальні рядки показують, що цикл завершується після 3, тому 4 не додається. Умова має бути `number <= limit`. Коли виправиш помилку, прибери додатковий `print`: перевірки порівнюють усе, що виводить функція.

    **Your turn:** функція `banner` працює правильно, але пробні виклики розміщені на верхньому рівні файлу. Через це під час завантаження програми перевірками виводяться зайві рядки. Перенеси обидва виклики під `if __name__ == "__main__":` наприкінці файлу. Під час звичайного запуску має з’явитися:

    ```
    ==
    Hi
    ==
    =======
    Welcome
    =======
    ```
  hints:
  - Додай після функції рядок `if __name__ == "__main__":` без відступу, біля лівого краю.
  - Зроби відступ у чотири пробіли для обох викликів, щоб вони належали головному блоку.
  more:
  - index: 0
    task: |
      Функція `middle_letter(word)` виводить середню літеру слова (для слова з парною кількістю літер — другу із двох середніх). Одна з перевірок викликає `middle_letter("")`, і програма завершується помилкою. Зміни функцію так, щоб для порожнього рядка вона виводила `(empty)`, а для інших слів — середню літеру. Наприклад, `middle_letter("cat")` виводить:

      ```
      a
      ```
    hints:
    - Додай виклик `middle_letter("")` до головного блоку та запусти програму, щоб побачити ту саму помилку,
      що й перевірка.
    - У порожнього рядка немає символу з індексом 0, тому спершу перевір, чи рядок не порожній.
    - '`if word == "":` має виводити `(empty)`, а блок `else:` — середню літеру, як і раніше.'
  - index: 1
    task: |
      Функція `countdown(start)` має виводити числа від `start` до 1, кожне з нового рядка, а потім `Go!`. Але вона пропускає останнє число. Знайди й виправ помилку (можеш скористатися налагоджувальним `print`). Для `countdown(3)` очікується:

      ```
      3
      2
      1
      Go!
      ```
    hints:
    - Додай `print("number is now", number)` після циклу, але перед `Go!`, і запусти програму. На якому значенні
      цикл зупиняється?
    - Цикл завершується, коли `number` дорівнює 1, ще до того, як виведе її. Умова повинна залишатися істинною
      для 1.
    - Заміни умову на `number > 0` (або `number >= 1`) і прибери налагоджувальний вивід.
- id: return-values-small-functions
  sourceTitle: Building with small functions
  title: Створення програм із невеликих функцій
  text: |
    Спочатку коротко повторимо два терміни, які трапляються дуже часто. Назви в дужках під час **визначення функції** — це її **параметри (parameters)**. Значення в дужках під час **виклику** — це **аргументи (arguments)**:

    ```python run
    def seat(name, row, number):
        print(f"{name}: row {row}, seat {number}")


    seat("Ada", 4, 12)
    guest = "Linus"
    seat(guest, 2 + 1, 7)
    ```

    ```output
    Ada: row 4, seat 12
    Linus: row 3, seat 7
    ```

    Під час виклику значення кожного аргументу передається відповідному параметру за порядком, лише на час цього виклику. Аргументом може бути змінна або обчислення: передається саме значення. Тому значення змінної `guest` потрапляє до параметра `name`, а результат `2 + 1` — до параметра `row`.

    Оскільки важливий тільки порядок, аргументи, передані не на свої місця, потраплять до неправильних параметрів, і Python цього не помітить: `seat(12, 4, "Ada")` спокійно виведе `12: row 4, seat Ada`. Python повідомить про помилку `TypeError` лише тоді, коли аргументів замало або забагато. Якщо їх замало, буде названо параметр, який не отримав значення; якщо забагато — скільки аргументів функція приймає та скільки їй передали. Тому порядок аргументів перевіряй самостійно.

    ### Невеликі функції всередині більших

    У попередньому модулі ти дізнався, що одна функція може викликати іншу. Це важливий принцип створення великих програм: спочатку напиши невелику функцію, перевір її, а потім побудуй на її основі складнішу. Тут `price_line` формує один рядок чека, а `receipt` викликає її для кожного потрібного рядка:

    ```python run
    def price_line(item, price):
        print(f"{item}: {price} euros")


    def receipt(first, first_price, second, second_price):
        print("RECEIPT")
        price_line(first, first_price)
        price_line(second, second_price)
        price_line("Total", first_price + second_price)


    receipt("Coffee", 3, "Bun", 2)
    print()
    receipt("Tea", 2, "Soup", 7)
    ```

    ```output
    RECEIPT
    Coffee: 3 euros
    Bun: 2 euros
    Total: 5 euros

    RECEIPT
    Tea: 2 euros
    Soup: 7 euros
    Total: 9 euros
    ```

    Функції `receipt` не потрібно знати, як оформлюється рядок: вона лише визначає, які саме рядки потрібні. Якби замість `euros` потрібно було виводити `EUR`, достатньо було б змінити один рядок у `price_line`, і всі чеки автоматично змінилися б. Зверни увагу й на аргументи, які передає `receipt`: власні параметри, створений усередині неї рядок `"Total"` та результат обчислення.

    Аргумент не обов’язково має бути параметром зовнішньої функції. Тут `bar` малює один індикатор прогресу, а `loading` викликає її в циклі. Кількість заповнених клітинок береться зі змінної-лічильника:

    ```python run
    def bar(filled, size):
        print("[" + "#" * filled + "-" * (size - filled) + "]")


    def loading(size):
        done = 0
        while done <= size:
            bar(done, size)
            done += 1


    loading(4)
    ```

    ```output
    [----]
    [#---]
    [##--]
    [###-]
    [####]
    ```

    Кожна частина залишається невеликою і зрозумілою. Якщо `bar` працює правильно, усі функції, побудовані на ній, теж правильно малюватимуть індикатори. Коли складна функція працює неправильно, спершу перевір менші функції окремо в головному блоці — так простіше визначити, де саме помилка.

    Цей підхід корисний, коли завдання здається занадто складним: спробуй знайти в ньому маленьку самостійну дію. Спершу напиши та перевір функцію для неї, і лише потім — функцію, яка її використовує.

    **Your turn:** заповни пропуски так, щоб `battery_drain(size)` показувала поступове розряджання батареї: спочатку викликала `bar` з усіма `size` заповненими клітинками, а потім щоразу зменшувала їх кількість на одну, аж до нуля. `battery_drain(3)` має вивести:

    ```
    [###]
    [##-]
    [#--]
    [---]
    ```
  hints:
  - 'Функції `bar` потрібні два значення: кількість заповнених клітинок зараз і загальна кількість клітинок.'
  - Кількість заповнених клітинок задає лічильник `left`, який зменшується в циклі. Загальний розмір батареї
    не змінюється — це параметр `size` самої `battery_drain`.
