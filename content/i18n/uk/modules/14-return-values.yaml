id: return-values
summary: Інтерактивний інтерпретатор Python, перевірка та налагодження власних функцій, параметри й аргументи,
  виклики функцій одна з одної, повернення значень через `return`, різниця між `return` і `print` та анотації
  типів.
steps:
- id: return-values-interpreter
  sourceTitle: The interactive interpreter
  title: Інтерактивний інтерпретатор Python
  text: |
    Досі ти писав цілі програми: Python читав файл і виконував його рядок за рядком згори донизу. Але є й інший спосіб роботи — **інтерактивний інтерпретатор (interactive interpreter)**. Ти вводиш один рядок, натискаєш Enter, а Python одразу його виконує та показує результат. Програмісти часто використовують такий режим, щоб перевірити кілька рядків перед додаванням до програми.

    На власному комп’ютері інтерпретатор запускають командою `python3` (у Windows — `python`) у терміналі. Запрошення `>>>` означає «введи рядок Python». На цьому сайті немає окремого вікна інтерпретатора, але в уроках ти побачиш приклади таких сеансів, де запрошення до введення виділено менш яскраво:

    ```python repl
    >>> 7 * 6
    42
    >>> 10 / 4
    2.5
    >>> "ab" * 3
    'ababab'
    ```

    ### Значення показуються, а не друкуються

    Якщо ти вводиш **вираз (expression)** — код, що має значення, — інтерпретатор показує результат без виклику `print`. Зверни увагу: рядок показано в лапках. Інтерпретатор відображає значення так, як його записують у коді Python, щоб можна було відрізнити рядок від числа. Натомість `print` виводить сам текст без лапок:

    ```python repl
    >>> word = "hello"
    >>> word
    'hello'
    >>> print(word)
    hello
    >>> len(word)
    5
    >>> "5"
    '5'
    >>> 5
    5
    ```

    Рядок, який сам по собі не має значення, наприклад `word = "hello"`, нічого не показує. Змінна залишається доступною протягом поточного сеансу, так само як у звичайній програмі.

    Різниця між `'5'` і `5` важлива: перше — рядок, друге — число. Далі в цьому модулі перевірки багатьох вправ самі викликатимуть твої функції та показуватимуть повернені значення в такий самий спосіб. Якщо перевірка очікує `5`, а отримує `'5'`, значить функція повернула рядок замість числа.

    ### Перевірка методів

    Інтерактивний інтерпретатор зручний для швидкої перевірки роботи команд. Ти вже знайомий із **методами (methods)** рядків, наприклад `find`: їх викликають після рядка через крапку. Рядки мають багато інших методів. Два корисні — `upper` і `lower`: вони повертають рядок відповідно у верхньому або нижньому регістрі.

    ```python repl
    >>> "Python Arena".upper()
    'PYTHON ARENA'
    >>> name = "ADA"
    >>> name.lower()
    'ada'
    >>> name
    'ADA'
    >>> name.lowr()
    Traceback (most recent call last):
      File "<stdin>", line 1, in <module>
    AttributeError: 'str' object has no attribute 'lowr'. Did you mean: 'lower'?
    ```

    Метод повертає **новий рядок**: сама змінна `name` і далі містить `'ADA'`. Помилка в назві методу викликає `AttributeError`. Якщо назва схожа на наявний метод, Python навіть може підказати правильний варіант. Щоб побачити назви всіх методів рядка, введи `dir("")` в інтерпретаторі. Імена з двома підкресленнями на початку й у кінці Python використовує для внутрішніх потреб; звичайні назви на кшталт `upper`, `lower` і `find` ти викликатимеш самостійно.

    `lower` часто застосовують, щоб порівнювати введену відповідь незалежно від великих і малих літер:

    ```python run
    answer = input("Do you want to continue? ")
    if answer.lower() == "yes":
        print("Continuing")
    else:
        print("Stopping")
    ```

    ```input
    YES
    ```

    ```output
    Do you want to continue? YES
    Continuing
    ```

    Неважливо, що введе користувач — `yes`, `Yes` чи `YES`: результат `answer.lower()` завжди буде `"yes"`.

    Щоб перевірити щось на цьому сайті, помісти вираз у `print` і запусти невеличку програму в редакторі будь-якої вправи або в **Playground** (пункт меню вгорі).

    **Your turn:** заповни пропуски, щоб програма вивела введене слово спочатку великими, а потім малими літерами:

    ```
    Word: PyThOn
    PYTHON
    python
    ```
  hints:
  - 'Кожен пропуск — це назва методу рядка: один повертає великі літери, інший — малі.'
  - Метод для великих літер — `upper`, а для малих — `lower`.
  more:
  - index: 0
    task: |
      Напиши програму-вікторину. Вона має запитувати `Which planet is called the red planet? `, доки користувач не відповість `mars`, незалежно від регістру літер (`Mars`, `MARS` і `mars` — правильні відповіді). Після кожної неправильної відповіді програма виводить `Try again`, а після правильної — `Correct!`:

      ```
      Which planet is called the red planet? Venus
      Try again
      Which planet is called the red planet? jupiter
      Try again
      Which planet is called the red planet? MARS
      Correct!
      ```
    hints:
    - Тут зручно використати цикл `while True:`, який завершиться через `break` після правильної відповіді.
    - 'Порівнюй `answer.lower()` із `"mars"`: тоді регістр літер у відповіді не матиме значення.'
    - Виводь `Try again` всередині циклу після неправильної відповіді, а `Correct!` — після циклу.
  - index: 1
