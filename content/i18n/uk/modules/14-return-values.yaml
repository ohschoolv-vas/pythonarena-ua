- id: return-values-return-or-print
  sourceTitle: Return or print?
  title: '`return` чи `print`?'
  text: |
    Повернене значення — це звичайне значення Python. Його можна вивести на екран, зберегти у змінній, використати в обчисленні, порівняти або передати як аргумент іншій функції:

    ```python run
    def to_minutes(hours, minutes):
        return hours * 60 + minutes


    def to_hours_text(minutes):
        return str(minutes // 60) + " h " + str(minutes % 60) + " min"


    film = to_minutes(1, 50)
    series = 3 * to_minutes(0, 45)
    print(film, series)
    if film < series:
        print("The film is shorter")
    print(to_hours_text(film + series))
    ```

    ```output
    110 135
    The film is shorter
    4 h 5 min
    ```

    В останньому рядку спочатку обчислюється `film + series`. Його результат 245 передається функції `to_hours_text`, а повернений нею рядок — функції `print`. Отже, вкладені виклики виконуються зсередини назовні.

    ### `return` і `print` — не одне й те саме

    Функція, яка виводить результат, і функція, яка повертає його, під час простої перевірки можуть здаватися однаковими. Порівняй їх в інтерактивному інтерпретаторі:

    ```python repl
    >>> def longer_print(a, b):
    ...     if len(a) >= len(b):
    ...         print(a)
    ...     else:
    ...         print(b)
    ...
    >>> def longer(a, b):
    ...     if len(a) >= len(b):
    ...         return a
    ...     return b
    ...
    >>> longer_print("cat", "horse")
    horse
    >>> longer("cat", "horse")
    'horse'
    >>> longer("cat", "horse").upper()
    'HORSE'
    >>> result = longer_print("cat", "horse")
    horse
    >>> print(result)
    None
    ```

    Інтерпретатор показує різницю: `horse` без лапок — це текст, який функція **вивела**, а `'horse'` у лапках — значення, яке вона **повернула**. Із поверненим значенням можна виконувати подальші дії, наприклад викликати для нього метод `upper`. Виведений текст лише з’являється на екрані; код, який викликав `longer_print`, не отримує самого рядка як результат.

    Функція, що завершується без інструкції `return`, повертає спеціальне значення **`None`**, яке означає «значення відсутнє». Якщо спробувати використати `None` як рядок або число, програма зупиниться з помилкою:

    ```python run crash
    def longer_print(a, b):
        if len(a) >= len(b):
            print(a)
        else:
            print(b)


    word = longer_print("cat", "horse")
    print(len(word))
    ```

    ```output
    horse
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 9, in <module>
        print(len(word))
              ~~~^^^^^^
    TypeError: object of type 'NoneType' has no len()
    ```

    `NoneType` — це тип значення `None`. Якщо бачиш його в повідомленні про помилку, імовірно, функція вивела щось замість повернення значення або в ній забули написати `return`.

    Зазвичай повертати результат корисніше: після цього його можна застосувати як завгодно, зокрема й вивести. Саме тому перевірка вправи, де вимагається **повернути значення**, не зарахує функцію, яка лише надрукувала правильний текст.

    **Your turn:** функція `average(a, b, c)` виводить середнє арифметичне трьох аргументів, але повинна його повертати. Зміни її так, щоб вона повертала середнє арифметичне й сама нічого не друкувала. Наприклад, `average(2, 4, 9)` має повертати `5.0`.
  hints:
  - Заміни `print(...)` інструкцією `return`, яка повертає те саме значення.
  - 'Використай `return` із тим самим обчисленням, що зараз передано до `print`. Щоб бачити результат під час
    запуску, виведи виклик у головному блоці: `print(average(2, 4, 9))`.'
