- id: return-values-type-hints
  sourceTitle: Argument types and type hints
  title: Типи аргументів та анотації типів
  text: |
    Кожне значення має свій тип. Поки тобі відомі такі типи:

    ```python repl
    >>> type(2026)
    <class 'int'>
    >>> type(9.81)
    <class 'float'>
    >>> type("hello")
    <class 'str'>
    >>> type(5 == 5)
    <class 'bool'>
    ```

    `int` — ціле число, `float` — число з десятковою частиною, `str` — рядок, а `bool` — логічне значення `True` або `False`.

    Функція працює правильно лише тоді, коли її аргументи мають типи, які підтримують виконувані операції. Ця функція множить ціну на кількість товарів, тож їй потрібні два числа. Але під час другого виклику кількість беруть безпосередньо з `input`:

    ```python run crash
    def total_price(price, amount):
        print("Total:", price * amount)


    total_price(2.5, 4)
    amount = input("How many? ")
    total_price(2.5, amount)
    ```

    ```input
    3
    ```

    ```output
    Total: 10.0
    How many? 3
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 7, in <module>
        total_price(2.5, amount)
        ~~~~~~~~~~~^^^^^^^^^^^^^
      File "main.py", line 2, in total_price
        print("Total:", price * amount)
                        ~~~~~~^~~~~~~~
    TypeError: can't multiply sequence by non-int of type 'float'
    ```

    `input` завжди повертає рядок. Тому під час другого виклику `amount` містить `"3"`, а не число 3. Усередині функції вираз `price * amount` стає `2.5 * "3"`. Рядок можна повторити лише цілу кількість разів, а 2.5 — не ціле число, тому Python зупиняється. Помилка з’являється всередині функції, але її причина — у виклику: введене користувачем число потрібно перетворити через `int` (або `float`) перед передаванням у функцію. Якби ціна була цілим числом, помилку було б ще важче помітити: `2 * "3"` дає рядок `"33"`, тому програма показала б неправильний результат без повідомлення про помилку.

    ### Анотації типів (type hints)

    Щоб підказати користувачам твоєї функції, які типи аргументів вона очікує, можна додати **анотації типів (type hints)**. Для параметра анотацію пишуть після його назви через двокрапку, а тип поверненого значення — після стрілки `->` перед завершальною двокрапкою заголовка функції:

    ```python run
    def shout(text: str, marks: int) -> str:
        return text.upper() + "!" * marks


    print(shout("hello", 3))
    ```

    ```output
    HELLO!!!
    ```

    Це означає, що `text` має бути рядком, `marks` — цілим числом, а функція повинна повертати рядок. Анотації допомагають правильно користуватися функцією, а редактори коду можуть попереджати про невідповідність типів.

    Проте сам Python **не перевіряє** ці анотації під час виконання. Це лише підказки: виклик з іншими типами все одно запускається, і функція виконує з отриманими значеннями те, що написано в її коді:

    ```python run
    def double(number: int) -> int:
        return number * 2


    print(double(4))
    print(double("ha"))
    print(double(1.5))
    ```

    ```output
    8
    haha
    3.0
    ```

    Відтепер початковий код багатьох вправ міститиме анотації типів. Вони показують, які аргументи перевірки передаватимуть твоїй функції та якого типу результат очікуватимуть.

    **Your turn:** програма запитує ціну та кількість товарів, а потім виводить суму, яку повертає `total_price`. Зараз вона завершується помилкою, бо кількість передається як рядок. Виправ програму так, щоб вона працювала:

    ```
    Price: 2.5
    Amount: 4
    Total: 10.0
    ```
  hints:
  - '`input` завжди повертає рядок, але `amount` має бути типу `int`, як зазначено в анотації.'
  - Огорни `input(...)`, який зчитує кількість товарів, у `int(...)` — так само як ціна перетворюється за допомогою
    `float(...)`.
