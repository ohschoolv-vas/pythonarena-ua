- id: return-values-return
  sourceTitle: Returning a value
  title: Повернення значення з функції
  text: |
    Деякі функції повертають результат. `input` повертає текст, введений користувачем, `len` — довжину, а `int` — число. Під час обчислення Python підставляє це значення замість виклику функції. Його можна зберегти у змінній або використати у виразі:

    ```python fragment
    count = len("hello") + 1
    ```

    Значення, яке функція повертає, називають **поверненим значенням (return value)**. Власні функції повертають його за допомогою інструкції **`return`**:

    ```python run
    def double(number):
        return number * 2


    result = double(21)
    print(result)
    print(double(5) + 1)
    ```

    ```output
    42
    11
    ```

    Функція `double` сама нічого не виводить. Вона обчислює `number * 2` і повертає результат, а код, що викликав функцію, вирішує, що з ним робити: перший виклик зберігає його у `result`, другий — додає до нього 1.

    ### `return` завершує виконання функції

    Інструкція `return` негайно завершує роботу функції, навіть якщо вона розташована всередині циклу або `if`. Завдяки цьому легко повертати різні значення залежно від умови:

    ```python run
    def sign(number):
        if number > 0:
            return "positive"
        if number < 0:
            return "negative"
        return "zero"


    print(sign(15))
    print(sign(-3))
    print(sign(0))
    ```

    ```output
    positive
    negative
    zero
    ```

    Для 15 виконується перший `return`, і на цьому виклик функції завершується: решта рядків уже не виконується. До останнього рядка Python доходить лише тоді, коли обидві умови хибні. Під час одного виклику виконується тільки один `return`.

    Функція може повернути будь-яке значення: число, рядок, `True` чи `False`. Ось функція, яка зчитує число, завдяки чому основний код залишається коротким:

    ```python run
    def ask_number(prompt):
        return int(input(prompt))


    width = ask_number("Width: ")
    height = ask_number("Height: ")
    print("Area:", width * height)
    ```

    ```input
    4
    5
    ```

    ```output
    Width: 4
    Height: 5
    Area: 20
    ```

    ### `return` без значення

    Самостійна інструкція `return`, без виразу після неї, просто завершує функцію. Вона корисна у функціях, що щось виводять: можна достроково завершити роботу, коли подальше виконання не має сенсу.

    ```python run
    def print_ratio(a, b):
        if b == 0:
            print("Can't divide by zero")
            return
        print(a / b)


    print_ratio(7, 2)
    print_ratio(7, 0)
    ```

    ```output
    3.5
    Can't divide by zero
    ```

    У вправах із функціями перевірки викликають твою функцію й показують повернене значення так само, як інтерактивний інтерпретатор: `42` для числа, `'positive'` у лапках — для рядка.

    **Your turn:** заповни пропуск, щоб `area(width, height)` повертала площу прямокутника. Наприклад, `area(3, 4)` повинна повертати `12`.
  hints:
  - Функція має передавати результат назад коду, який її викликав, а не виводити його.
  - Для повернення значення використовується інструкція `return`.
