- id: arithmetic-input-numbers
  sourceTitle: Numbers as input
  title: Введення чисел
  text: |
    Функція `input` завжди повертає **рядок** (`str`), навіть якщо користувач вводить цифри. Якщо спробувати обчислювати з таким рядком, як із числом, виникне помилка:

    ```python run crash
    guests = input("Guests: ")
    print(guests + 2)
    ```

    ```input
    8
    ```

    ```output
    Guests: 8
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        print(guests + 2)
              ~~~~~~~^~~
    TypeError: can only concatenate str (not "int") to str
    ```

    Користувач увів 8, але змінна `guests` містить рядок `"8"`. Якщо ліворуч від оператора `+` стоїть рядок, Python намагається виконати конкатенацію (*concatenation*), тобто з’єднати текст. Проте об'єднати рядок і число таким способом не можна.

    ### Функції `int` і `float`

    Раніше ми перетворювали числа на рядки функцією `str`. Функції `int` і `float` виконують зворотне перетворення: `int("8")` повертає ціле число `8`, а `float("2.5")` — дробове `2.5`.

    ```python run
    answer = input("Guests: ")
    guests = int(answer)
    print(f"Put out {guests + 2} chairs: one for each guest and two spare.")
    ```

    ```input
    8
    ```

    ```output
    Guests: 8
    Put out 10 chairs: one for each guest and two spare.
    ```

    Зазвичай програма зчитує та перетворює значення одним рядком: функція `input` записана всередині дужок `int`. Python спочатку виконує внутрішній виклик `input`, а потім передає отриманий рядок до `int`:

    ```python run
    dog_age = int(input("Dog's age in years: "))
    print(f"That's about {dog_age * 7} in human years.")
    ```

    ```input
    3
    ```

    ```output
    Dog's age in years: 3
    That's about 21 in human years.
    ```

    Якщо користувач може ввести число з дробовою частиною, потрібно використовувати `float`:

    ```python run
    price = float(input("Price: "))
    print(f"With a 20% discount: {price * 0.8}")
    ```

    ```input
    12.5
    ```

    ```output
    Price: 12.5
    With a 20% discount: 10.0
    ```

    ### Якщо введений текст не є цілим числом

    Функція `int` може прочитати ціле число, за потреби зі знаком мінус. Інший текст, зокрема число з десятковою крапкою, викличе помилку `ValueError`:

    ```python run crash
    count = int(input("How many? "))
    ```

    ```input
    2.5
    ```

    ```output
    How many? 2.5
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 1, in <module>
        count = int(input("How many? "))
    ValueError: invalid literal for int() with base 10: '2.5'
    ```

    Повідомлення означає, що `int` не може перетворити `'2.5'` на ціле число. Вислів *base 10* означає десяткову систему числення. Якщо можливе введення дробових чисел, використовуй `float`. Згодом ти навчишся обробляти ситуації, коли користувач вводить дані, які взагалі не є числом.

    **Your turn:** заповни пропуск так, щоб програма прочитала ціле число й подвоїла його. Якщо користувач введе `7`, результат буде таким:

    ```
    Number: 7
    7 doubled is 14
    ```
  hints:
  - '`input` повертає рядок. Яка функція перетворює рядок із цифрами на ціле число?'
  - 'Вираз `int(input("Number: "))` одразу зчитує текст і перетворює його на ціле число.'
