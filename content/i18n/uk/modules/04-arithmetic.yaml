# Українська локалізація модуля Python Arena.
# Усі Python-приклади, еталонні результати та перевірки зберігаються з оригіналу.
id: arithmetic
summary: 'Арифметичні обчислення в Python: основні арифметичні оператори (arithmetic operators), порядок виконання
  операцій (operator precedence), типи результатів (int, float), зчитування чисел за допомогою int і float та накопичення
  суми в змінній (running total).'
steps:
- id: arithmetic-operators
  sourceTitle: Arithmetic operators
  title: Арифметичні оператори
  text: |
    Ти вже використовував оператори `+`, `-`, `*` і `/`. У Python є ще три арифметичні оператори (*arithmetic operators*). Ось усі сім:

    | Оператор | Дія | Приклад | Результат |
    |:-:|---|---|---|
    | `+` | додавання | `7 + 2` | `9` |
    | `-` | віднімання | `7 - 2.5` | `4.5` |
    | `*` | множення | `-3 * 4` | `-12` |
    | `/` | звичайне ділення | `7 / 2` | `3.5` |
    | `//` | цілочисельне ділення (*integer division*, округлення вниз) | `7 // 2` | `3` |
    | `%` | остача від ділення (*remainder*, також *modulo*) | `7 % 2` | `1` |
    | `**` | піднесення до степеня (*power*) | `2 ** 3` | `8` |

    ### Цілочисельне ділення та остача

    Оператор `//` ділить числа й округлює результат **у менший бік** до цілого значення. Він показує, скільки повних разів одне число вміщується в іншому. Оператор `%` знаходить **остачу від ділення**. Разом вони відповідають на запитання: «Скільки повних коробок можна заповнити і скільки предметів залишиться?»

    ```python repl
    >>> 17 // 5
    3
    >>> 17 % 5
    2
    ```

    Число 5 вміщується в 17 тричі: це 15, а в остачі залишається 2. Аналогічно можна перетворити загальну кількість хвилин на години та хвилини:

    ```python run
    minutes = 135
    hours = minutes // 60
    rest = minutes % 60
    print(f"{minutes} minutes is {hours} h {rest} min.")
    ```

    ```output
    135 minutes is 2 h 15 min.
    ```

    За допомогою остачі також зручно перевіряти парність: парне число ділиться на 2 без остачі, тому `14 % 2` дорівнює `0`, а `15 % 2` дорівнює `1`. Це знадобиться під час вивчення умовних операторів.

    ### Піднесення до степеня

    Оператор `**` підносить число до степеня: `2 ** 3` означає `2 * 2 * 2`.

    ```python repl
    >>> 2 ** 3
    8
    >>> 5 ** 2
    25
    >>> 10 ** 6
    1000000
    ```

    **Увага:** у Python символ `^` не означає піднесення до степеня. Це інший оператор (побітове XOR), який зараз нам не потрібен. Тому `2 ^ 3` поверне неправильний для задачі на степені результат, але повідомлення про помилку не буде:

    ```python repl
    >>> 2 ^ 3
    1
    ```

    **Your turn:** заповни пропуски так, щоб програма обчислила, скільки повних тижнів і додаткових днів міститься у 100 днях:

    ```
    100 days is 14 weeks and 2 days.
    ```
  hints:
  - Кількість повних тижнів показує, скільки разів число `7` вміщується у `100`. Додаткові дні — це остача.
  - Оператор `//` виконує ділення з округленням униз, а `%` повертає остачу від ділення.
  more:
  - index: 0
    task: |
