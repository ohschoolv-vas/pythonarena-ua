- id: arithmetic-using-variables
  sourceTitle: Calculating with variables
  title: Обчислення зі змінними
  text: |
    Програма, яка працює з числами, зазвичай зчитує їх, зберігає у **змінних** (*variables*) та виконує обчислення. У цьому прикладі програма додає відстані пробіжок за три дні в цілих кілометрах і визначає середню відстань за день:

    ```python run
    monday = int(input("Monday, km: "))
    tuesday = int(input("Tuesday, km: "))
    wednesday = int(input("Wednesday, km: "))
    total = monday + tuesday + wednesday
    print(f"Distance run: {total} km")
    print(f"Per day: {total / 3} km")
    ```

    ```input
    5
    8
    2
    ```

    ```output
    Monday, km: 5
    Tuesday, km: 8
    Wednesday, km: 2
    Distance run: 15 km
    Per day: 5.0 km
    ```

    ### Додавання до поточного значення змінної

    Інший підхід — зберігати **накопичувальну суму** (*running total*) в одній змінній та додавати до неї кожне нове значення:

    ```python run
    total = 0
    price = float(input("First item: "))
    total = total + price
    price = float(input("Second item: "))
    total = total + price
    print(f"To pay: {total}")
    ```

    ```input
    3.5
    2.25
    ```

    ```output
    First item: 3.5
    Second item: 2.25
    To pay: 5.75
    ```

    Як і раніше, інструкція `total = total + price` спочатку обчислює праву частину з поточними значеннями, а потім записує результат у `total`. Початкова сума дорівнює `0`, щоб до неї можна було додати перше значення. Змінна `price` послідовно зберігає ціну кожного товару: після додавання до загальної суми її попереднє значення вже не потрібне.

    ### Скорочений запис `+=`

    Збільшення змінної трапляється настільки часто, що Python має коротший запис: `total += price` означає те саме, що й `total = total + price`. Аналогічно працюють `-=` і `*=`:

    ```python run
    balance = 100
    balance += 25
    balance -= 40
    balance *= 2
    print(balance)
    ```

    ```output
    170
    ```

    Спочатку `100 + 25 = 125`, потім `125 - 40 = 85`, а після множення на 2 отримуємо `170`.

    ### Зберігай значення, які ще знадобляться

    Повторно використовувати одну змінну для накопичення суми зручно. Але якщо наприкінці потрібне кожне окреме значення, його слід зберегти у власній змінній:

    ```python run
    morning = int(input("Temperature in the morning: "))
    evening = int(input("Temperature in the evening: "))
    print(f"From {morning} to {evening} degrees: a change of {evening - morning}")
    ```

    ```input
    12
    19
    ```

    ```output
    Temperature in the morning: 12
    Temperature in the evening: 19
    From 12 to 19 degrees: a change of 7
    ```

    Якщо повторно використовуєш змінну, нехай вона зберігає значення зі схожим призначенням, наприклад ціни товарів. Можна було б назвати змінну `value` і спочатку зберігати в ній кількість гостей, а потім ціну квитка. Такий код працюватиме, але його буде складніше читати. Назви `guests` і `ticket_price` одразу пояснюють призначення значень.

