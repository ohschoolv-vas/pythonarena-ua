- id: arithmetic-precedence
  sourceTitle: Order of operations
  title: Порядок виконання операцій
  text: |
    Арифметичний вираз складається зі **значень — операндів** (*operands*) — та **операторів** (*operators*), наприклад `+` і `*`. Якщо у виразі кілька операторів, Python дотримується **порядку виконання операцій** (*order of operations*, *operator precedence*), знайомого з математики:

    1. Дії в круглих дужках.
    2. Піднесення до степеня — `**`.
    3. Множення й ділення — `*`, `/`, `//` та `%`.
    4. Додавання й віднімання — `+` та `-`.

    Операції одного рівня зазвичай виконуються зліва направо. Виняток — піднесення до степеня: вираз `2 ** 3 ** 2` обчислюється справа наліво як `2 ** 9`.

    ```python run
    print(2 + 3 * 4)
    print((2 + 3) * 4)
    print(2 * 3 ** 2)
    print(20 - 8 - 2)
    print(20 - (8 - 2))
    ```

    ```output
    14
    20
    18
    10
    14
    ```

    У виразі `2 * 3 ** 2` спочатку обчислюється степінь: `3 ** 2` дорівнює 9, а `2 * 9` — 18. У виразі `20 - 8 - 2` віднімання йде зліва направо: спочатку `20 - 8 = 12`, потім `12 - 2 = 10`. У останньому рядку дужки змушують Python спочатку обчислити `8 - 2`.

    ### Поширена помилка

    Середнє арифметичне двох чисел — це сума цих чисел, поділена на 2. Якщо забути дужки, Python поділить на 2 лише друге число:

    ```python run
    first = 8
    second = 6
    wrong = first + second / 2
    right = (first + second) / 2
    print(wrong)
    print(right)
    ```

    ```output
    11.0
    7.0
    ```

    Python не видав помилки: вираз `first + second / 2` цілком правильний із погляду синтаксису, але він обчислює не те, що ми хотіли. Результат дорівнює `8 + 3.0`, тобто `11.0`. Python виконує саме записані команди, тому потрібно стежити за порядком обчислень.

    ### Дужки у складнішій формулі

    У цьому прикладі ціна товару спочатку зменшується на 25%, а потім додається вартість доставки:

    ```python run
    price = 80
    discount = 25
    shipping = 5
    total = price * (100 - discount) / 100 + shipping
    print(total)
    ```

    ```output
    65.0
    ```

    Завдяки дужкам Python спочатку обчислює частку ціни, яку потрібно сплатити, — 75%. Потім `*` та `/` виконуються зліва направо: `80 * 75 = 6000`, `6000 / 100 = 60.0`. Наприкінці додається вартість доставки. Якщо порядок операцій викликає сумніви, додаткові дужки можуть зробити формулу зрозумілішою.

    **Your turn:** встав дужки в пропуски так, щоб програма вивела `30`, а не `22`:

    ```
    30
    ```
  hints:
  - Без дужок Python спочатку множить `6` на `3`.
  - Постав `(` перед `4` і `)` після `6`, щоб додавання виконалося першим.
  more:
  - index: 0
    task: |
      Визнач, що виведе ця програма. Запиши кожен рядок результату.
    hints:
