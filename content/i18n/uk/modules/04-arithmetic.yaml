- id: arithmetic-types
  sourceTitle: Types of results
  title: Типи результатів обчислень
  text: |
    Кожне значення у Python має певний **тип даних** (*type*). Дізнатися тип значення можна за допомогою функції `type`:

    ```python repl
    >>> type(7)
    <class 'int'>
    >>> type(7.0)
    <class 'float'>
    >>> type("7")
    <class 'str'>
    ```

    Поки не звертай уваги на слово `class`. Головне — назва типу в лапках: `7` — це ціле число (*integer*, `int`), `7.0` — число з плаваючою крапкою (`float`), а `"7"` — рядок (`str`).

    ### Тип результату обчислення

    Тип результату залежить від оператора та операндів. Порівняй:

    ```python repl
    >>> 2 + 3
    5
    >>> 2 + 3.0
    5.0
    >>> 6 / 3
    2.0
    >>> 7 // 2
    3
    >>> 7.5 // 2
    3.0
    >>> type(6 / 3)
    <class 'float'>
    ```

    Розглянь результати попарно. `2 + 3` дає ціле число `5`. Якщо замінити `3` на число `3.0` типу `float`, результат теж стане `float` — `5.0`, хоча за значенням він цілий. Вираз `6 / 3` ділить два цілі числа без остачі, але все одно повертає `2.0`: оператор `/` завжди дає `float`. Вираз `7 // 2` повертає ціле `3`, а `7.5 // 2` — `3.0`, бо одним з операндів було число типу `float`.

    Тип результату впливає на його вигляд під час виведення. Обирай оператор, який дає потрібний результат:

    ```python run
    minutes = 240
    print(f"{minutes / 60} hours")
    print(f"{minutes // 60} hours")
    ```

    ```output
    4.0 hours
    4 hours
    ```

    У реальних обчисленнях цілі й дробові числа часто використовуються разом. Наприклад, ця програма обчислює витрату пального автомобіля на 100 кілометрів:

    ```python run
    liters = 42.5
    kilometers = 680
    per_100_km = liters / kilometers * 100
    print(f"Fuel used: {per_100_km} liters per 100 km")
    print(type(per_100_km))
    ```

    ```output
    Fuel used: 6.25 liters per 100 km
    <class 'float'>
    ```

    ### Перетворення між типами даних

    Назви типів також можна використовувати як функції для перетворення значень. Ти вже знаєш `str`; так само працюють `int` і `float`:

    ```python repl
    >>> int(3.9)
    3
    >>> float(3)
    3.0
    >>> str(3.5)
    '3.5'
    ```

    Функція `int` **не округлює** число до найближчого цілого: вона відкидає дробову частину в напрямку нуля. Тому `int(3.9)` дорівнює `3`.

    **Your turn:** зараз програма виводить `5.0 minutes`. Заповни пропуск оператором так, щоб вона виводила `5 minutes`:

    ```
    5 minutes
    ```
  hints:
  - Оператор `/` завжди повертає `float`, а таке число виводиться з десятковою крапкою.
  - Цілочисельне ділення `//` повертає `int`, якщо обидва операнди — цілі числа.
  more:
