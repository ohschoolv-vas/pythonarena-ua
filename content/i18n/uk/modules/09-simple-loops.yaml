- id: simple-loops-counting
  sourceTitle: Loops that count
  title: Цикли з лічильником
  text: |
    Цикл не обов'язково має зчитувати дані користувача. Часто змінна трохи змінюється на кожній ітерації, а цикл завершується, коли вона досягає певної межі:

    ```python run
    number = 1
    while True:
        print(number)
        number += 1
        if number > 5:
            break
    print("Done!")
    ```

    ```output
    1
    2
    3
    4
    5
    Done!
    ```

    Простежимо виконання: спочатку `number` дорівнює `1`. Кожна ітерація виводить його значення й збільшує на одиницю. Після виведення `5` змінна `number` стає рівною `6`, умова `number > 5` стає істинною, і `break` завершує цикл.

    Змінну можна змінювати й по-іншому. Пригадай `-=` та `*=` із першої частини: `seconds -= 3` — скорочений запис `seconds = seconds - 3`, а `n *= 2` подвоює значення `n`. Ось зворотний відлік із кроком `3`:

    ```python run
    seconds = 10
    while True:
        if seconds < 0:
            break
        print(seconds)
        seconds -= 3
    print("Liftoff!")
    ```

    ```output
    10
    7
    4
    1
    Liftoff!
    ```

    Після `1` виходить `-2`, а це менше за `0`, тому цикл завершується, не виводячи цього числа.

    ### Де розмістити перевірку

    У першому циклі перевірка стоїть **після** `print`, а в другому — **перед** ним. Від розташування `if` із командою `break` залежить, які саме значення буде виведено. Тут перевірка виконується відразу після зміни змінної, але перед `print`:

    ```python run
    number = 1
    while True:
        number += 1
        if number > 5:
            break
        print(number)
    ```

    ```output
    2
    3
    4
    5
    ```

    Тепер першим виводиться число `2`, тому що значення `number` збільшується ще до першого виведення. Якщо цикл виводить на одне значення більше або менше, ніж потрібно, простеж зміну змінної ітерація за ітерацією — на папері або за допомогою `print`. Так легше зрозуміти, де має стояти перевірка.

    Ще один важливий момент: змінна повинна змінюватися всередині циклу. Якщо прибрати `number += 1`, умова `number > 5` ніколи не стане істинною і цикл не завершиться.

    **Your turn:** заповни пропуски, щоб програма вивела чотири кола перегонів, а потім завершила їх:

    ```
    Lap 1
    Lap 2
    Lap 3
    Lap 4
    Race over!
    ```
  hints:
  - Цикл має завершитися відразу після виведення останнього кола.
  - Перевірка порівнює `lap` із номером останнього кола — `4`. Після неї `lap += 1` переходить до наступного кола.
  more:
  - index: 0
    task: |
      Визнач, що виведе програма. Запиши кожен рядок результату.
    hints:
    - '`n *= 2` подвоює `n`: отримуємо `2`, `4`, `8` і так далі.'
    - Перевірка стоїть перед `print`, тому значення, більше за `20`, не буде виведено всередині циклу.
    - Після завершення циклу `n` зберігає саме те значення, за якого цикл зупинився.
  - index: 1
    task: |
      Напиши програму, яка запитує число та виводить для нього таблицю множення — від множення на `1` до множення на `10`:

      ```
      Number: 7
      7 x 1 = 7
      7 x 2 = 14
      7 x 3 = 21
      7 x 4 = 28
      7 x 5 = 35
      7 x 6 = 42
      7 x 7 = 49
      7 x 8 = 56
      7 x 9 = 63
      7 x 10 = 70
      ```
    hints:
    - Потрібна друга змінна-лічильник від `1` до `10`. Встанови її значення `1` перед циклом.
    - Кожна ітерація виводить один рядок `f"{number} x {factor} = {number * factor}"` і збільшує лічильник на одиницю.
    - Заверши цикл через `break`, коли лічильник стане більшим за `10`.
- id: simple-loops-helper-variables
  sourceTitle: 'Helper variables: counting and summing'
  title: 'Допоміжні змінні: підрахунок і підсумовування'
  text: |
    Змінні, які допомагають відстежувати значення під час виконання циклу, називають **допоміжними змінними** (*helper variables*). Одна з них може підраховувати кількість елементів (**лічильник**, *counter*), а інша — накопичувати загальну суму (**накопичувач**, *total*):

    ```python run
    items = 0
    total = 0
    while True:
        price = int(input("Price (0 to finish): "))
        if price == 0:
            break
        items += 1
        total += price
    print(f"{items} items, total {total} euros")
    ```

    ```input
    3
    12
    5
    0
    ```

    ```output
    Price (0 to finish): 3
    Price (0 to finish): 12
    Price (0 to finish): 5
    Price (0 to finish): 0
    3 items, total 20 euros
    ```

    Обидві допоміжні змінні отримують початкове значення `0` **перед** циклом і оновлюються на кожній ітерації. Нуль, яким завершується введення, не враховується, тому що `break` стоїть перед командами оновлення.

    ### Початкове значення — перед циклом

    Місце, де встановлюється початкове значення, дуже важливе. Якщо зробити це всередині циклу, допоміжна змінна починатиме відлік заново на кожній ітерації:

    ```python run
    while True:
        count = 0
        word = input("Word (stop to finish): ")
        if word == "stop":
            break
        count += 1
    print(f"You typed {count} words.")
    ```

    ```input
    sun
    moon
    stop
    ```

    ```output
    Word (stop to finish): sun
    Word (stop to finish): moon
    Word (stop to finish): stop
    You typed 0 words.
    ```

    На останній ітерації команда `count = 0` виконується ще раз — безпосередньо перед `break`, тому весь попередній підрахунок втрачається. Перенеси цей рядок перед `while True:`, і програма повідомить `2`.

    ### Як запам'ятати причину завершення циклу

    У циклі може бути кілька команд `break`. Допоміжна змінна може зберегти, яка саме з них завершила цикл, щоб код після циклу знав причину. У цьому мікроавтобусі є `3` місця. Він відправляється, коли всі місця зайняті, або раніше, якщо більше немає пасажирів:

    ```python run
    seats = 3
    on_board = 0
    while True:
        name = input("Passenger (end when nobody is left): ")
        if name == "end":
            full = False
            break
        on_board += 1
        print(f"Welcome aboard, {name}!")
        if on_board == seats:
            full = True
            break
    if full:
        print("The bus is full. Next stop!")
    else:
        print(f"The bus leaves with {on_board} passengers.")
    ```

    ```input
    Ada
    Ben
    end
    ```

    ```output
    Passenger (end when nobody is left): Ada
    Welcome aboard, Ada!
    Passenger (end when nobody is left): Ben
    Welcome aboard, Ben!
    Passenger (end when nobody is left): end
    The bus leaves with 2 passengers.
    ```

    Якщо замість `end` ввести третє ім'я, цикл завершиться через другий `break`, а змінна `full` матиме значення `True`. Оскільки `full` містить `True` або `False`, її можна безпосередньо використовувати як умову `if`.

    **Your turn:** заповни пропуски, щоб програма підсумовувала введену користувачем кількість хвилин тренувань:

    ```
    Minutes of exercise (0 to finish): 30
    Minutes of exercise (0 to finish): 45
    Minutes of exercise (0 to finish): 0
    Total: 75 minutes
    ```
  hints:
  - До введення першого числа до суми ще нічого не додано.
  - Початкове значення суми — `0`, а `total += minutes` додає кожне введене число.
  more:
  - index: 0
    task: |
      Напиши програму, яка зчитує температуру за кожен день, доки користувач не введе `end`. Після цього вона виводить, скільки днів температура була нижчою за нуль, і загальну кількість днів.

      ```
      Temperature: 3
      Temperature: -2
      Temperature: -7
      Temperature: 1
      Temperature: end
      Frosty days: 2 of 4
      ```
    hints:
    - Спочатку зчитай значення як рядок і порівняй із `"end"`. Лише потім перетвори його на число за допомогою `int(...)`.
    - Потрібні дві допоміжні змінні, які починаються з `0` перед циклом. Одна рахує всі дні, а друга — лише дні
      з температурою нижче нуля.
    - Всередині циклу `days += 1` виконується для кожного числового значення, а `frosty += 1` — лише всередині `if
      temperature < 0:`.
  - index: 1
    task: |
      Напиши програму для накопичення `100` євро. Вона запитує суми внесків і після кожного показує, скільки вже накопичено. Щойно загальна сума досягне щонайменше `100`, програма виводить кількість зроблених внесків.

      ```
      Deposit: 40
      Saved so far: 40
      Deposit: 35
      Saved so far: 75
      Deposit: 30
      Saved so far: 105
      Goal reached! Deposits made: 3
