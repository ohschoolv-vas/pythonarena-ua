      ```
    hints:
    - Почни з `while True:` і зчитуй замовлення всередині циклу, щоб запитання повторювалося на кожній ітерації.
    - Відразу після введення перевір, чи дорівнює відповідь `nothing`. Якщо так — виконай `break`. Інакше виведи
      відповідь за допомогою f-рядка (*f-string*).
    - Рядок прощання має бути після циклу, без відступу.
