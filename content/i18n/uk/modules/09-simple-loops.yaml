- id: simple-loops-building-strings
  sourceTitle: Building strings in a loop
  title: Створення рядків у циклі
  text: |
    Англійський термін: **helper variable** — допоміжна змінна.
    

    Допоміжна змінна не обов'язково має зберігати число. Рядок теж може поступово збільшуватися в циклі: почни з **порожнього рядка** (*empty string*) `""` і додавай до нього символи за допомогою `+=`. Для рядків цей оператор виконує об'єднання, як і `+`:

    ```python run
    stars = ""
    count = 0
    while True:
        stars += "*"
        count += 1
        if count == 5:
            break
    print(stars)
    ```

    ```output
    *****
    ```

    На кожній ітерації до кінця `stars` додається одна зірочка `*`, а готовий рядок виводиться один раз — після завершення циклу.

    ### Збирання введених даних

    Так само програма може накопичувати текст, який вводить користувач:

    ```python run
    guests = ""
    while True:
        name = input("Guest (done to finish): ")
        if name == "done":
            break
        guests += name
    print("Guests: " + guests)
    ```

    ```input
    Ada
    Alan
    Grace
    done
    ```

    ```output
    Guest (done to finish): Ada
    Guest (done to finish): Alan
    Guest (done to finish): Grace
    Guest (done to finish): done
    Guests: AdaAlanGrace
    ```

    Майже вдалося: `+=` об'єднує рядки точно в такому вигляді, у якому вони записані, тому імена злилися. Потрібно розділити їх комою та пробілом, але **не** ставити роздільник перед першим іменем чи після останнього. Отже, додавай роздільник **перед** кожним наступним іменем, крім першого:

    ```python run
    guests = ""
    while True:
        name = input("Guest (done to finish): ")
        if name == "done":
            break
        if guests == "":
            guests = name
        else:
            guests += ", " + name
    print("Guests: " + guests)
    ```

    ```input
    Ada
    Alan
    Grace
    done
    ```

    ```output
    Guest (done to finish): Ada
    Guest (done to finish): Alan
    Guest (done to finish): Grace
    Guest (done to finish): done
    Guests: Ada, Alan, Grace
    ```

    Порівняння `guests == ""` істинне лише для першого імені, поки до рядка ще нічого не додано.

    ### Додавання чисел до рядка

    Оператор `+` об'єднує лише рядки, тому перед додаванням числа його потрібно перетворити на рядок за допомогою `str`:

    ```python repl
    >>> row = ""
    >>> row += str(1) + " "
    >>> row += str(2) + " "
    >>> row
    '1 2 '
    ```

    Без `str` Python зупиниться з помилкою `TypeError`, яку ти вже зустрічав: `can only concatenate str (not "int") to str`.

    **Your turn:** напиши програму, яка запитує число та виводить зворотний відлік від нього в одному рядку, а потім повідомлення `Liftoff!`:

    ```
    Count down from: 5
    5 4 3 2 1 Liftoff!
    ```
  hints:
  - Перед циклом створи порожній рядок `line = ""` і виведи його лише один раз — після циклу.
  - 'На кожній ітерації додавай число та пробіл: `line += str(number) + " "`. Потім зменшуй лічильник командою `number
    -= 1`.'
  - Коли число дорівнює `0`, заверши цикл за допомогою `break`, а наприкінці виведи `line + "Liftoff!"`.
