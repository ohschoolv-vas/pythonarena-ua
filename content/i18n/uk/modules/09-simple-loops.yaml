    hints:
    - 'Перед циклом створи дві допоміжні змінні зі значенням `0`: накопичену суму та кількість внесків.'
    - Кожна ітерація зчитує внесок, додає його до суми, збільшує лічильник внесків і виводить накопичену суму.
    - 'Перевірка `if saved >= 100: break` стоїть після `print`, тому остання накопичена сума також виводиться.'
- id: simple-loops-debugging
  sourceTitle: Debugging loops with print
  title: Налагодження циклів за допомогою `print`
  text: |
    У циклі ті самі рядки виконуються багато разів, але щоразу з іншими значеннями. Тому помилка (*bug*) може приховуватися в будь-якій ітерації. Особливо корисним тут є **налагоджувальне виведення** (*debugging prints*): додатковий `print` усередині циклу показує, що відбувається на кожній ітерації.

    Ця програма має обчислювати середнє арифметичне введених чисел, але для `4` і `8` виводить `4.0` замість `6.0`:

    ```python run
    total = 0
    count = 0
    while True:
        number = int(input("Number (0 to finish): "))
        count += 1
        if number == 0:
            break
        total += number
    print(f"Average: {total / count}")
    ```

    ```input
    4
    8
    0
    ```

    ```output
    Number (0 to finish): 4
    Number (0 to finish): 8
    Number (0 to finish): 0
    Average: 4.0
    ```

    Додай налагоджувальний `print` наприкінці тіла циклу та ще один відразу після циклу. Підпиши кожне значення, щоб їх було легко розрізнити:

    ```python run
    total = 0
    count = 0
    while True:
        number = int(input("Number (0 to finish): "))
        count += 1
        if number == 0:
            break
        total += number
        print("number:", number, "count:", count, "total:", total)
    print("after the loop, count:", count, "total:", total)
    print(f"Average: {total / count}")
    ```

    ```input
    4
    8
    0
    ```

    ```output
    Number (0 to finish): 4
    number: 4 count: 1 total: 4
    Number (0 to finish): 8
    number: 8 count: 2 total: 12
    Number (0 to finish): 0
    after the loop, count: 3 total: 12
    Average: 4.0
    ```

    Під час виконання циклу значення правильні, але після нього `count` дорівнює `3`: нуль, який завершив введення, теж потрапив до підрахунку. Це сталося тому, що `count += 1` виконується **перед** перевіркою. Якщо перенести цей рядок після `if`, програма працюватиме правильно. Тоді налагоджувальні команди можна прибрати.

    ### Які команди пропускає break

    Команда `break` завершує цикл саме в тому місці, де її виконано. Отже, на останній ітерації всі рядки нижче за неї пропускаються. Часто це саме те, що потрібно: у виправленій програмі вище нуль не повинен враховуватися. Але якщо перевірка стоїть зарано, цикл може втратити останнє значення. Припустімо, цикл має завершитися після п'ятої оцінки, проте `if count == 5:` із `break` стоїть **перед** додаванням оцінки до суми. Тоді п'яту оцінку зчитають і порахують, але не додадуть. Налагоджувальний `print` після циклу покаже, що сума замала, а покроковий перегляд останньої ітерації допоможе знайти пропущений рядок.

    Під час налагодження спочатку перевіряй цикл на невеликій кількості ітерацій: зазвичай двох-трьох достатньо, щоб помітити проблему, а виведення залишатиметься зрозумілим.

    **Your turn:** туристичний похід складається щонайбільше з `4` етапів. Програма зчитує довжину кожного етапу, доки користувач не введе `0` або не буде введено всі чотири етапи. Після цього вона виводить кількість етапів і загальну відстань. Але для чотирьох етапів відстань виходить замалою. Знайди помилку (допоможуть налагоджувальні команди `print`) і виправ її:

    ```
    Stage length in km (0 to stop): 3
    Stage length in km (0 to stop): 5
    Stage length in km (0 to stop): 2
    Stage length in km (0 to stop): 4
    Stages: 4, distance: 14 km
    ```
  hints:
