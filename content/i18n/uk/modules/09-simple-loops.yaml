# Українська локалізація Python Arena.
# Змінюються лише навчальні тексти, заголовки й підказки. Код, перевірки та ідентифікатори залишаються оригінальними.
id: simple-loops
summary: Повторення коду за допомогою циклу (*loop*) `while True` та вихід через `break`, цикли з лічильниками,
  допоміжні змінні для підрахунку й накопичення суми, налагодження (*debugging*) циклів і поступове створення рядків.
steps:
- id: simple-loops-while-true
  sourceTitle: Repeating with while True
  title: Повторення за допомогою `while True`
  text: |
    Досі кожен рядок програми виконувався щонайбільше один раз. Але часто потрібно повторювати ті самі дії: запитувати наступне число або проводити ще один раунд гри. **Цикл** (*loop*) повторює блок коду. Найпростіший цикл у Python — `while True`, а команда `break` завершує його:

    ```python run
    while True:
        word = input("Say something (bye to quit): ")
        if word == "bye":
            break
        print(f"You said: {word}")
    print("Goodbye!")
    ```

    ```input
    hello
    loops are fun
    bye
    ```

    ```output
    Say something (bye to quit): hello
    You said: hello
    Say something (bye to quit): loops are fun
    You said: loops are fun
    Say something (bye to quit): bye
    Goodbye!
    ```

    Ось як це працює:

    - `while True:` розпочинає цикл. Рядки з відступом після нього утворюють тіло циклу (*loop body*).
    - Коли Python доходить до кінця тіла циклу, він повертається до рядка `while` і виконує його знову. Одне виконання тіла циклу називають **ітерацією** (*iteration*).
    - `break` негайно завершує цикл. Python переходить до першого рядка після його тіла — у цьому прикладі до `print("Goodbye!")`.

    Команда `break` розміщена всередині `if`, тому цикл завершується лише тоді, коли користувач вводить `bye`. На цій ітерації останній рядок тіла циклу вже не виконується, бо цикл зупинився.

    ### Цикл, який ніколи не закінчується

    Якщо команда `break` ніколи не виконується, цикл повторюється без кінця. Це **нескінченний цикл** (*infinite loop*). Наступна програма повинна зупинятися після введення `0`, але цього не відбувається:

    ```python fragment
    while True:
        answer = input("Play another round? (1 = yes, 0 = no) ")
        if answer == 0:
            break
        print("Here we go again!")
    ```

    `input` повертає рядок. Тому після введення `0` змінна `answer` містить рядок `"0"`, а не число `0`, і порівняння `"0" == 0` є хибним. Умова ніколи не стане істинною, тож програма знову й знову запитуватиме відповідь. Щоб виправити помилку, порівнюй із рядком `answer == "0"` або спочатку перетвори введене значення за допомогою `int`. У кожному циклі `while True` має бути можливість дійти до `break`. (Якщо цикл не очікує введення і ніколи не доходить до `break`, він працює безперервно з максимальною швидкістю. На цьому сайті програму, що виконується довше кількох секунд, автоматично зупиняють.)

    ### Запитування до правильної відповіді

    Цикл також допомагає повторювати запитання, доки користувач не введе прийнятне значення:

    ```python run
    while True:
        age = int(input("Your age: "))
        if age >= 0:
            break
        print("An age can't be negative. Try again.")
    print(f"Thanks! You are {age}.")
    ```

    ```input
    -5
    31
    ```

    ```output
    Your age: -5
    An age can't be negative. Try again.
    Your age: 31
    Thanks! You are 31.
    ```

    Зверни увагу на порядок дій у циклі: спочатку зчитати значення, потім завершити цикл, якщо воно підходить, і лише після цього вивести повідомлення про помилку. Воно з’являється тільки тоді, коли цикл не завершився.

    **Your turn:** заповни пропуски, щоб програма запитувала команди доти, доки користувач не введе `quit`:

    ```
    Command: jump
    Running jump...
    Command: run
    Running run...
    Command: quit
    Shutting down.
    ```
  hints:
  - Перший рядок запускає цикл, який повторюється, доки його не завершить спеціальна команда.
  - Цикл починається з `while True:`, а команда для його завершення — `break`.
  more:
