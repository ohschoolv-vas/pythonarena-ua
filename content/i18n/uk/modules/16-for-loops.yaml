id: for-loops
summary: Цикл for, який послідовно перебирає елементи списку або символи рядка. Лічба за допомогою range, перетворення range на список, створення нових списків у циклі та самостійний пошук найкращого елемента списку.
steps:
- id: for-loops-lists
  title: Перебір елементів списку за допомогою for
  text: |
    Списки створені для перебору: можна вивести кожну ціну, підсумувати всі бали або перевірити кожне ім’я. У Python для цього є спеціальний цикл — **`for`**:

    ```python run
    prices = [12, 5, 30]
    for price in prices:
        print(price)
    ```

    ```output
    12
    5
    30
    ```

    Читай цей запис як «для кожної ціни `price` зі списку `prices`». На першій ітерації змінна після `for` (тут `price`) містить перший елемент — 12, і виконується блок коду з відступом. На наступній ітерації `price` дорівнює 5, а на останній — 30. Після останнього елемента цикл завершується, і програма переходить до наступного рядка після циклу.

    Змінну циклу можна назвати як завгодно. Краще вибирати назву, яка пояснює, що зберігає елемент: `for price in prices`, `for name in names`.

    Якщо використовувати лише `while`, для тієї самої роботи знадобиться власний лічильник:

    ```python fragment
    index = 0
    while index < len(prices):
        print(prices[index])
        index += 1
    ```

    Тут чотири рядки замість двох і три можливі помилки: почати лічбу з неправильного числа, написати `<=` замість `<` або забути `index += 1` й отримати нескінченний цикл. У `for` не потрібно самостійно керувати лічильником, тому цих помилок можна уникнути.

    ### Цикли з визначеною та невизначеною кількістю повторень

    Цикл `while` повторюється, доки його умова істинна. Не завжди можна наперед сказати, скільки буде повторень: наприклад, цикл може чекати, доки користувач введе `quit`. Це **ітерування з невизначеною кількістю повторень** (*indefinite iteration*). Цикл `for` перебирає вже наявну послідовність, тому на початку відома кількість повторень — по одному на елемент. Це **ітерування з визначеною кількістю повторень** (*definite iteration*).

    ### Опрацювання кожного елемента

    Цикли можуть не лише виводити значення. Допоміжна змінна, створена перед циклом, накопичує результат під час перебору елементів:

    ```python run
    prices = [12, 5, 30, 8]
    total = 0
    cheap = 0
    for price in prices:
        total += price
        if price < 10:
            cheap += 1
    print("Сума:", total)
    print("Менше ніж 10:", cheap)
    ```

    ```output
    Сума: 55
    Менше ніж 10: 2
    ```

    Функція `sum(prices)` теж обчислила б суму. Але цикл дає змогу виконувати з кожним елементом будь-які дії: тут він ще й підраховує кількість дешевих товарів, для чого немає окремої готової функції.

    Усередині функції команда `return` у циклі одразу завершує роботу всієї функції. Якщо функція має опрацювати кожен елемент, розміщуй `return` після циклу (без відступу, який належить тілу циклу).

    **Your turn:** заповни пропуски, щоб цикл вивів привітання для кожного гостя:

    ```
    Welcome, Ada!
    Welcome, Linus!
    Welcome, Grace!
    ```
  hints:
  - "Рядок циклу можна прочитати як «для кожного гостя `guest` зі списку `guests`»."
  - "Два пропущені слова — ключові слова Python `for` та `in`."
  more:
  - index: 0
    task: |
      Напиши функцію `count_over(numbers: list, limit: int) -> int`, яка повертає кількість чисел у списку, більших за `limit`. Наприклад, `count_over([3, 12, 7, 20], 5)` повертає `3`.
    hints:
    - "Перед циклом створи допоміжну змінну `count` зі значенням 0."
    - "Перебирай список за допомогою `for number in numbers:` і збільшуй `count` на 1, коли `number > limit`."
    - "Поверни `count` після циклу, з тим самим рівнем відступу, що й рядок `for`."
  - index: 1
    task: |
      Що виведе ця програма? Запиши кожен рядок її виводу.
    hints:
    - Цикл перебирає числа по одному, у заданому порядку, та виводить рядок для кожного з них.
    - "До `total` додаються лише додатні числа, але `print` усередині циклу виконується для кожного числа."
    - "Останній рядок розташований після циклу, тому виводиться лише один раз, наприкінці."

- id: for-loops-strings
  title: Перебір символів рядка
  text: |
    Цикл `for` також може перебирати рядок — по одному символу за раз:

    ```python run
    word = input("Слово: ")
    for char in word:
        print(char)
    ```

    ```input
    Hello
    ```

    ```output
    Слово: Hello
    H
    e
    l
    l
    o
    ```

    Пробіли та розділові знаки теж є символами, тому цикл перебирає і їх. `char` — лише назва змінної; так само можна використати `letter` або `c`.

    ### Підрахунок символів

    За допомогою додаткової змінної цикл може підраховувати символи певного типу. У цьому прикладі оператор `in` перевіряє, чи належить символ до англійських голосних у рядку `"aeiou"`:

    ```python run
    text = "Programming is fun"
    vowels = 0
    for char in text.lower():
        if char in "aeiou":
            vowels += 1
    print("Голосних:", vowels)
    ```

    ```output
    Голосних: 5
    ```

    Цикл перебирає `text.lower()` — копію тексту, у якій усі літери переведені в нижній регістр. Тому велика літера `A` теж буде врахована.

    ### Створення нового рядка

    За допомогою циклу можна також створювати новий рядок, додаючи символи по одному. Почни з порожнього рядка `""` і доповнюй його оператором `+=`:

    ```python run
    text = "a quiet, calm day"
    result = ""
    for char in text:
        if char == " ":
            result += "_"
        else:
            result += char
    print(result)
    ```

    ```output
    a_quiet,_calm_day
    ```

    Початковий рядок не змінюється: `result` — це новий рядок, у якому замість кожного пробілу з `text` стоїть символ підкреслення.

    Такі цикли можна використовувати й у функціях. Функція, яка отримує рядок як параметр, так само перебирає його символи, а наприкінці повертає кількість збігів або новий рядок:

    ```python run
    def count_char(text: str, wanted: str) -> int:
        count = 0
        for char in text:
            if char == wanted:
                count += 1
        return count


    print(count_char("banana", "a"))
    print(count_char("banana", "x"))
    ```

    ```output
    3
    0
    ```

    **Your turn:** заповни пропуски, щоб програма підрахувала, скільки разів у введеному тексті трапляється англійська літера `a` — мала або велика:

    ```
    Text: Banana Split
    Letter a: 3
    ```
  hints:
  - "Цикл перебирає рядок, введений користувачем, який зберігається у змінній `text`."
  - "Щоб врахувати також велику `A`, порівнюй символ у нижньому регістрі: `char.lower()`."
  more:
  - index: 0
    task: |
      Напиши функцію `hide_digits(text: str) -> str`, яка повертає копію тексту, де кожну цифру (від 0 до 9) замінено на `#`. Усі інші символи мають залишитися незмінними. Наприклад, `hide_digits("Call 555-0123")` повертає `'Call ###-####'`.
    hints:
    - "Створи новий рядок: почни з `result = \"\"` і перебирай `text` за допомогою циклу `for`."
    - "Вираз `char in \"0123456789\"` істинний для цифри. У такому разі додай до `result` символ `\"#\"`, а інакше — сам символ."
    - "Поверни `result` після циклу."
  - index: 1
    task: |
      Що виведе ця програма? Запиши кожен рядок її виводу.
    hints:
    - "У першому циклі кожен символ додається на початок `result`, а не в кінець."
    - "Якщо додавати кожен символ на початок, слово записуватиметься у зворотному порядку."
    - "Другий цикл підраховує кількість літер `s` у слові `mississippi`."

- id: for-loops-range
  title: Лічба за допомогою range
  text: |
    Часто потрібно повторити дію певну кількість разів або послідовно перебрати числа. Функція **`range`** задає послідовність чисел, а цикл `for` перебирає їх. З одним аргументом `range(n)` дає числа від 0 до `n - 1`:

    ```python run
    for i in range(4):
        print(i)
    ```

    ```output
    0
    1
    2
    3
    ```

    Це чотири числа, починаючи з 0: `range(4)` зупиняється перед 4. Тому `for i in range(4):` виконує блок чотири рази — часто саме це й потрібно.

    ### Початок, кінець і крок

    З двома аргументами `range(start, end)` починає послідовність зі значення `start`, а не з 0. Значення `end`, як і раніше, не включається:

    ```python run
    for number in range(1, 6):
        print(number, "у квадраті дорівнює", number * number)
    ```

    ```output
    1 у квадраті дорівнює 1
    2 у квадраті дорівнює 4
    3 у квадраті дорівнює 9
    4 у квадраті дорівнює 16
    5 у квадраті дорівнює 25
    ```

    Щоб отримати числа до 5 включно, кінцеве значення має бути 6. Забувати про це — найпоширеніша помилка з `range`: цикл завершується на одне число раніше, ніж потрібно.

    Третій аргумент — це **крок**, тобто величина, на яку змінюється число щоразу:

    ```python run
    for year in range(2000, 2025, 8):
        print(year)
    ```

    ```output
    2000
    2008
    2016
    2024
    ```

    Крок може бути від’ємним — тоді числа йдуть у зворотному порядку. У такому разі початкове значення більше за кінцеве (яке знову не включається):

    ```python run
    for i in range(5, 0, -1):
        print(i)
    print("Пуск!")
    ```

    ```output
    5
    4
    3
    2
    1
    Пуск!
    ```

    Порівняй із циклом `while`, для якого знадобилися б лічильник, умова та `-= 1`. Завдяки `range` усе це можна задати в одному рядку.

    Змінну циклу можна використовувати так само, як і будь-яку іншу змінну. У цьому прикладі функція за її допомогою створює рядок із чисел:

    ```python run
    def number_line(n: int) -> str:
        line = ""
        for i in range(1, n + 1):
            line += str(i) + " "
        return line


    print(number_line(5))
    ```

    ```output
    1 2 3 4 5
    ```

    **Your turn:** заповни пропуски, щоб цикл вивів парні числа від 2 до 10:

    ```
    2
    4
    6
    8
    10
    ```
  hints:
  - "Почни з 2 і використовуй крок 2. Кінцеве значення не включається, тому воно має бути більшим за 10."
  - "`range(2, 11, 2)` дає числа 2, 4, 6, 8 і 10."
  more:
  - index: 0
    task: |
      Напиши програму, яка запитує ціле число, відраховує від нього до 1 у зворотному порядку (по одному числу в рядку), а потім виводить `Пуск!`. Використай `for` та `range`:

      ```
      Count down from: 3
      3
      2
      1
      Liftoff!
      ```
    hints:
    - "Для зворотного відліку потрібен від’ємний крок: `range(start, ..., -1)`."
    - "Кінцеве значення не включається, тому, щоб зупинитися на 1, потрібно задати 0."
    - "`for i in range(start, 0, -1):` виводить `i`, а `Пуск!` — після циклу."
  - index: 1
    task: |
      Напиши функцію `sum_of_squares(n: int) -> int`, яка повертає суму 1 · 1 + 2 · 2 + ... + n · n. Наприклад, `sum_of_squares(3)` повертає `14`, оскільки 1 + 4 + 9 = 14.
    hints:
    - "Числа йдуть від 1 до `n`, тому використай `range(1, n + 1)`."
    - "Створи допоміжну змінну `total` і додавай до неї `i * i` в циклі."
    - Поверни `total` після циклу.
- id: for-loops-building-lists
  title: Діапазони, списки та створення нових списків
  text: |
    `range` не створює список. Він надає числа по одному, коли цикл переходить до наступного значення, тому немає потреби зберігати їх усі одночасно. Саме тому, якщо вивести об’єкт `range`, буде показано його опис, а не всі числа:

    ```python run
    hours = range(8, 13)
    print(hours)
    print(list(hours))
    print(list(range(10, 0, -3)))
    ```

    ```output
    range(8, 13)
    [8, 9, 10, 11, 12]
    [10, 7, 4, 1]
    ```

    Функція **`list`** перетворює об’єкт `range` на справжній список з усіма його числами. Але циклу `for` це не потрібно: він однаково добре перебирає і `range`, і список.

    ### Створення нового списку

    Часто потрібно створити новий список на основі наявного. Почни з порожнього списку й додавай елементи методом `append` у циклі. У новому списку можна залишити лише частину елементів:

    ```python run
    def passed(scores: list) -> list:
        result = []
        for score in scores:
            if score >= 50:
                result.append(score)
        return result


    scores = [72, 35, 50, 90, 48]
    print(passed(scores))
    print(scores)
    ```

    ```output
    [72, 50, 90]
    [72, 35, 50, 90, 48]
    ```

    Або змінювати кожен елемент під час додавання:

    ```python run
    def half_price(prices: list) -> list:
        result = []
        for price in prices:
            result.append(price / 2)
        return result


    print(half_price([10, 4, 30]))
    ```

    ```output
    [5.0, 2.0, 15.0]
    ```

    В обох випадках початковий список залишається незмінним, а функція повертає новий.

    ### Коли потрібен індекс

    Іноді недостатньо знати сам елемент — потрібен також його індекс. Наприклад, щоб порівняти елемент із сусіднім або з елементом на тій самій позиції в іншому списку. Тоді перебирай індекси за допомогою `range(len(...))`:

    ```python run
    home = [2, 0, 3]
    away = [1, 0, 4]
    for i in range(len(home)):
        print(f"Матч {i + 1}: {home[i]}-{away[i]}")
    ```

    ```output
    Матч 1: 2-1
    Матч 2: 0-0
    Матч 3: 3-4
    ```

    `range(len(home))` дає індекси 0, 1 та 2, а `home[i]` і `away[i]` — це елементи з однаковими індексами у двох списках.

    **Your turn:** напиши функцію `multiples(number: int, count: int) -> list`, яка повертає список із перших `count` кратних числа `number`. Наприклад, `multiples(3, 4)` повертає `[3, 6, 9, 12]`.
  hints:
  - "Почни з порожнього списку `result` і поверни його після циклу, який на кожній ітерації додає один елемент."
  - "Елементи — це `number * 1`, `number * 2` тощо, аж до `number * count`. Перебери ці множники за допомогою `for i in range(1, count + 1):`."
  - "У циклі викликай `result.append(number * i)`."
  more:
  - index: 0
    task: |
      Напиши функцію `long_words(words: list, min_length: int) -> list`, яка повертає новий список слів, що містять щонайменше `min_length` символів, зі збереженням їхнього початкового порядку. Наприклад, `long_words(["sun", "planet", "moon", "galaxy"], 5)` повертає `['planet', 'galaxy']`.
    hints:
    - "Почни з порожнього списку `result` і перебери `words` за допомогою циклу `for`."
    - "Додавай слово, коли виконується умова `len(word) >= min_length`."
    - "Поверни `result` після циклу. Якщо довгих слів немає, результатом буде порожній список `[]`."
  - index: 1
    task: |
      Напиши функцію `changes(values: list) -> list`, яка повертає список змін між кожним значенням і попереднім. Новий список має на один елемент менше, ніж початковий. Наприклад, `changes([3, 5, 4, 10])` повертає `[2, -1, 6]`: 5 - 3 = 2, 4 - 5 = -1, а 10 - 4 = 6.
    hints:
    - "Щоб знайти зміну, потрібно порівняти два сусідні елементи, тому перебирай індекси, а не самі елементи."
    - "Почни з індексу 1, адже перед першим елементом немає попереднього: `for i in range(1, len(values)):`."
    - "Зміна для індексу `i` — це `values[i] - values[i - 1]`. Додавай її до нового списку й повертай список після циклу."
- id: for-loops-best-item
  title: Пошук найкращого елемента
  text: |
    Функції `max` і `min` знаходять лише найбільше або найменше значення. Але іноді потрібен інший критерій: найдовше слово, день із найбільшою кількістю опадів або число, найближче до заданого. Тоді пошук можна написати самостійно. Секрет — у змінній, заданій перед циклом, яка зберігає **найкращий знайдений елемент**. Кожен наступний елемент порівнюється з ним, і кращий із двох залишається:

    ```python run
    def longest(words: list) -> str:
        best = words[0]
        for word in words:
            if len(word) > len(best):
                best = word
        return best


    print(longest(["fig", "banana", "kiwi", "cherry"]))
    ```

    ```output
    banana
    ```

    Спочатку `best` містить перше слово зі списку, тож є з чим порівнювати. На кожній ітерації, якщо чергове слово довше за `best`, воно стає новим найкращим. Після завершення циклу всі слова перевірені, тому в `best` зберігається найдовше. `cherry` має ту саму довжину, що й `banana`, але не більшу, тому залишається перше з них.

    ### З якого значення почати

    Початковим значенням допоміжної змінної має бути елемент списку, а не довільне число. Значення 0 здається зручним, але призводить до помилки, коли жоден елемент не може його перевершити: під час пошуку найтеплішого дня, якщо всі температури нижчі за 0, або найхолоднішого — якщо всі температури вищі за 0:

    ```python run
    def coldest(temperatures: list) -> int:
        best = 0
        for t in temperatures:
            if t < best:
                best = t
        return best


    def warmest(temperatures: list) -> int:
        best = 0
        for t in temperatures:
            if t > best:
                best = t
        return best


    winter = [-8, -3, -12, -5]
    summer = [21, 18, 25]
    print(coldest(winter))
    print(warmest(winter))
    print(coldest(summer))
    ```

    ```output
    -12
    0
    0
    ```

    Найтепліша зимова температура — не 0, а -3. Найхолодніша літня температура — також не 0, а 18. В обох помилкових випадках жодна температура не виявилася кращою за початкове значення 0 за відповідним критерієм, тому функції повернули 0, хоча його навіть немає у списку. Якщо почати з `best = temperatures[0]`, обидві функції працюватимуть правильно для будь-якого непорожнього списку.

    ### Як запам’ятати позицію найкращого елемента

    Щоб знати не лише значення найкращого елемента, а й його позицію, запам’ятовуй індекс. Перебирай індекси та зберігай індекс найкращого знайденого елемента:

    ```python run
    def rainiest_day(rain: list) -> int:
        best = 0
        for i in range(len(rain)):
            if rain[i] > rain[best]:
                best = i
        return best + 1


    week = [2, 0, 14, 5, 14, 1, 0]
    print("День із найбільшими опадами:", rainiest_day(week))
    ```

    ```output
    День із найбільшими опадами: 3
    ```

    Тут `best` — це індекс, тому правильно почати з 0: це означає перший день. Функція повертає `best + 1`, адже люди нумерують дні, починаючи з 1.

