id: tuples
summary: Кортежі — це схожі на списки послідовності, які не можна змінювати. Що таке кортежі, для чого вони потрібні, як використовувати їх як ключі словника, а також як повертати кілька значень, розпаковувати кортежі й міняти значення місцями.
steps:
- id: tuples-basics
  title: Що таке кортеж
  text: |
    **Кортеж** (*tuple*) дуже схожий на список: це впорядкована група значень, до елементів якої можна звертатися за індексом, робити зрізи, перебирати в циклі та визначати їхню кількість за допомогою `len`. Є дві відмінності. Кортеж записують у круглих дужках `( )`, а не у квадратних, і після створення його не можна змінювати.

    ```python run
    point = (3, 7)
    print(point)
    print("x:", point[0])
    print("y:", point[1])

    colors = ("червоний", "зелений", "синій")
    print(len(colors), colors[-1])
    print("зелений" in colors)
    for color in colors[1:]:
        print(color)
    ```

    ```output
    (3, 7)
    x: 3
    y: 7
    3 синій
    True
    зелений
    синій
    ```

    Python відображає кортеж у круглих дужках. Зріз кортежу також є кортежем.

    ### Кортеж не можна змінювати

    Кортежі — **незмінні** (*immutable*), як і рядки та числа. Спроба присвоїти нове значення елементу за індексом призводить до помилки:

    ```python run crash
    point = (3, 7)
    point[0] = 4
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        point[0] = 4
        ~~~~~^^^
    TypeError: 'tuple' object does not support item assignment
    ```

    Кортеж також не має методів, які змінюють список: `append`, `remove` або `sort`.

    ```python repl
    >>> colors = ("червоний", "зелений")
    >>> colors.append("синій")
    Traceback (most recent call last):
      File "<stdin>", line 1, in <module>
    AttributeError: 'tuple' object has no attribute 'append'
    ```

    Функції, які лише читають дані, працюють із кортежами: `len`, `min`, `max`, `sum` і `sorted` (остання повертає новий список). Якщо потрібно отримати кортеж з іншими значеннями, створіть новий кортеж і присвойте його змінній:

    ```python repl
    >>> point = (3, 7)
    >>> point = (4, point[1])
    >>> point
    (4, 7)
    ```

    ### Списки кортежів

    Кортеж добре підходить для невеликого запису, частини якого пов'язані між собою, наприклад імені та року народження. У списку можна зберігати багато таких кортежів:

    ```python run
    pioneers = [("Ada", 1815), ("Alan", 1912), ("Grace", 1906)]
    for pioneer in pioneers:
        print(f"{pioneer[0]} — рік народження: {pioneer[1]}")
    ```

    ```output
    Ada — рік народження: 1815
    Alan — рік народження: 1912
    Grace — рік народження: 1906
    ```

    Список може збільшуватися або зменшуватися, коли людей додають чи видаляють, але кожен окремий кортеж залишається таким, яким його створили.

    **Your turn:** що виведе ця програма? Запиши кожен рядок виводу.
  hints:
  - Індексація, `len` та `in` працюють із кортежем так само, як зі списком.
  - "`sizes[-2:]` — це зріз із двох останніх елементів. Зріз кортежу теж є кортежем, тому Python показує його у круглих дужках."
  - "Оператор `in` перевіряє цілі елементи кортежу, а серед чотирьох елементів немає `\"XS\"`."
