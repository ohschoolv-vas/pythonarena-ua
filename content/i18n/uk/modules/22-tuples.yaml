      Напиши функцію `best_and_worst(results)`, яка приймає список кортежів `(name, score)` і повертає два значення: ім’я учасника з найвищим балом та ім’я учасника з найнижчим балом. Однакових результатів немає.

      Наприклад, `best_and_worst([("Ada", 92), ("Max", 78), ("Lin", 85)])` повертає `('Ada', 'Max')`.
