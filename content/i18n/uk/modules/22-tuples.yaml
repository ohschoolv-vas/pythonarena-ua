  - index: 1
    task: |
      Напиши функцію `count_visits(squares)`, яка приймає список кортежів `(row, column)` і повертає словник: кожна окрема клітинка є ключем, а її значення показує, скільки разів вона зустрічається у списку.

      Наприклад, `count_visits([(0, 0), (1, 2), (0, 0)])` повертає `{(0, 0): 2, (1, 2): 1}`.
    hints:
    - Кортеж може бути ключем словника, тому кожну пару координат можна використовувати без змін.
    - "Використай підрахунок: якщо клітинки ще немає серед ключів, встанови для неї значення 0, а потім збільш його на одиницю."
- id: tuples-unpacking
  title: Кортежі без круглих дужок
  text: |
    Кортеж утворюють коми, а не круглі дужки. Значення, розділені комами, утворюють кортеж навіть без дужок:

    ```python repl
    >>> numbers = 1, 2, 3
    >>> numbers
    (1, 2, 3)
    >>> single = 5,
    >>> single
    (5,)
    ```

    Для кортежу з одного елемента теж потрібна кома: `(5)` — це просто число 5 у дужках.

    ### Повернення кількох значень

    Функція повертає одне значення, але цим значенням може бути кортеж. Отже, функція може повернути кілька значень, якщо розділити їх комами:

    ```python run
    def to_minutes(total_seconds: int) -> tuple:
        return total_seconds // 60, total_seconds % 60


    result = to_minutes(135)
    print(result)

    minutes, seconds = to_minutes(135)
    print(f"{minutes} хв {seconds} с")
    ```

    ```output
    (2, 15)
    2 хв 15 с
    ```

    ### Розпакування

    Запис `minutes, seconds = to_minutes(135)` називається **розпакуванням** (*unpacking*): значення кортежу праворуч по черзі присвоюються змінним ліворуч. Кількість змінних має відповідати кількості значень:

    ```python run crash
    point = (3, 7, 1)
    x, y = point
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        x, y = point
        ^^^^
    ValueError: too many values to unpack (expected 2, got 3)
    ```

    Розпакування працює також у циклі `for`. Перебираючи список кортежів, можна відразу розпаковувати кожен із них. Саме це відбувається у виразі `for key, value in d.items()`: метод `items()` повертає пари ключів і значень словника у вигляді кортежів.

    ```python run
    pioneers = [("Ada", 1815), ("Alan", 1912), ("Grace", 1906)]
    for name, year in pioneers:
        print(name, year)

    ages = {"Ada": 36, "Max": 41}
    print(list(ages.items()))
    ```

    ```output
    Ada 1815
    Alan 1912
    Grace 1906
    [('Ada', 36), ('Max', 41)]
    ```

    ### Обмін значеннями двох змінних

    Щоб поміняти значення двох змінних місцями, зазвичай потрібна допоміжна змінна, адже перше присвоювання перезаписує одне зі значень:

    ```python fragment
    helper = a
    a = b
    b = helper
    ```

    За допомогою кортежу це можна зробити одним рядком. Python спочатку утворює кортеж зі значень праворуч, а вже потім розпаковує його у змінні ліворуч:

    ```python run
    a = 1
    b = 2
    a, b = b, a
    print(a, b)
    ```

    ```output
    2 1
    ```

    **Термінологія:** `swap` — обмін значеннями.

    **Your turn:** заповни пропуск, щоб цикл розпаковував кожен кортеж у змінні `name` та `score`, а програма виводила:

    ```
    Ada: 92 points
    Max: 78 points
    Lin: 85 points
    ```
  hints:
  - Кожен елемент списку — кортеж із двох значень, тому в циклі потрібні дві змінні.
  - "Запиши два імені змінних через кому: `name, score`."
