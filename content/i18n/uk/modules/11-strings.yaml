- id: strings-length
  sourceTitle: The length of a string
  title: Довжина рядка
  text: |
    У другій частині курсу ти познайомився з функцією `len` (від англійського *length* — «довжина»). Вона визначає кількість символів у рядку. Враховується кожен символ: літера, цифра, пробіл або розділовий знак. У цьому модулі ми навчимося застосовувати її в задачах.

    ```python run
    print(len("hello"))
    print(len("hello there!"))
    print(len(""))
    ```

    ```output
    5
    12
    0
    ```

    Порожній рядок `""` не містить жодного символу, тому його довжина дорівнює `0`. Зверни увагу: `len` рахує саме **символи**, а не слова. У рядку `"hello there!"` два слова, але `12` символів разом із пробілом і знаком оклику.

    Функція `len` повертає ціле число, тому її результат можна використовувати всюди, де потрібне число. Умова `len(name) < 3` істинна, якщо ім'я коротше за три символи, а вираз `len(first) > len(second)` порівнює довжини двох рядків. Обчислення `10 - len(word)` показує, скількох символів бракує слову до десяти. Також довжину можна використати як кількість повторень рядка. Ця програма підкреслює будь-який текст, який вводить користувач:

    ```python run
    title = input("Title: ")
    print(title)
    print("-" * len(title))
    ```

    ```input
    Loops and strings
    ```

    ```output
    Title: Loops and strings
    Loops and strings
    -----------------
    ```

    ### Вирівнювання тексту

    Довжина потрібна і для вирівнювання. Коли ти додаєш числа у стовпчик на папері, одиниці записуєш під одиницями, десятки — під десятками. Програма може зробити так само. Щоб розташувати число по правому краю стовпчика завширшки `6` символів, перед ним потрібно надрукувати `6 - len(number)` пробілів. Тут числа спочатку є рядками, адже `len` рахує символи. Функція `int` перетворює їх на числа для додавання, а `str` повертає результат до рядкового типу:

    ```python run
    first = "385"
    second = "1250"
    total = str(int(first) + int(second))
    print(" " * (6 - len(first)) + first)
    print(" " * (6 - len(second)) + second)
    print("-" * 6)
    print(" " * (6 - len(total)) + total)
    ```

    ```output
       385
      1250
    ------
      1635
    ```

    Дужки тут важливі. Без них вираз `" " * 6 - len(first)` спочатку створив би рядок із шести пробілів, а потім спробував би відняти від нього число — це призвело б до помилки.

    ### Числа не мають довжини

    `len` рахує символи **рядка**. Число не є рядком, тому в нього немає довжини в такому розумінні:

    ```python run crash
    year = 2026
    print(len(year))
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        print(len(year))
              ~~~^^^^^^
    TypeError: object of type 'int' has no len()
    ```

    Щоб порахувати цифри в числі, спочатку перетвори його на рядок: `len(str(year))` поверне `4`.

    **Your turn:** заповни пропуск, щоб програма підкреслила введений заголовок символами `=`. Кількість знаків підкреслення має точно дорівнювати кількості символів заголовка.

    ```
    Heading: Chapter one
    Chapter one
    ===========
    ```
  hints:
  - У рядку підкреслення має бути стільки символів `=`, скільки символів у заголовку.
  - '`len(...)` повертає кількість символів рядка, переданого в дужках.'
