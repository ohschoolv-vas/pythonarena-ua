      на `1` після кожного рядка.
    - Потрібна частина слова — зріз від `cut` до `len(word) - cut`. Перед ним надрукуй `cut` пробілів.
    - Цикл триває, поки у зрізі залишаються символи, тобто за умови `cut < len(word) - cut`.
- id: strings-searching
  sourceTitle: Searching in a string
  title: Пошук у рядку
  text: |
    Часто програмі потрібно з'ясувати, чи містить рядок певний фрагмент тексту. Для цього є оператор `in`: вираз `part in text` дорівнює `True`, якщо `part` трапляється всередині `text`, і `False` — якщо ні.

    ```python run
    text = "strawberry"
    print("straw" in text)
    print("berry" in text)
    print("Berry" in text)
    print("w" in text)
    ```

    ```output
    True
    True
    False
    True
    ```

    Регістр літер має значення: `"Berry"` з великої літери `B` не входить до рядка `"strawberry"`. Оператор `not in` перевіряє протилежне: наприклад, `"x" not in text` дорівнює `True`. Оскільки обидві перевірки повертають `True` або `False`, їх можна використовувати просто в умовах `if` або `while`:

    ```python run
    message = input("Message: ")
    if "!" in message:
        print("Sounds exciting")
    if "?" not in message:
        print("No questions asked")
    ```

    ```input
    Pizza tonight!
    ```

    ```output
    Message: Pizza tonight!
    Sounds exciting
    No questions asked
    ```

    ### На якій позиції? Метод `find`

    Оператор `in` повідомляє, чи є фрагмент у рядку, але не показує, **де саме**. Для цього в рядків є метод `find`: `text.find(part)` повертає індекс, з якого починається перше входження `part`, або `-1`, якщо такого фрагмента немає:

    ```python run
    text = "strawberry"
    print(text.find("berry"))
    print(text.find("r"))
    print(text.find("kiwi"))
    ```

    ```output
    5
    2
    -1
    ```

    У слові `strawberry` є три літери `r`, але `find` повертає індекс першої — `2`.

    Запис `find` відрізняється від звичайного виклику функції: його пишуть **після рядка через крапку**. Функцію, пов'язану з певним значенням, називають **методом** (*method*). `find` — це метод рядків, тому `text.find("r")` шукає символ у рядку `text`, який записано перед крапкою. Для порівняння: у функції `len(text)` рядок передається всередині дужок. У рядків є багато інших методів — із ними ти познайомишся пізніше.

    ### Індекс і зріз разом

    Індекс, який повертає `find`, зручно використовувати для зрізу. Ця програма розділяє назву файлу на частини за крапкою:

    ```python run
    file_name = input("File: ")
    dot = file_name.find(".")
    if dot >= 0:
        print("Name: " + file_name[:dot])
        print("Type: " + file_name[dot + 1:])
    else:
        print("No dot in the name")
    ```

    ```input
    notes.txt
    ```

    ```output
    File: notes.txt
    Name: notes
    Type: txt
    ```

    Перш ніж використовувати знайдений індекс, обов'язково перевір, що він не дорівнює `-1`. Інакше назва без крапки дала б індекс `-1`, а зріз `file_name[:-1]` непомітно відкинув би останній символ замість повідомлення про помилку.

    **Your turn:** заповни пропуск, щоб програма визначила, чи містить введений текст символ `@`.

    ```
    Email: ada@example.com
    Looks like an email address
    ```
  hints:
  - Потрібен оператор з одного слова, який перевіряє, чи трапляється фрагмент тексту всередині рядка.
  - Вираз `part in text` дорівнює `True`, коли `part` є десь у рядку `text`.
