- id: strings-indexing
  sourceTitle: One character at a time
  title: Посимвольний доступ до рядка
  text: |
    Рядок — це послідовність символів, і кожен символ має свій номер позиції — **індекс** (*index*). Індексація починається з `0`, а не з `1`: перший символ має індекс `0`, другий — `1` і так далі:

    ```text
    p  y  t  h  o  n
    0  1  2  3  4  5
    ```

    Щоб отримати окремий символ, запиши його індекс у квадратних дужках після рядка:

    ```python run
    word = "python"
    print(word[0])
    print(word[1])
    print(word[5])
    ```

    ```output
    p
    y
    n
    ```

    Отриманий символ теж є рядком, тільки завдовжки один символ. Його можна поєднувати з іншими рядками, порівнювати та виводити.

    ### Останній символ

    У рядку із шести символів індекси змінюються від `0` до `5`: індекс останнього символу завжди на одиницю менший за довжину. Отже, для рядка будь-якої довжини останній символ можна отримати через `len(text) - 1`.

    У грі «ланцюжок слів» кожне наступне слово має починатися з літери, на яку закінчилося попереднє. Ця програма перевіряє одну пару слів, порівнюючи перший символ нового слова з останнім символом попереднього:

    ```python run
    old = input("Previous word: ")
    new = input("Your word: ")
    if new[0] == old[len(old) - 1]:
        print("Good link!")
    else:
        print("Your word should start with " + old[len(old) - 1])
    ```

    ```input
    python
    apple
    ```

    ```output
    Previous word: python
    Your word: apple
    Your word should start with n
    ```

    ### Помилка `IndexError`

    Якщо звернутися до індексу, якого в рядку немає, програма зупиниться. Дуже поширена помилка — вважати, що індекс останнього символу дорівнює довжині рядка:

    ```python run crash
    word = "cat"
    print(word[len(word)])
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        print(word[len(word)])
              ~~~~^^^^^^^^^^^
    IndexError: string index out of range
    ```

    У рядку `"cat"` є індекси `0`, `1` і `2`, а `len(word)` дорівнює `3`. Повідомлення *out of range* означає, що індекс виходить за допустимі межі.

    ### Перегляд кожного символу по черзі

    Якщо використовувати допоміжну змінну як індекс, цикл може обійти всі символи по одному. Він працює, поки індекс менший за довжину, тому на останній ітерації індекс дорівнює `len(word) - 1`:

    ```python run
    word = "loop"
    index = 0
    while index < len(word):
        print(f"{index}: {word[index]}")
        index += 1
    ```

    ```output
    0: l
    1: o
    2: o
    3: p
    ```

    **Your turn:** заповни пропуски, щоб програма вивела ініціали введеного імені та прізвища, поставивши крапку після кожної літери.

    ```
    First name: Ada
    Last name: Lovelace
    A.L.
    ```
  hints:
  - Ініціал — це перша літера імені або прізвища.
  - Індекси починаються з `0`, тому перший символ `first` — це `first[0]`. Упиши потрібний індекс у кожен пропуск.
  more:
