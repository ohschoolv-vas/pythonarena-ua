      в умові.
- id: strings-negative-indexes
  sourceTitle: Counting from the end
  title: Відлік символів із кінця
  text: |
    Вираз `word[len(word) - 1]` дає останній символ рядка, але у Python є коротший спосіб — **від'ємні індекси** (*negative indexes*). Вони відраховуються з кінця: індекс `-1` означає останній символ, `-2` — передостанній і так далі:

    ```text
     p   y   t   h   o   n
    -6  -5  -4  -3  -2  -1
    ```

    ```python run
    word = "python"
    print(word[-1])
    print(word[-2])
    print(word[-6])
    ```

    ```output
    n
    o
    p
    ```

    `word[-1]` завжди повертає той самий символ, що й `word[len(word) - 1]`, незалежно від довжини слова. У від'ємних індексів теж є межі: у слові `"python"` не існує символу з індексом `-7`, тому `word[-7]` спричинить помилку `IndexError` так само, як `word[6]`.

    ### Порожнє введення

    Якщо користувач просто натисне Enter, `input` поверне порожній рядок. У нього немає ні першого, ні останнього символу, тому будь-який індекс виходитиме за межі.

    Ця програма утворює множину англійського іменника за простим правилом: до слова, що закінчується на `s`, наприклад `bus`, додається `es`, а до решти слів — `s`. Але якщо натиснути Enter, не ввівши слова, програма завершиться помилкою:

    ```python run crash
    word = input("Word: ")
    if word[-1] == "s":
        print(word + "es")
    else:
        print(word + "s")
    ```

    ```input

    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        if word[-1] == "s":
           ~~~~^^^^
    IndexError: string index out of range
    ```

    Коли програма може отримати порожній рядок, перевіряй його довжину **перед** зверненням до символу за індексом. У цьому прикладі перевірка стоїть першою, тому до `word[-1]` Python доходить лише тоді, коли в слові є принаймні один символ:

    ```python run
    word = input("Word: ")
    if len(word) == 0:
        print("No word, no plural")
    elif word[-1] == "s":
        print(word + "es")
    else:
        print(word + "s")
    ```

    ```input

    ```

    ```output
    Word:
    No word, no plural
    ```

    ### Перегляд рядка у зворотному порядку

    Цикл може проходити рядок із кінця до початку. Тут індекс починається з `-1` і зменшується на одиницю на кожній ітерації, доки не пройде перший символ, що має індекс `-len(word)`:

    ```python run
    word = "stressed"
    backwards = ""
    index = -1
    while index >= -len(word):
        backwards += word[index]
        index -= 1
    print(backwards)
    ```

    ```output
    desserts
    ```

    Слово `stressed` містить `8` символів, тому `-len(word)` дорівнює `-8`. Цикл проходить індекси `-1`, `-2` і так далі до `-8`, щоразу додаючи один символ. Коли індекс стає `-9`, цикл завершується. Те саме можна зробити і зі звичайними індексами: почати з `len(word) - 1` та зменшувати індекс, поки він не стане меншим за `0`.

    **Your turn:** заповни пропуски, щоб програма вивела перший та останній символи введеного слова. Для останнього символу використай від'ємний індекс.

    ```
    Word: banana
    First: b
    Last: a
    ```
