id: strings
summary: 'Робота з рядками (*strings*) у Python: конкатенація (*concatenation*) та повторення, довжина через `len`, індекси
  (*indexes*) й від’ємні індекси, зрізи (*slices*), пошук підрядків операторами `in` і методом `find`.'
steps:
- id: strings-operations
  sourceTitle: Joining and repeating strings
  title: З’єднання та повторення рядків
  text: |
    Ти вже поєднував рядки за допомогою `+`. У Python така операція називається **конкатенацією** (*concatenation*): рядки з'єднуються один за одним саме в тому вигляді, у якому їх записано. Між ними автоматично нічого не додається, тому потрібний пробіл має бути всередині одного з рядків:

    ```python run
    first = "sun"
    second = "flower"
    print(first + second)
    print(first + " " + second)
    ```

    ```output
    sunflower
    sun flower
    ```

    ### Повторення рядка за допомогою `*`

    Оператор `*` працює і з рядками, якщо другий операнд — ціле число: він повторює рядок указану кількість разів.

    ```python run
    print("ha" * 3)
    print("-" * 20)
    print("=" * 5 + " Menu " + "=" * 5)
    ```

    ```output
    hahaha
    --------------------
    ===== Menu =====
    ```

    Як і в обчисленнях із числами, `*` має вищий пріоритет за `+`. Тому в останньому рядку Python спочатку повторює обидва рядки зі знаком `=`, а вже потім поєднує три частини.

    Число повторень можна зберігати у змінній, що особливо зручно в циклах. Цей цикл малює трикутник, у якому кожен наступний рядок на один символ `#` ширший:

    ```python run
    width = 1
    while width <= 4:
        print("#" * width)
        width += 1
    ```

    ```output
    #
    ##
    ###
    ####
    ```

    ### Числа, отримані через `input`

    Рядок можна повторити лише цілу кількість разів. Функція `input` завжди повертає рядок, навіть якщо користувач вводить цифри. Якщо забути про перетворення через `int`, програма завершиться помилкою:

    ```python run crash
    width = input("Width: ")
    print("*" * width)
    ```

    ```input
    6
    ```

    ```output
    Width: 6
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        print("*" * width)
              ~~~~^~~~~~~
    TypeError: can't multiply sequence by non-int of type 'str'
    ```

    **Послідовність** (*sequence*) — це назва для значень, які зберігають елементи в певному порядку. Наприклад, рядок містить упорядковану послідовність символів. Повідомлення про помилку пояснює, що оператор `*` отримав рядок типу `str` там, де потрібне ціле число `int`. Якщо замінити рядок введення на `width = int(input("Width: "))`, програма запрацює.

    **Your turn:** заповни пропуск, щоб програма вивела під назвою рядок із `12` символів `=` — такої самої довжини, як сама назва.

    ```
    Python Arena
    ============
    ```
  hints:
  - Рядок і ціле число можна поєднати одним оператором, який повторює рядок.
  - Оператор повторення — `*`, наприклад `"-" * 20`.
