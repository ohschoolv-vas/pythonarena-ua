      ```
      Do you want to continue? no
      Stopping.
      ```
    hints:
    - Права частина виразу з `or` — просто рядок `"y"`. Непорожній рядок Python вважає істинним.
    - 'Перетвори праву частину на повне порівняння: `answer == "y"`.'
- id: logic-not
  sourceTitle: 'Turning a condition around: not'
  title: 'Заперечення умови: `not`'
  text: |
    Оператор `not` змінює логічне значення на протилежне: істинна умова стає хибною, а хибна — істинною.

    ```python repl
    >>> not True
    False
    >>> not False
    True
    >>> not 3 > 5
    True
    ```

    Python спочатку виконує порівняння, а потім застосовує `not`. Тому `not 3 > 5` означає те саме, що `not (3 > 5)`. Часто `not` ставлять перед складною умовою, взятою в дужки. У темі про `or` умова `day == "Saturday" or day == "Sunday"` перевіряла вихідний день. Якщо додати перед нею `not`, перевірка стосуватиметься буднього дня:

    ```python run
    day = "Tuesday"
    if not (day == "Saturday" or day == "Sunday"):
        print("The library opens at 8 today.")
    ```

    ```output
    The library opens at 8 today.
    ```

    Тут дужки важливі: без них `not` заперечуватиме тільки перше порівняння, і умова виявиться істинною навіть у неділю.

    ### Логічні значення у змінних

    Ти вже знаєш із першої частини, що результат порівняння — `True` або `False` — можна зберегти у змінній. Тоді умова з `not` читається майже як звичайне речення:

    ```python run
    answer = input("Is the door locked? (yes/no) ")
    locked = answer == "yes"
    if not locked:
        print("Remember to lock the door!")
    print("Good night.")
    ```

    ```input
    no
    ```

    ```output
    Is the door locked? (yes/no) no
    Remember to lock the door!
    Good night.
    ```

    У рядку `locked = answer == "yes"` спочатку виконується порівняння, а потім його результат зберігається у змінній `locked`. У цьому прикладі він дорівнює `False`, тому `not locked` дає `True`.

    ### Пріоритет логічних операторів

    Коли умова містить кілька різних операторів, Python групує їх у певному порядку: спочатку порівняння, потім `not`, далі `and` і насамкінець `or`. Наприклад, `a or b and c` означає `a or (b and c)`. Це може здивувати. (Групування лише показує, які частини виразу належать одна до одної. Python і далі перевіряє умови зліва направо.) Припустімо, що дітям молодше `12` років і людям віком від `65` років надають знижку, але не в неділю:

    ```python run
    age = 8
    day = "Sunday"
    if age < 12 or age >= 65 and day != "Sunday":
        print("Discount price")
    else:
        print("Full price")
    ```

    ```output
    Discount price
    ```

    Оскільки `and` має вищий пріоритет за `or`, Python читає умову як `age < 12 or (age >= 65 and day != "Sunday")`. Через це дитина отримує знижку щодня, навіть у неділю. Дужки допомагають точно записати задум: `(age < 12 or age >= 65) and day != "Sunday"`. Якщо поєднуєш `and` та `or`, краще додати дужки навіть там, де вони не обов'язкові: так умову простіше зрозуміти.

    **Your turn:** грати на барабанах можна з `8` до `21` години включно. Заповни пропуск, щоб в інші години програма нагадувала про тишу:

    ```
    Hour: 23
    Quiet hours, no drums please.
    ```
  hints:
  - Умова в дужках істинна в години, коли можна тренуватися, а перше повідомлення потрібне в інший час.
  - Зміни значення всієї умови на протилежне за допомогою `not`.
