      A die has no such number.
      ```
    hints:
    - Число некоректне, якщо воно менше за `1` або більше за `6`, тому поєднай два порівняння оператором `or`.
    - Умова `if roll < 1 or roll > 6:` знаходить неприпустимі значення, а `else` виводить число за допомогою f-рядка.
