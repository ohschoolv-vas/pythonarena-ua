# Українська локалізація Python Arena.
# Перекладено лише навчальні тексти, заголовки й підказки; код, тести, ідентифікатори не змінено.
id: logic
summary: 'Складені логічні умови: оператори `and`, `or`, `not`, пріоритет їх виконання, ланцюгові порівняння (chained
  comparisons) та вкладені умовні інструкції (nested conditionals).'
steps:
- id: logic-and
  sourceTitle: 'Both at once: and'
  title: 'Обидві умови одночасно: `and`'
  text: |
    Іноді однієї умови недостатньо. Наприклад, на американські гірки можуть пускати лише тих, кому виповнилося щонайменше `10` років **і** чий зріст становить не менше `140` см. **Логічний оператор** (*logical operator*) `and` об'єднує дві умови в одну. Результат буде істинним лише тоді, коли **обидві** умови істинні:

    ```python run
    age = int(input("Age: "))
    height = int(input("Height in cm: "))
    if age >= 10 and height >= 140:
        print("Enjoy the ride!")
    else:
        print("Sorry, you can't ride yet.")
    ```

    ```input
    12
    135
    ```

    ```output
    Age: 12
    Height in cm: 135
    Sorry, you can't ride yet.
    ```

    Відвідувач достатньо дорослий, але його зріст замалий, тому загальна умова хибна. Інтерактивний інтерпретатор показує всі чотири можливі поєднання:

    ```python repl
    >>> True and True
    True
    >>> True and False
    False
    >>> False and True
    False
    >>> False and False
    False
    ```

    Лише вираз `True and True` дає `True`. Можна об'єднувати й більше двох умов: `a and b and c` буде істинним тільки тоді, коли всі три умови істинні.

    ### Між двома межами

    Один із найпоширеніших способів використання `and` — перевірка належності числа до діапазону. Наприклад, `hour >= 9 and hour < 17` істинне для годин від `9` до `16` включно:

    ```python run
    hour = int(input("Hour (0 to 23): "))
    if hour >= 9 and hour < 17:
        print("The shop is open.")
    else:
        print("The shop is closed.")
    ```

    ```input
    18
    ```

    ```output
    Hour (0 to 23): 18
    The shop is closed.
    ```

    ### З кожного боку — повна умова

    Звичайною мовою можна сказати: «якщо година не менша за 9 і менша за 17», не повторюючи слово «година». Але Python не вміє здогадуватися, яка частина пропущена:

    ```python run crash
    hour = 10
    if hour >= 9 and < 17:
        print("The shop is open.")
    ```

    ```crash
      File "main.py", line 2
        if hour >= 9 and < 17:
                         ^
    SyntaxError: invalid syntax
    ```

    Після `and` Python очікує **повну нову умову**, а бачить лише `<`. Потрібно знову вказати змінну: `hour >= 9 and hour < 17`.

    **Your turn:** заповни пропуск, щоб програма повідомляла, що вода підходить для купання за температури від `24` до `30` градусів включно:

    ```
    Water temperature: 26
    Perfect for swimming!
    ```
  hints:
  - Обидві умови мають бути істинними одночасно.
  - Оператор, який вимагає істинності обох частин, — `and`.
  more:
  - index: 0
    task: |
      Напиши програму, яка запитує ім'я користувача та пароль. Вона вітає користувача лише тоді, коли ім'я дорівнює `robin`, **а** пароль — `hood123`. В усіх інших випадках програма виводить `Wrong username or password.`

      ```
      Username: robin
      Password: hood123
      Welcome, robin!
      ```
    hints:
    - І імʼя користувача, і пароль повинні збігатися з потрібними значеннями. Обʼєднай два порівняння оператором
      `and`.
    - '`username == "robin" and password == "hood123"`. Решту випадків обробить `else`.'
  - index: 1
    task: |
      Наприкінці курсу зі скелелазіння учасник складає три випробування, кожне з яких оцінюють від `0` до `10` балів. Сертифікат видають лише тоді, коли за **кожне** випробування отримано щонайменше `5` балів, а сума трьох результатів становить не менше `20`. Напиши програму, яка запитує три оцінки й виводить `Certificate earned!` або `No certificate this time.`

      ```
      Test 1: 8
      Test 2: 5
      Test 3: 9
