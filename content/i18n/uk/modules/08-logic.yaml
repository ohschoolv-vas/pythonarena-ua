      вікових категорій.
- id: logic-chained
  sourceTitle: Ranges and longer conditions
  title: Діапазони та складніші умови
  text: |
    Перевіряти, чи належить значення певному проміжку, доводиться часто. Тому в Python є коротший запис. Замість `grade >= 4 and grade <= 10` можна написати `4 <= grade <= 10` — майже як у математиці:

    ```python run
    grade = int(input("Grade (4 to 10): "))
    if 4 <= grade <= 10:
        print("Grade saved.")
    else:
        print("That's not a valid grade.")
    ```

    ```input
    11
    ```

    ```output
    Grade (4 to 10): 11
    That's not a valid grade.
    ```

    Це називають **ланцюговим порівнянням** (*chained comparison*). Python розуміє `4 <= grade <= 10` як перевірку двох умов: `4 <= grade and grade <= 10`. Отже, значення посередині порівнюється з обома межами. Так можна поєднувати різні оператори порівняння:

    ```python repl
    >>> x = 7
    >>> 0 < x < 10
    True
    >>> 1 <= x <= 5
    False
    >>> a = 3
    >>> b = 3
    >>> a == b == 3
    True
    ```

    Обидва способи означають те саме, і ти зустрічатимеш їх у програмах. Ланцюговий запис коротший і наочно показує змінну між двома межами — так само, як на уроці математики.

    ### Довші умови

    Умови можна складати з багатьох частин. Оператори `and` та `or` можна використовувати всередині `elif` так само, як і в `if`. У цій вікторині гравець отримує золоту медаль, якщо набрав щонайменше `90` балів не довше ніж за `60` секунд; срібну — якщо виконав одну з цих вимог; бронзову — якщо набрав не менше `50` балів:

    ```python run
    points = int(input("Points: "))
    seconds = int(input("Time in seconds: "))
    if points >= 90 and seconds <= 60:
        print("Gold medal")
    elif points >= 90 or seconds <= 60:
        print("Silver medal")
    elif points >= 50:
        print("Bronze medal")
    else:
        print("No medal this time")
    ```

    ```input
    95
    75
    ```

    ```output
    Points: 95
    Time in seconds: 75
    Silver medal
    ```

    Зверни увагу на порядок перевірок. Умова з `and` стоїть першою, бо вона суворіша: потрібно виконати **обидві** вимоги. Якщо виконано обидві, то виконується і «хоча б одна». Тому, якби перевірка з `or` стояла першою, вона перехоплювала б усі результати на золото, і золоту медаль ніхто б не отримав. Порядок умов важливий і під час використання `and` та `or`.

    **Your turn:** заповни пропуск ланцюговим порівнянням, щоб програма приймала номери днів місяця від `1` до `31`:

    ```
    Day of the month: 31
    OK
    ```
  hints:
  - 'У ланцюговому порівнянні змінна стоїть між двома межами: `low <= variable <= high`.'
  - 'Тут межі — `1` і `31`: `1 <= day <= 31`.'
