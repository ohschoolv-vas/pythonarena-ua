- id: logic-nested
  sourceTitle: Conditions inside conditions
  title: Вкладені умовні інструкції
  text: |
    Англійський термін: **block** — блок коду.
    

    Блок `if` може містити будь-які інструкції, зокрема ще одну інструкцію `if`. Умовну інструкцію всередині іншої називають **вкладеною умовою** (*nested conditional*). У цьому прикладі зовнішній `if` перевіряє, чи коректна ціна, а внутрішній — чи вистачає грошей:

    ```python run
    balance = 50
    price = int(input("Price: "))
    if price > 0:
        if price <= balance:
            print("Purchase approved.")
        else:
            print("Not enough money.")
    else:
        print("That's not a valid price.")
    ```

    ```input
    80
    ```

    ```output
    Price: 80
    Not enough money.
    ```

    Внутрішня умова перевіряється лише тоді, коли зовнішня істинна. Якщо ціна дорівнює `-5`, Python відразу переходить до зовнішньої гілки `else`.

    ### Відступи визначають вкладеність

    У вкладених умовах відступ указує, до якого саме `if` належить `else`: до того, що має такий самий рівень відступу. Якщо зсунути внутрішній `else` на чотири пробіли ліворуч, зміст програми зміниться:

    ```python run
    balance = 50
    price = int(input("Price: "))
    if price > 0:
        if price <= balance:
            print("Purchase approved.")
    else:
        print("Not enough money.")
    ```

    ```input
    80
    ```

    ```output
    Price: 80
    ```

    Тепер `else` належить зовнішньому `if`. Якщо ціна дорівнює `80`, програма нічого не виведе, а для ціни `-5` повідомить `Not enough money.` Python не може здогадатися, яку поведінку ти задумав, тож стеж за відступами.

    ### Вкладені чи об'єднані умови?

    Часто ту саму перевірку можна записати за допомогою `and`, без вкладеності:

    ```python run
    balance = 50
    price = 30
    if price > 0 and price <= balance:
        print("Purchase approved.")
    elif price > 0:
        print("Not enough money.")
    else:
        print("That's not a valid price.")
    ```

    ```output
    Purchase approved.
    ```

    Обирай варіант, який легше читати. Вкладеність зручна, коли друге запитання має сенс лише після першого — наприклад, якщо програма запитує додаткові дані тільки в одній гілці. Об'єднана умова допомагає зберегти короткі перевірки простими й наочними.

