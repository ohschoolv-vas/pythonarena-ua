      ```
    hints:
    - 'Для отримання сертифіката мають одночасно виконуватися чотири вимоги: кожен із трьох результатів не менший
      за `5`, а їхня сума — не менша за `20`.'
    - 'Спочатку обчисли загальну суму та збережи її: `total = first + second + third`.'
