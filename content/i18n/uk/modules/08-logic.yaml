      `else`.'
- id: logic-or
  sourceTitle: 'At least one: or'
  title: 'Хоча б одна умова: `or`'
  text: |
    Оператор `or` об'єднує дві умови. Отримана умова істинна, якщо істинна **хоча б одна** з них:

    ```python run
    day = input("Day: ")
    if day == "Saturday" or day == "Sunday":
        print("No school today!")
    else:
        print("Time for school.")
    ```

    ```input
    Sunday
    ```

    ```output
    Day: Sunday
    No school today!
    ```

    Ось усі чотири можливі поєднання:

    ```python repl
    >>> True or True
    True
    >>> True or False
    True
    >>> False or True
    True
    >>> False or False
    False
    ```

    Лише `False or False` дає `False`. Зауваж: `or` істинне й тоді, коли **обидві** умови істинні. Це не означає «або одне, або друге, але не обидва».

    ### За межами діапазону

    Оператор `or` допомагає визначити, чи лежить число **поза** діапазоном: воно менше за нижню межу **або** більше за верхню:

    ```python run
    number = int(input("Pick a number from 1 to 10: "))
    if number < 1 or number > 10:
        print("That's not between 1 and 10!")
    else:
        print(f"You picked {number}.")
    ```

    ```input
    12
    ```

    ```output
    Pick a number from 1 to 10: 12
    That's not between 1 and 10!
    ```

    Число не може одночасно бути меншим за `1` і більшим за `10`. Тому умова `number < 1 and number > 10` ніколи не стане істинною. Для перевірки виходу за межі діапазону використовуй `or`.

    ### Помилка, яку важко помітити

    Як і з `and`, кожна частина виразу з `or` має бути повною умовою. Але тут пропущена частина не завжди спричиняє помилку виконання, через що проблему складніше виявити:

    ```python run
    day = "Monday"
    if day == "Saturday" or "Sunday":
        print("Weekend!")
    ```

    ```output
    Weekend!
    ```

    Python сприймає цю умову як `(day == "Saturday") or ("Sunday")`. Праворуч стоїть зовсім не порівняння, а звичайний рядок. У логічній умові Python вважає будь-який **непорожній рядок** істинним. Тому вся умова завжди істинна, незалежно від дня тижня. Правильно ще раз порівняти змінну: `day == "Saturday" or day == "Sunday"`.

    **Your turn:** заповни пропуск, щоб програма виводила `Winter month` для грудня, січня та лютого (місяці з номерами `12`, `1` і `2`):

    ```
    Month (1 to 12): 1
    Winter month
    ```
  hints:
  - Умова має бути істинною, якщо виконується хоча б одне з трьох порівнянь.
  - Для перевірки «хоча б одне» використовують оператор `or`.
  more:
  - index: 0
