    hints:
    - Якщо спочатку було `160` очок, після першого блоку в змінній `points` залишиться `60`. Яке значення побачить
      друга умова?
    - Перед першим `if` збережи початкові очки в окремій змінній, наприклад `start = points`, і перевіряй її, коли
      вирішуєш, чи давати скриню.
    - Інший спосіб — перенести перевірку скрині перед перевіркою переходу на рівень. Перевір рішення для `160`,
      `150` та `120`.
- id: conditionals-booleans
  sourceTitle: True and False
  title: 'Істина та хиба: True і False'
  text: |
    Умова теж має **значення**, як і арифметичний вираз. Результат порівняння буває лише двох видів: **істина** або **хиба**. У Python вони записуються як `True` і `False`. Це **булеві значення** (*Boolean values*), названі на честь математика Джорджа Буля; їхній тип — `bool`:

    ```python repl
    >>> 5 > 3
    True
    >>> 5 == 3
    False
    >>> type(5 > 3)
    <class 'bool'>
    ```

    Вираз, результатом якого є `True` або `False`, називають **булевим виразом** (*Boolean expression*). Усі умови, які ти писав до цього, — саме такі вирази. Інструкція `if` виконує блок, коли результат умови дорівнює `True`, і пропускає його, коли результат — `False`.

    ### Умова, збережена в змінній

    Результат порівняння можна записати в змінну, а потім використати її безпосередньо як умову `if`:

    ```python run
    age = int(input("Age: "))
    is_adult = age >= 18
    print(is_adult)
    if is_adult:
        print("You can vote.")
    ```

    ```input
    20
    ```

    ```output
    Age: 20
    True
    You can vote.
    ```

    Спочатку вираз `age >= 18` обчислюється, а його результат `True` зберігається в `is_adult`. Далі `if is_adult:` читається майже як звичайне речення. Хороша назва булевої змінної відповідає на запитання, на яке можна сказати «так» або «ні»: `is_adult`, `has_ticket`, `game_over`.

    ### Як записувати `True` і `False` у коді

    Булеві значення можна записувати в програмі безпосередньо. Наприклад, налаштування на початку програми може вмикати або вимикати підказки:

    ```python run
    show_tips = True
    print("Welcome!")
    if show_tips:
        print("Tip: the Tab key indents a line.")
    ```

    ```output
    Welcome!
    Tip: the Tab key indents a line.
    ```

    Якщо змінити перший рядок на `show_tips = False`, підказка зникне. Обидва значення починаються **з великої літери**. Запис `true` малими літерами — це просто невідоме ім’я, тому Python повідомить про помилку:

    ```python run crash
    show_tips = true
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 1, in <module>
        show_tips = true
                    ^^^^
    NameError: name 'true' is not defined. Did you mean: 'True'?
    ```

    **Your turn:** визнач, що надрукує програма. Запиши кожен рядок результату.
  hints:
  - Кожне порівняння виводить `True` або `False`.
  - '`b * 3` дорівнює `9`, а не `10`. Вираз `a >= 10` істинний, коли `a` дорівнює рівно `10`.'
