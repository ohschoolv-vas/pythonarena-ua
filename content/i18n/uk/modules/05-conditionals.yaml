# Українська локалізація Python Arena.
# Код, тести, еталонні результати та службові поля зберігаються з upstream.
id: conditionals
summary: 'Програми з умовами: інструкція if (conditional statement), логічні умови (conditions), оператори порівняння
  (comparison operators), відступи (indentation), блоки коду та булеві значення (Boolean values) True і False.'
steps:
- id: conditionals-if
  sourceTitle: The if statement
  title: Інструкція if
  text: |
    Досі програми, які ти писав, виконувалися за одним маршрутом: Python запускав усі рядки зверху вниз незалежно від введених даних. Але справжні програми вміють **ухвалювати рішення**: попереджати про спеку, вітати переможця або пропонувати новому користувачеві створити пароль. **Умовна інструкція** (*conditional statement*) виконує певні команди лише тоді, коли **умова** (*condition*) істинна.

    ```python run
    temperature = int(input("Temperature: "))
    if temperature > 25:
        print("It's hot today.")
        print("Remember to drink water.")
    print("Have a nice day!")
    ```

    ```input
    30
    ```

    ```output
    Temperature: 30
    It's hot today.
    Remember to drink water.
    Have a nice day!
    ```

    Якщо ввести `18`, умова `temperature > 25` буде хибною. Python пропустить два рядки з відступами, і програма виведе лише:

    ```text
    Temperature: 18
    Have a nice day!
    ```

    ### З яких частин складається інструкція `if`

    - Ключове слово `if` розпочинає умовну інструкцію.
    - Вираз `temperature > 25` — це **умова** (*condition*). Знак `>` означає «більше ніж». Інші способи порівняння розглянемо в наступному уроці.
    - Наприкінці рядка ставиться двокрапка `:`.
    - Рядки нижче з **відступом** (*indentation*) у чотири пробіли утворюють **блок коду** (*block*). Вони виконуються, лише якщо умова істинна.
    - Рядок `print("Have a nice day!")` знову починається від лівого краю, тому вже не входить до блоку `if`. Він виконується завжди.

    Введені дані визначають, які команди виконаються. Тому одна й та сама програма може поводитися по-різному. Саме тому система перевіряє твої розв’язки на кількох наборах вхідних даних — кожного разу програма повинна обрати правильний шлях.

    ### Не забувай двокрапку

    Без `:` наприкінці рядка `if` Python не зможе прочитати програму:

    ```python run crash
    temperature = 30
    if temperature > 25
        print("It's hot today.")
    ```

    ```crash
      File "main.py", line 2
        if temperature > 25
                           ^
    SyntaxError: expected ':'
    ```

    Символ `^` вказує на місце наприкінці другого рядка, де Python очікував двокрапку. Як і при будь-якій синтаксичній помилці (*SyntaxError*), програма взагалі не починає виконуватися.

    **Your turn:** заповни пропуск так, щоб програма повідомляла про велике замовлення. Якщо користувач введе `150`, результат буде таким:

    ```
    How many items? 150
    That's a big order!
    Thank you!
    ```
  hints:
  - Наприкінці рядка з `if` чогось бракує.
  - Кожен рядок `if` із умовою закінчується двокрапкою `:`.
  more:
  - index: 0
    task: |
      Напиши програму, яка запитує швидкість автомобіля й виводить `Too fast!`, якщо вона перевищує 50. Якщо швидкість не більша за 50, додаткових повідомлень не повинно бути. Для введення `62` результат буде таким:

      ```
      Speed: 62
      Too fast!
      ```
    hints:
    - Використай `if` з умовою `speed > 50` і постав наприкінці двокрапку.
    - Команду `print` запиши з нового рядка з відступом у чотири пробіли, щоб вона входила до блоку `if`.
  - index: 1
    task: |
      Визнач, що виведе ця програма. Запиши кожен рядок результату.
    hints:
    - '`12` більше за `10`, тому перший блок виконається: надрукує повідомлення й додасть `5` до `points`.'
    - Друга умова перевіряється вже з новим значенням `points`. Останній рядок виконується в будь-якому разі.
- id: conditionals-comparisons
  sourceTitle: Comparison operators
  title: Оператори порівняння
  text: |
    Умова зазвичай **порівнює два значення**. У Python для цього є **оператори порівняння** (*comparison operators*):

    | Оператор | Значення | Приклад |
    |:-:|---|---|
    | `==` | дорівнює | `a == b` |
    | `!=` | не дорівнює | `a != b` |
    | `<` | менше ніж | `a < b` |
    | `<=` | менше або дорівнює | `a <= b` |
    | `>` | більше ніж | `a > b` |
    | `>=` | більше або дорівнює | `a >= b` |

    Різниця між `<` і `<=` особливо важлива на межі: `18 < 18` — хибне порівняння, а `18 <= 18` — істинне.

    У програмі може бути кілька незалежних інструкцій `if` одна за одною. У цій грі на вгадування числа їх три:

    ```python run
    secret = 7
    guess = int(input("Guess a number from 1 to 10: "))
    if guess < secret:
        print("Too small.")
    if guess > secret:
        print("Too big.")
    if guess == secret:
        print("Right! Well done.")
    ```

    ```input
    4
    ```

    ```output
    Guess a number from 1 to 10: 4
    Too small.
    ```

    Python перевіряє кожну інструкцію `if` окремо й послідовно. Число не може одночасно бути меншим за 7, більшим за 7 та дорівнювати 7. Тому в цьому прикладі спрацює лише один із трьох блоків.

    ### `=` — не те саме, що `==`

    Один знак `=` **присвоює значення** змінній. Два знаки `==` **порівнюють значення**. Плутанина між ними — поширена помилка, і в умові Python її виявляє:

    ```python run crash
    guess = 7
    if guess = 7:
        print("Right!")
    ```

    ```crash
      File "main.py", line 2
        if guess = 7:
           ^^^^^^^^^
    SyntaxError: invalid syntax. Maybe you meant '==' or ':=' instead of '='?
    ```

    Python підказує `==` або `:=`. Другий оператор трапляється рідше й поки нам не потрібен. Для звичайного порівняння використовуй `==`.

    ### Порівняння рядків

    Оператори `==` і `!=` працюють також із текстовими рядками. Два рядки вважаються рівними, лише якщо збігається **кожен символ**, включно з великими й малими літерами та пробілами:

    ```python run
    answer = input("Do you like Python? ")
    if answer == "yes":
        print("Great!")
    if answer != "yes":
        print("Give it a few more weeks.")
    ```

    ```input
    Yes
    ```

    ```output
    Do you like Python? Yes
    Give it a few more weeks.
    ```

    `Yes` з великої літери `Y` — не той самий рядок, що `yes`. Оператор `!=` зручно використовувати, коли потрібно виконати дію для будь-якого значення, **крім** одного конкретного.

    **Your turn:** заповни пропуск так, щоб програма розблоковувала доступ лише для PIN-коду `4321`. Якщо користувач введе `4321`, отримає:

    ```
    PIN: 4321
    Unlocked
    ```
  hints:
  - Умова має бути істинною, коли обидва рядки збігаються.
  - 'Оператор «дорівнює» записується двома знаками рівності: `==`.'
  more:
  - index: 0
    task: |
      Напиши програму, яка запитує два цілі числа та повідомляє, яке з них більше. Вона повинна надрукувати одне з трьох повідомлень:

      - `The first number is bigger.`
      - `The second number is bigger.`
      - `The numbers are equal.`

      Якщо користувач введе `5` і `8`, програма виведе:

      ```
      First: 5
      Second: 8
      The second number is bigger.
      ```
    hints:
    - 'Напиши три окремі інструкції `if`: по одній для кожного можливого повідомлення.'
    - Використай умови `first > second`, `second > first` і `first == second`.
  - index: 1
    task: |
      У музеї квиток для відвідувачів молодших за 12 років коштує `5`, а для всіх віком від 12 років — `10`. Напиши програму, яка запитує вік відвідувача та виводить ціну квитка. Якщо користувач введе `12`, результат буде таким:

      ```
      Age: 12
      Ticket: 10 euros
      ```

      Перевір, щоб відвідувач, якому **рівно 12 років**, заплатив `10`.
    hints:
    - 'Потрібні дві інструкції `if`: окремо для кожної ціни.'
    - «Молодше 12» означає `age < 12`. «12 або більше» включає й саме `12`, тому використовуй `age >= 12`.
- id: conditionals-indentation
  sourceTitle: Indentation and blocks
  title: Відступи та блоки коду
  text: |
    У Python те, які рядки належать до `if`, визначається **відступами** (*indentation*) — пробілами на початку кожного рядка. Усі рядки одного **блоку коду** (*block*) повинні мати однаковий відступ. Зазвичай використовують чотири пробіли. Редактор цього сайту автоматично робить відступ після двокрапки, а клавіша Tab допомагає його додати.

    Відступи потрібні не лише для гарного оформлення. Порівняй дві програми: команди однакові, але останній рядок має різний відступ.

    ```python run
    score = 3
    print(f"Score: {score}")
    if score > 5:
        print("You win!")
        print("Game over.")
    ```

    ```output
    Score: 3
    ```

    ```python run
    score = 3
    print(f"Score: {score}")
    if score > 5:
        print("You win!")
    print("Game over.")
    ```

    ```output
    Score: 3
    Game over.
    ```

    У першій програмі `print("Game over.")` входить до блоку `if`. Оскільки умова хибна, цей рядок пропускається разом із `print("You win!")`. У другій програмі `print("Game over.")` розміщено від лівого краю, тобто після блоку, — тому він виконується завжди.

    ### Помилки відступів

    Якщо відступи суперечать структурі програми, Python зупиниться з помилкою **IndentationError** ще до початку виконання. Ось три поширені випадки.

    **1. Після двокрапки немає відступу.** У такому разі блок `if` залишається порожнім:

    ```python run crash
    code = input("Code: ")
    if code == "1234":
    print("Access granted")
    ```

    ```crash
      File "main.py", line 3
        print("Access granted")
        ^^^^^
    IndentationError: expected an indented block after 'if' statement on line 2
    ```

    **2. Рядок має зайвий відступ**, хоча перед ним немає блоку, до якого він міг би належати:

    ```python run crash
    print("Hello")
        print("World")
    ```

    ```crash
      File "main.py", line 2
        print("World")
    IndentationError: unexpected indent
    ```

    **3. Рядки одного блоку мають різні відступи:**

    ```python run crash
    score = 8
    if score > 5:
        print("You win!")
      print("Well played.")
    ```

    ```crash
      File "main.py", line 4
        print("Well played.")
                             ^
    IndentationError: unindent does not match any outer indentation level
    ```

    Четвертий рядок містить два пробіли. Це не чотири пробіли всередині блоку й не нуль пробілів на його рівні, тому Python не може визначити, до якого блоку він належить. В усіх трьох випадках перевір рядок, згаданий у повідомленні про помилку, і встанови відступ відповідно до структури програми.

    **Your turn:** програма зупиняється з помилкою `IndentationError`. Виправ відступи, щоб правильний код надавав доступ, а повідомлення `Goodbye` виводилося завжди. Для коду `1234` результат має бути таким:

    ```
    Code: 1234
    Access granted
    Goodbye
    ```
  hints:
  - Прочитай повідомлення про помилку. Для якого рядка Python очікує відступ?
  - Зроби відступ у чотири пробіли перед `print("Access granted")`, щоб команда входила до `if`. Команду `print("Goodbye")`
    залиш без відступу, щоб вона виконувалася завжди.
  more:
  - index: 0
    task: |
      Що надрукує ця програма? Запиши кожен рядок результату.
    hints:
    - Умова `x > 5` хибна, тому обидва рядки всередині першого блоку `if` пропускаються.
    - Рядки без відступу виконуються завжди, а умова `x < 5` істинна.
  - index: 1
    task: |
      Програма ресторану пропонує безкоштовне морозиво всім відвідувачам, хоча отримувати його повинні лише діти до 13 років. Виправ відступи так, щоб команда про морозиво входила до блоку `if`. Якщо користувач введе `8`, результат буде таким:

      ```
      Age: 8
      Kids' menu available.
      Free ice cream for kids!
      Enjoy your meal.
      ```
    hints:
    - Запусти програму з віком дорослого, наприклад `30`. Яке повідомлення не повинно з’являтися?
    - Рядок належить блоку `if`, якщо має такий самий відступ, як інші рядки блоку. Додай чотири пробіли перед командою
      про морозиво.
- id: conditionals-using
  sourceTitle: Conditions at work
  title: Умови на практиці
  text: |
    У блоці `if` можуть бути будь-які інструкції: обчислення, присвоювання та виведення значень. Поширений підхід — **змінити значення змінної лише за певної умови**, а потім продовжити роботу з тим значенням, яке вона містить:

    ```python run
    price = float(input("Price: "))
    if price > 100:
        price = price * 0.9
        print("You get a 10% discount.")
    print(f"To pay: {price}")
    ```

    ```input
    150
    ```

    ```output
    Price: 150
    You get a 10% discount.
    To pay: 135.0
    ```

    Якщо ціна дорівнює `80`, умова буде хибною, блок не виконається, змінна `price` залишиться рівною `80.0`, а програма після введення виведе тільки `To pay: 80.0`.

    ### Кілька інструкцій `if` поспіль

    Кожна умова `if` перевіряється незалежно. Якщо істинні декілька умов, виконаються декілька блоків:

    ```python run
    height = int(input("Height in cm: "))
    if height >= 100:
        print("You can ride the carousel.")
    if height >= 120:
        print("You can ride the bumper cars.")
    if height >= 140:
        print("You can ride the roller coaster.")
    print("Have fun!")
    ```

    ```input
    125
    ```

    ```output
    Height in cm: 125
    You can ride the carousel.
    You can ride the bumper cars.
    Have fun!
    ```

    ### Коли один блок змінює дані для наступного

    Інструкції `if` виконуються послідовно. Наступна умова бачить уже **оновлені значення змінних**, які могли змінитися в попередньому блоці. Через це легко припуститися логічної помилки.

    У цьому кафе замовлення від 8 умовних одиниць отримує знижку 2, а від 10 — ще й безкоштовне печиво. На перший погляд програма правильна. Але спробуй ввести `11`:

    ```python run
    total = int(input("Order total: "))
    if total >= 8:
        total = total - 2
    if total >= 10:
        print("A free cookie comes with your order.")
    print(f"To pay: {total}")
    ```

    ```input
    11
    ```

    ```output
    Order total: 11
    To pay: 9
    ```

    Початкова сума була `11`, тому печиво належить покупцеві. Проте перший блок зменшив `total` до `9`, а друга умова перевіряє **нове** значення. Один зі способів виправлення — зберегти суму після знижки в окремій змінній, а умови перевіряти за початковою сумою замовлення:

    ```python run
    total = int(input("Order total: "))
    to_pay = total
    if total >= 8:
        to_pay = total - 2
    if total >= 10:
        print("A free cookie comes with your order.")
    print(f"To pay: {to_pay}")
    ```

    ```input
    11
    ```

    ```output
    Order total: 11
    A free cookie comes with your order.
    To pay: 9
    ```

    У цьому випадку також можна було б поміняти два блоки `if` місцями. Проте окрема змінна часто є надійнішим рішенням: подальші перевірки й надалі мають доступ до початкової вартості замовлення.

    **Your turn:** для замовлень від `50` включно діє знижка `5`. Заповни пропуск, щоб програма віднімала знижку від загальної суми. Якщо користувач введе `60`, результат буде таким:

    ```
    Order total: 60
    To pay: 55
    ```
  hints:
  - Нова сума — це попередня сума мінус `5`.
  - 'Обчисли нове значення за старим: `total - 5`.'
  more:
