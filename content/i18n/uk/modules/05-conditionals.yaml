      Bronze badge
      Silver badge
      Keep walking!
      ```
    hints:
    - Створи окремий `if` для кожної відзнаки. Усі умови перевіряються незалежно, тому можна отримати кілька відзнак.
    - «5000 або більше» записується як `steps >= 5000`.
    - Повідомлення `Keep walking!` треба виводити завжди, тому розмісти його після блоків `if`, без відступу.
  - index: 1
    task: |
      У грі гравець, який має щонайменше `100` очок, переходить на наступний рівень, витрачаючи `100` очок. За наявності щонайменше `150` очок він також знаходить бонусну скриню. Але зараз гравець із `160` очками переходить на наступний рівень і **не** отримує скриню. Виправ програму, щоб результат був таким:

      ```
