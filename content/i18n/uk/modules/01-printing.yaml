# Python Arena UA: текстові переклади. Код, tests, seed, solution залишаються в upstream.
id: printing
summary: 'Перші програми Python: функція print(), послідовне виконання команд, обчислення, лапки,
  коментарі та повідомлення про помилки.'
steps:
  - id: printing-first-program
    sourceTitle: Your first Python program
    title: Перша програма на Python
    text: |
      **Програма** — це набір команд, які комп’ютер виконує у визначеному порядку.
      Текст програми називають **вихідним кодом**. Команди Python виконує
      **інтерпретатор**. Тут код запускається прямо у браузері.
      
      ### Знайомимося з `print()`
      Функція `print()` виводить повідомлення на екран.
      
      ```python run
      print("Hello, Python!")
      ```
      
      ```output
      Hello, Python!
      ```
      
      Назва `print` пишеться малими літерами. У круглих дужках зазначають
      значення для виведення. Лапки позначають текстовий рядок — їх самих
      на екрані не буде. У Python `print` і `Print` — різні імена.
      
      **Your turn:** заповни пропуск, щоб програма надрукувала саме
      `Grace Hopper`. Не змінюй написання імені: перевірка порівнює символи.
    hints:
      - Для виведення повідомлення використовується функція `print`.
      - 'Введи лише `print` маленькими літерами: дужки й лапки вже є.'
    more:
      - index: 0
        task: |
          Встав подвійні лапки на початку та в кінці текстового рядка. Програма має вивести рівно `Python runs on quotes`.
        hints:
          - Рядок можна записати в подвійних лапках `"..."`.
          - В обидва пропуски введи символ `"`.
      - index: 1
        task: |
          Напиши самостійну програму з одним викликом `print()`, щоб отримати `Ready, set, code!`. Зважай на великі літери та знаки пунктуації.
        hints:
          - Почни з `print(`, а наприкінці закрий дужку.
          - Текст помісти у подвійні лапки.
          - Скопіюй очікуваний текст без змін.
  - id: printing-several-lines
    sourceTitle: Several lines, in order
    title: 'Кілька рядків: порядок команд'
    text: |
      Python зазвичай виконує команди **зверху вниз**. Кожен виклик
      `print()` створює новий рядок виводу.
      
      ```python run
      print("3")
      print("2")
      print("1")
      print("Liftoff!")
      ```
      
      ```output
      3
      2
      1
      Liftoff!
      ```
      
      Якщо переставити дві команди, зміниться і результат. Перевірка
      порівнює текст посимвольно: великі літери, пробіли та розділові
      знаки мають значення.
      
      ### Як вивести порожній рядок
      Виклич `print()` без аргументів:
      
      ```python run
      print("Part one")
      print()
      print("Part two")
      ```
      
      ```output
      Part one
      
      Part two
      ```
      
      **Your turn:** додай два виклики `print()` до готового першого
      рядка. Має вийти точно такий вірш:
      
      ```
      Line by line the program goes,
      top to bottom, as it flows,
      print shows all that Python knows.
      ```
    hints:
      - Для кожного рядка потрібен окремий `print("...")`.
      - Уважно скопіюй текст, коми, крапку та регістр літер.
    more:
      - index: 0
        task: |
          Рядки ранкового розпорядку переплутані. Перестав чотири команди так, щоб отримати:
          ```
          Wake up
          Brush teeth
          Eat breakfast
          Start coding
          ```
        hints:
          - Python виконує рядки зверху вниз.
          - Не змінюй текст у лапках — тільки порядок команд.
      - index: 1
        task: |
          Створи квиток з точно такими пробілами й порожнім рядком:
          ```
          ==================
            PYTHON ARENA
          
            Admit one
          ==================
          ```
        hints:
          - Пробіли перед `PYTHON ARENA` та `Admit one` входять до рядка.
          - Порожній рядок створює `print()`.
          - Потрібно п’ять викликів `print()`.
  - id: printing-calculating
    sourceTitle: Calculating with print
    title: Обчислення за допомогою print()
    text: |
      `print()` вміє показувати не тільки текст, а й результат обчислення.
      Якщо вираз не взятий у лапки, Python виконає його.
      
      ```python run
      print(4 + 9)
      print(6 * 7)
      print(1 + 3 * 5)
      ```
      
      ```output
      13
      42
      16
      ```
      
      Арифметичні операції: `+` — додавання, `-` — віднімання,
      `*` — множення, `/` — ділення. Множення виконується перед додаванням,
      а дужки змінюють порядок обчислень.
      
      ```python run
      print(1 + 3 * 5)
      print("1 + 3 * 5")
      ```
      
      ```output
      16
      1 + 3 * 5
      ```
      
      **Your turn:** виведи кількість секунд в одній годині. Нехай
      Python сам виконає множення `60 * 60`, не вводь готове число `3600`.
    hints:
      - У годині 60 хвилин, у кожній хвилині — 60 секунд.
      - Знак множення у Python — `*`. Запиши `60 * 60` без лапок.
    more:
      - index: 0
        task: |
          Обчисли програмою кількість хвилин у тижні. Перша стрічка виводу — точно `Minutes in a week:`, друга — число `10080`. Не вводь відповідь вручну: використовуй множення.
        hints:
          - У тижні 7 днів, у дні 24 години, у годині 60 хвилин.
          - Виведи результат `7 * 24 * 60` через `print()`.
      - index: 1
        task: |
          Не запускаючи код, передбач кожен рядок виводу показаної програми. Зверни увагу на лапки та дужки.
        hints:
          - У лапках вираз друкується як текст.
          - Без лапок Python виконує додавання.
          - У виразі `(1 + 2) * 3` спершу обчислюються дужки.
  - id: printing-quotes-and-comments
    sourceTitle: Quotes and comments
    title: Лапки та коментарі
    text: |
      Для текстових рядків у Python підходять одинарні `'` або подвійні
      `"` лапки. Важливо правильно закривати рядок. Якщо всередині тексту
      є подвійні лапки, зручно обгорнути весь рядок одинарними.
      
      ```python run
      print('She said "hi" and left.')
      print("It's a good day.")
      ```
      
      ```output
      She said "hi" and left.
      It's a good day.
      ```
      
      ### Коментарі
      Символ `#` позначає коментар до кінця рядка. Інтерпретатор
      не виконує текст коментаря. Коментарі допомагають пояснювати код,
      а також тимчасово вимикати окремі команди.
      
      ```python run
      # Кількість яєць для тістечок
      print("Eggs needed:")
      print(12 * 6)  # дванадцять тістечок
      ```
      
      ```output
      Eggs needed:
      72
      ```
      
      **Your turn:** виправ лапки в початковому коді так, щоб
      вивести `The sign said "Keep out" in red letters.`
    hints:
      - Подвійні лапки перед `Keep` передчасно завершують рядок.
      - Обгорни весь рядок одинарними лапками, зберігши подвійні всередині.
    more:
      - index: 0
        task: |
          Напиши програму, яка виведе в точності: `To greet, type print("Hi") and press Run.`. Лапки навколо `Hi` теж мають з’явитися на екрані.
        hints:
          - Оскільки в тексті є подвійні лапки, обгорни рядок в одинарні.
          - Зовнішній `print()` виконує команду, а внутрішній `print("Hi")` є звичайним текстом.
      - index: 1
        task: |
          Вимкни непотрібний тестовий рядок через коментар `#`, але не видаляй його. Програма має вивести тільки:
          ```
          Welcome!
          Have a nice day.
          ```
        hints:
          - Рядок, що починається з `#`, не виконується.
          - Додай `#` перед командою, яка виводить тестове повідомлення.
  - id: printing-errors
    sourceTitle: When Python can't read your code
    title: Як читати повідомлення про помилки
    text: |
      Помилки трапляються у всіх програмістів. Python повідомляє тип
      помилки і часто показує номер рядка, де її знайдено.
      
      ### `SyntaxError`: порушено правила запису коду
      Наприклад, `print(Good morning)` містить неправильний запис тексту:
      слова треба взяти у лапки. При синтаксичній помилці програма
      зазвичай не починає виконання взагалі.
      
      ### `NameError`: невідоме ім’я
      Команди `print` і `Print` для Python різні. Якщо написати
      `Print("Hello")`, інтерпретатор повідомить, що ім’я `Print` не визначене.
      На відміну від синтаксичної помилки, попередні коректні команди
      можуть уже виконатися.
      
      **Your turn:** знайди дві помилки у початковій програмі:
      одна пов’язана з лапками, друга — з регістром назви функції.
      Виправ обидві, щоб отримати:
      
      ```
      Errors are normal.
      Reading them is a skill.
      ```
    hints:
      - Запусти перевірку й подивися, на який рядок вказує помилка.
      - У першій команді бракує закривальної лапки.
      - У другій команді потрібно `print`, а не `Print`.
    more:
      - index: 0
        task: |
          Виправ помилку у другій команді, щоб отримати:
          ```
          Three lines,
          one for each print,
          all in order.
          ```
        hints:
          - Зверни увагу на повідомлення про незакриту дужку.
          - Кожній відкривальній `(` потрібна закривальна `)`.
      - index: 1
        task: |
          Передбач результат програми: коментарі не виконуються, а вираз у лапках не обчислюється. Введи всі рядки виводу.
        hints:
          - Команда, яка починається з `#`, пропускається.
          - '`"3 + 4"` — це текст; `3 + 4` без лапок — обчислення.'
