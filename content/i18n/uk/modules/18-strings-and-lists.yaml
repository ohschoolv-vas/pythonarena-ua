id: strings-and-lists
summary: Додаткові можливості роботи з рядками та списками. Зрізи з кроком, незмінність рядків, методи count, index, replace, split, join і strip, а також передавання даних між функціями у великих програмах.
steps:
- id: strings-and-lists-slices
  title: Зрізи з кроком
  text: |
    Ви вже знайомі зі зрізами рядків: `text[a:b]` повертає частину від індексу `a` до індексу `b`, не включаючи його. Списки можна обробляти зрізами так само. Зріз списку створює новий список:

    ```python run
    word = "keyboard"
    print(word[3:6])
    numbers = [10, 20, 30, 40, 50, 60]
    print(numbers[1:4])
    print(numbers[:2])
    print(numbers[-2:])
    print(numbers)
    ```

    ```output
    boa
    [20, 30, 40]
    [10, 20]
    [50, 60]
    [10, 20, 30, 40, 50, 60]
    ```

    Якщо не вказати початковий індекс, зріз починається від початку; якщо не вказати кінцевий — триває до кінця. Тому `numbers[-2:]` містить два останні елементи. Початковий список не змінюється: зріз створює копію його частини.

    Зріз не спричиняє помилку `IndexError`. Якщо кінцева межа виходить за довжину списку, зріз просто міститиме менше елементів: `numbers[4:100]` поверне `[50, 60]`.

    ### Крок зрізу

    Як і `range`, зріз може мати третє число — **крок**. Вираз `[a:b:2]` вибирає кожен другий елемент:

    ```python run
    letters = "abcdefgh"
    print(letters[0:8:2])
    print(letters[1::2])
    print(letters[::3])
    ```

    ```output
    aceg
    bdfh
    adg
    ```

    `letters[1::2]` починає з індексу 1 і вибирає кожен другий символ до кінця рядка. `letters[::3]` не задає меж і вибирає кожен третій символ у всьому рядку.

    ### Зворотний напрямок

    За від’ємного кроку зріз іде справа наліво. У такому разі початковий індекс більший за кінцевий. Якщо не вказувати межі й задати крок -1, отримаємо рядок або список у зворотному порядку:

    ```python run
    numbers = [10, 20, 30, 40, 50, 60]
    print(numbers[4:1:-1])
    print(numbers[::-1])
    word = input("Слово: ")
    print(word[::-1])
    ```

    ```input
    drawer
    ```

    ```output
    [50, 40, 30]
    [60, 50, 40, 30, 20, 10]
    Слово: drawer
    reward
    ```

    `[::-1]` — найкоротший спосіб перевернути рядок у Python.

    ### Об’єднання списків

    Як і рядки, два списки можна об’єднати оператором `+`. Результатом буде новий список, що містить елементи обох списків у тому самому порядку:

    ```python run
    first = [1, 2, 3]
    second = [7, 8]
    print(first + second)
    print(first[::-1] + second)
    ```

    ```output
    [1, 2, 3, 7, 8]
    [3, 2, 1, 7, 8]
    ```

    **Your turn:** заповніть пропуск зрізом так, щоб програма вивела слово у зворотному порядку та визначила, чи є воно **паліндромом** — словом, яке однаково читається зліва направо й справа наліво:

    ```
    Word: level
    level
    A palindrome!
    ```
  hints:
  - Зріз із від’ємним кроком проходить елементи у зворотному напрямку.
  - 'Не вказуйте межі зрізу й використайте крок -1: `[::-1]`.'
  more:
  - index: 0
    task: |
      Простий спосіб перетасувати колоду карт — відкласти в одну стопку кожну другу карту, починаючи з першої, а потім додати решту карт. Напишіть функцію `shuffle(cards: list) -> list`, яка повертає новий список: спочатку карти з індексами 0, 2, 4, ..., потім карти з індексами 1, 3, 5, ... Наприклад, `shuffle([1, 2, 3, 4, 5])` повертає `[1, 3, 5, 2, 4]`.
    hints:
    - Зріз із кроком 2 вибирає кожен другий елемент. Якщо почати з індексу 0, отримаємо першу стопку.
    - 'Якщо почати з індексу 1 із тим самим кроком, отримаємо решту карт: `cards[1::2]`.'
    - Об’єднайте два зрізи оператором `+` і поверніть результат.
  - index: 1
    task: |
      Що виведе ця програма? Запишіть кожен рядок її виводу.
    hints:
    - '`text[1:4]` бере символи з індексами 1, 2 і 3. `text[::2]` бере кожен другий символ від початку.'
    - '`text[4:0:-1]` проходить у зворотному напрямку від індексу 4 і зупиняється перед індексом 0.'
    - '`numbers[::-1]` — перевернутий список, а `[:2]` бере його перші два елементи.'
- id: strings-and-lists-immutable
  title: Рядки не можна змінювати
  text: |
    Багато знайомих вам засобів однаково працюють зі списками й рядками: індекси, зрізи, `len`, `in` та `for`. Тому може здатися, що символ рядка можна змінити так само, як елемент списку. Спробуймо:

    ```python run crash
    scores = [7, 4, 9]
    scores[1] = 8
    print(scores)
    word = "cat"
    word[0] = "b"
    ```

    ```output
    [7, 8, 9]
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 5, in <module>
        word[0] = "b"
        ~~~~^^^
    TypeError: 'str' object does not support item assignment
    ```

    Список дозволяє замінити елемент, а рядок — ні. Після створення рядка не можна змінити ні його символи, ні довжину, ні порядок символів. Рядки є **незмінними** (*immutable*). Навіть сортування працює інакше: функція `sorted` не змінює рядок, а повертає новий список його символів у відсортованому порядку.

    ### Створення нових рядків

    Натомість можна скласти новий рядок із частин старого й записати його в ту саму змінну:

    ```python run
    word = "cat"
    word = "b" + word[1:]
    print(word)
    word = word + "s"
    print(word)
    print(sorted("cab"))
    ```

    ```output
    bat
    bats
    ['a', 'b', 'c']
    ```

    `word[1:]` дорівнює `"at"`, тому `"b" + word[1:]` створює новий рядок `"bat"`, на який тепер посилається `word`. Сам рядок `"cat"` не змінився: змінній `word` просто присвоїли інший рядок.

    Саме тому методи рядків не змінюють початковий рядок. Методи на зразок `upper` і `lower` повертають новий рядок. Щоб зберегти результат, його потрібно присвоїти змінній, нерідко тій самій:

    ```python run
    name = "ada"
    name.upper()
    print(name)
    name = name.upper()
    print(name)
    ```

    ```output
    ada
    ADA
    ```

    Виклик `name.upper()` створює рядок `"ADA"`, але результат ніде не зберігається. Метод списку `sort` працює інакше: змінює сам список і повертає `None`. Тому для списку достатньо `numbers.sort()`, а для рядка потрібно `name = name.upper()`.

    **Your turn:** програма має вивести введене ім’я з великої літери, але завершується з помилкою. Виправте її: створіть новий рядок замість спроби змінити старий:

    ```
    Name: grace
    Grace
    ```
  hints:
  - Рядок не можна змінювати, тому `name[0] = ...` спричиняє помилку. Створіть новий рядок і запишіть його в `name`.
  - 'Новий рядок складається з першої літери у верхньому регістрі та решти імені: `name[0].upper() + name[1:]`.'
  more:
  - index: 0
    task: |
      Напишіть функцію `replace_at(text: str, index: int, char: str) -> str`, яка повертає новий рядок, схожий на `text`, але із символом `char` за вказаним індексом. Наприклад, `replace_at("table", 0, "c")` повертає `'cable'`. Можна вважати, що індекс належить рядку.
    hints:
    - 'Новий рядок має три частини: усе до заданого індексу, новий символ та усе після індексу.'
    - Частина перед індексом — це `text[:index]`, а частина після нього — `text[index + 1:]`.
    - Об’єднайте три частини оператором `+` і поверніть результат.
  - index: 1
    task: |
      Що виведе ця програма? Запишіть кожен рядок її виводу.
    hints:
    - '`word + "er"` створює новий рядок, який отримує тільки змінна `word`. Змінна `other` і далі посилається на старий рядок.'
    - '`sorted` для рядка повертає список його символів у відсортованому порядку.'
    - '`word.upper()` створює новий рядок, але він ніде не зберігається.'
- id: strings-and-lists-count-index-replace
  title: Методи count, index і replace
  text: |
    У рядків і списків є й інші корисні методи. Метод **`count`** визначає, скільки разів трапляється певне значення. У рядках він рахує входження фрагмента тексту, а у списках — входження елемента:

    ```python run
    text = "this list has six items"
    print(text.count("s"))
    print(text.count("is"))
    numbers = [3, 1, 3, 3, 2]
    print(numbers.count(3))
    print("banana".count("ana"))
    ```

    ```output
    5
    2
    3
    1
    ```

    Останній рядок варто розглянути уважніше. Фрагмент `ana` у слові `banana` починається з індексу 1, а також із 3, але ці входження мають спільну літеру `a`. Метод `count` не враховує входження, що перекриваються: після знайденого фрагмента пошук продовжується лише за його кінцем. Тому результат — 1.

    ### Де розташований елемент?

    **`index`** повертає індекс першого знайденого входження в рядку або списку:

    ```python run crash
    names = ["Ada", "Linus", "Grace"]
    print(names.index("Grace"))
    print("banana".index("an"))
    print(names.index("Guido"))
    ```

    ```output
    2
    1
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 4, in <module>
        print(names.index("Guido"))
              ~~~~~~~~~~~^^^^^^^^^
    ValueError: list.index(x): x not in list
    ```

    Якщо елемента немає, `index` спричиняє помилку, тому спочатку перевірте наявність оператором `in`. Для рядків також є знайомий вам метод `find`, який замість помилки повертає -1.

    ### Заміна фрагментів

    **`replace`** повертає новий рядок, у якому всі входження певного фрагмента тексту замінено іншим:

    ```python run
    text = "I like cats. Cats like me."
    print(text.replace("like", "love"))
    print(text.replace("cat", "dog"))
    print(text)
    ```

    ```output
    I love cats. Cats love me.
    I like dogs. Cats like me.
    I like cats. Cats like me.
    ```

    Замінюються всі входження, а не лише перше. Регістр має значення: `"Cats"` не дорівнює `"cat"`, тому залишається без змін. І оскільки рядки незмінні, сама змінна `text` зберігає старе значення. Про це легко забути під час роботи з `replace`:

    ```python run
    text = "Hello, World"
    text.replace("World", "Python")
    print(text)
    text = text.replace("World", "Python")
    print(text)
    ```

    ```output
    Hello, World
    Hello, Python
    ```

    Перший виклик `replace` створює новий рядок, але результат губиться. Лише після збереження результату змінна `text` містить `Hello, Python`.

    Заміна на порожній рядок `""` видаляє фрагмент: `"1,000,000".replace(",", "")` повертає `"1000000"`.

    **Your turn:** заповніть пропуски так, щоб програма підрахувала літери `e` в тексті, а потім замінила кожне `cat` на `dog`:

    ```
    Letter e: 4
    the dog sees the dog
    ```
  hints:
  - Один метод підраховує кількість входжень фрагмента тексту, інший замінює їх іншим фрагментом.
  - '`count("e")` рахує літери e, а `replace("cat", "dog")` повертає текст, у якому кожне cat замінене на dog.'
  more:
  - index: 0
    task: |
      Напишіть функцію `censor(text: str, banned: list) -> str`, яка повертає текст, де кожне заборонене слово замінене зірочками — по одній на кожну літеру. Наприклад, `censor("you silly goose", ["silly"])` повертає `'you ***** goose'`.
    hints:
    - Переберіть заборонені слова циклом `for` і замініть кожне з них у тексті.
    - Рядок зірочок для слова створюється виразом `"*" * len(word)`.
    - '`replace` повертає новий рядок, тому збережіть його: `text = text.replace(word, "*" * len(word))`. Після циклу поверніть `text`.'
  - index: 1
    task: |
      Напишіть програму, яка запитує текст і фрагмент для пошуку. Вона виводить кількість входжень фрагмента та індекс його першої появи. Якщо фрагмент не знайдено, програма виводить `Не знайдено`:

      ```
      Text: the cat sat on the mat
      Find: at
      Found 3 times, first at index 5
      ```
    hints:
    - Спочатку перевірте `if piece in text:`, адже `index` спричинить помилку, якщо фрагмент відсутній.
    - '`text.count(piece)` дає кількість входжень, а `text.index(piece)` — індекс першого.'
    - 'Збережіть обидва числа у змінних, наприклад `count` і `first`, та виведіть f-рядком: `f"Знайдено {count} раз(и), перший індекс: {first}"`.'
- id: strings-and-lists-split-join
  title: Методи split, join і strip
  text: |
    В одному рядку, який зчитує програма, часто міститься кілька значень: слова речення або числа, розділені комами. Метод **`split`** розбиває рядок на список частин. Без аргументів він розділяє текст за пропусками:

    ```python run
    sentence = "the quick brown fox"
    words = sentence.split()
    print(words)
    print("Кількість слів:", len(words), "| останнє:", words[-1])
    print("a,b,,c".split(","))
    ```

    ```output
    ['the', 'quick', 'brown', 'fox']
    Кількість слів: 4 | останнє: fox
    ['a', 'b', '', 'c']
    ```

    Якщо передати аргумент, `split` розділятиме рядок за вказаним фрагментом. Дві коми поспіль утворюють між собою порожній елемент.

    Отримані частини завжди є рядками. Числа потрібно окремо перетворити функцією `int`:

    ```python run
    line = input("Два числа: ")
    parts = line.split()
    a = int(parts[0])
    b = int(parts[1])
    print("Сума:", a + b)
    ```

    ```input
    15 27
    ```

    ```output
    Два числа: 15 27
    Сума: 42
    ```

    ### Об’єднання

    **`join`** працює у зворотному напрямку: об’єднує список рядків в один рядок. Рядок, для якого викликають цей метод, слугує роздільником між частинами. Спочатку запис може здаватися незвичним, але його можна читати як «об’єднати ці елементи, поставивши між ними цей роздільник»:

    ```python run
    words = ["red", "green", "blue"]
    print(", ".join(words))
    print("".join(words))
    print(" -> ".join(sorted(words)))
    ```

    ```output
    red, green, blue
    redgreenblue
    blue -> green -> red
    ```

    Кожен елемент має бути рядком: `", ".join([1, 2])` спричинить `TypeError`. Спочатку перетворіть числа на рядки.

    ### Видалення пропусків по краях

    Користувачі часто вводять зайві пропуски. Метод **`strip`** повертає рядок без пропусків на початку й у кінці; внутрішні пропуски залишаються:

    ```python run
    answer = "   yes please  "
    print("[" + answer + "]")
    print("[" + answer.strip() + "]")
    print(answer.strip() == "yes please")
    ```

    ```output
    [   yes please  ]
    [yes please]
    True
    ```

    Методи `split` і `join` зручно використовувати разом. `split()` без аргументів ігнорує зайві пропуски між словами, тому `" ".join(text.split())` замінює будь-які послідовності пропусків одним пропуском.

    **Your turn:** заповніть пропуски так, щоб програма розділила рядок на слова, вивела їхню кількість і об’єднала їх дефісами:

    ```
    Words: one two three
    3 words
    one-two-three
    ```
  hints:
  - Один метод розділяє рядок на список слів. Інший викликають для рядка-роздільника між словами.
  - '`line.split()` повертає список слів, а `"-".join(words)` об’єднує їх дефісами.'
  more:
  - index: 0
    task: |
      Напишіть програму, яка зчитує рядки з результатами, доки користувач не введе порожній рядок. Кожен рядок містить ім’я та один або кілька балів, розділених пропусками. Для кожного рядка програма виводить ім’я та суму балів:

      ```
      Results: Ada 12 15 9
      Ada: 36
      Results: Linus 7 8
      Linus: 15
      Results:
      ```
    hints:
    - '`line.split()` повертає список: спочатку ім’я, потім бали, причому всі елементи — рядки.'
    - Ім’я міститься в `parts[0]`, а бали — у зрізі `parts[1:]`.
    - Підрахуйте суму балів циклом `for`, перетворюючи кожен бал функцією `int`, і виведіть ім’я та суму.
  - index: 1
    task: |
      Напишіть функцію `tidy(text: str) -> str`, яка повертає текст без пропусків на початку й у кінці та рівно з одним пропуском між словами. Наприклад, `tidy("  too   many  spaces ")` повертає `'too many spaces'`.
    hints:
    - '`split()` без аргументів ігнорує зайві пропуски, зокрема на початку та в кінці рядка.'
    - 'Об’єднайте слова з одним пропуском між ними: `" ".join(...)`.'
- id: strings-and-lists-larger-programs
  title: Передавання даних між функціями
  text: |
    Ваші програми стають довшими. Ви вже знаєте, як створювати їх поступово: писати по одній невеликій функції, запускати й перевіряти кожну, перш ніж використовувати її в інших функціях. (Лічильник кроків наприкінці цього розділу теж варто писати саме так.) Тепер розглянемо, що пов’язує функції між собою — дані, які вони передають.

    У програмі, що складається з функцій, кожна функція отримує потрібні дані через **аргументи**, а результат повертає за допомогою **`return`**. Функція `main` поєднує їхню роботу. Ось невелика програма, яка зчитує екзаменаційні бали й формує звіт:

    ```python run
    def read_points() -> list:
        points = []
        while True:
            line = input("Бали: ")
            if line == "":
                break
            points.append(int(line))
        return points


    def passed(points: list) -> int:
        count = 0
        for p in points:
            if p >= 50:
                count += 1
        return count


    def report(points: list) -> str:
        average = sum(points) / len(points)
        passed_count = passed(points)
        return f"Іспитів: {len(points)}, середній бал: {average:.1f}, склали: {passed_count}"


    def main():
        points = read_points()
        print(report(points))


    main()
    ```

    ```input
    72
    45
    90

    ```

    ```output
    Бали: 72
    Бали: 45
    Бали: 90
    Бали:
    Іспитів: 3, середній бал: 69.0, склали: 2
    ```

    Простежте рух даних: `read_points` повертає список, `main` зберігає його у своїй змінній та передає до `report`, а та передає список функції `passed`. Жодна функція не звертається до сторонніх змінних. Кожну функцію легко перевірити окремо: наприклад, `passed([50, 49])` має повернути 1 незалежно від решти програми. Виконання починається з виклику `main()` в останньому рядку. (У такій програмі без окремого завдання на функцію можна викликати `main` на верхньому рівні.)

    ### Пастка: зовнішні змінні

    Функція може читати змінну, створену за її межами, на верхньому рівні програми. Це працює, і саме тому може стати пасткою. У прикладі податкова ставка не є параметром, тож функція використовує значення `tax_rate` на момент виклику:

    ```python run
    def with_tax(price: float) -> float:
        return price * (1 + tax_rate)


    tax_rate = 0.5
    print(with_tax(10))
    tax_rate = 0.25
    print(with_tax(10))
    ```

    ```output
    15.0
    12.5
    ```

    Той самий виклик `with_tax(10)` дає два різні результати, хоча з його запису не видно причини. У великій програмі можна довго шукати рядок, який змінив `tax_rate`. Аналогічна проблема виникне, якщо цикл перебирає зовнішній список замість списку, переданого параметром.

    У завданнях на написання функцій це особливо важливо. Автоматичні тести не запускають основний блок програми, тому змінна, встановлена лише в ньому, може бути недоступною під час виклику функції. Ось що станеться, якщо викликати функцію до створення змінної:

    ```python run crash
    def with_tax(price: float) -> float:
        return price * (1 + tax_rate)


    print(with_tax(10))
    tax_rate = 0.5
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 5, in <module>
        print(with_tax(10))
              ~~~~~~~~^^^^
      File "main.py", line 2, in with_tax
        return price * (1 + tax_rate)
                            ^^^^^^^^
    NameError: name 'tax_rate' is not defined
    ```

    Рішення — передавати функції всі потрібні дані через параметри: `def with_tax(price: float, tax_rate: float) -> float:`. Тоді кожен виклик явно міститиме всі дані, від яких залежить результат.

    **Your turn:** функція `discounted` у початковому коді використовує змінну `discount` з основного блоку. Програма запускається, але автоматичні тести отримують `NameError`. Додайте до функції другий параметр `discount: int` (відсоток знижки) і відповідно змініть виклик в основному блоці. Наприклад, `discounted(50, 20)` повертає `40.0`.
  hints:
  - 'Тести викликають `discounted(50, 20)`: відсоток передається другим аргументом, тому функції потрібен другий параметр.'
  - 'Додайте `discount: int` після `price: float` у заголовку функції. Тіло змінювати не потрібно, адже `discount` тепер є параметром. Потім додайте відсоток другим аргументом у виклик в основному блоці.'
