  - index: 0
    task: |
      Завершіть програму для підрахунку кроків. Вона зчитує щоденну кількість кроків до введення порожнього рядка, виводить діаграму (один символ `#` за кожну повну тисячу кроків), а потім загальну кількість, середнє значення та найкращий день. Функція `main` уже готова — напишіть три функції, які вона використовує:

      - `read_steps()` зчитує кількість кроків до порожнього рядка й повертає список.
      - `print_chart(steps)` виводить для кожного дня рядок: слово `День`, номер дня від 1, двокрапку й пропуск, кількість кроків у полі шириною 6 символів, пропуск і символи `#`.
      - `best_day(steps)` повертає номер дня з найбільшою кількістю кроків (перший із таких днів, якщо значення однакові).

      ```
      Steps: 8500
      Steps: 12000
      Steps: 4300
      Steps:
      Day 1:   8500 ########
      Day 2:  12000 ############
      Day 3:   4300 ####
      Total: 24800
      Average: 8266.7
      Best day: 2
      ```

      Можна вважати, що користувач введе принаймні одне значення.
    hints:
    - Пишіть і перевіряйте функції по черзі. `read_steps` схожа на зчитування імен до порожнього рядка, але кожен рядок перетворюється через `int` перед додаванням до списку, який потім повертається.
    - "У `print_chart` переберіть індекси. Кількість символів `#` дорівнює `steps[i] // 1000`, а вираз `\"#\" * n` створює n таких символів. У f-рядку візьміть `#` в одинарні лапки: `{'#' * (steps[i] // 1000)}`."
    - У `best_day` знайдіть індекс найбільшої кількості кроків, як у завданні на пошук найкращого елемента списку, і поверніть цей індекс плюс 1.
  - index: 1
    task: |
      Що виведе ця програма? Запишіть кожен рядок її виводу.
    hints:
    - '`factor` не є параметром `scaled`: функція використовує значення зовнішньої змінної на момент виклику.'
    - Перший виклик відбувається, коли `factor` дорівнює 2. Перед другим викликом значення `factor` змінюється на 10.
    - В останньому виклику `factor` одночасно є аргументом (10) і множником (10).
