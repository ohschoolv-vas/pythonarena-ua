    task: |
      У бібліотеці книжки розміщують за прізвищами авторів, записаними малими латинськими літерами. Прізвища, які в алфавітному порядку стоять перед `h`, потрапляють на полицю A; від `h` до `p` (не включаючи `p`) — на полицю B; решта — на полицю C. Напиши програму, яка запитує прізвище автора й виводить назву полиці.

      ```
      Author's last name: orwell
      Shelf B
      ```
    hints:
    - 'Порівняй ціле прізвище з односимвольним рядком: кожне прізвище на літеру від `a` до `g` буде меншим за `"h"`.'
    - 'Перевіряй полиці по черзі: `if name < "h":`, потім `elif name < "p":`, потім `else`.'
    - Прізвище `hugo` не менше за `"h"`, бо коротший рядок стоїть раніше. Тому воно правильно потрапить на полицю
      B.
