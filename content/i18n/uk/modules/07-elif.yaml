      значення.
    - Два рядки `print` мають стояти після всього `if` — `else`, без відступу, щоб виконуватися завжди.
- id: elif-elif
  sourceTitle: More branches with elif
  title: Більше варіантів із `elif`
  text: |
    Іноді рішення має більше двох можливих результатів. Наприклад, у грі «Вгадай число» відповідь може бути замалою, завеликою або правильною. Для таких випадків використовують **гілку `elif`** (*elif branch*, скорочення від *else if*), яка додає ще одну умову до тієї самої умовної інструкції:

    ```python run
    secret = 37
    guess = int(input("Guess the number: "))
    if guess < secret:
        print("Too small!")
    elif guess > secret:
        print("Too big!")
    else:
        print("You got it!")
    ```

    ```input
    50
    ```

    ```output
    Guess the number: 50
    Too big!
    ```

    Python перевіряє умови зверху вниз. Щойно знаходиться перша істинна умова, виконується відповідний блок, а решта гілок цієї інструкції пропускається. Блок `else` запускається лише тоді, коли всі попередні умови хибні. Отже, за будь-якого введеного числа програма виведе рівно одне з трьох повідомлень.

    ### Стільки гілок, скільки потрібно

    Умовна інструкція може містити будь-яку кількість гілок `elif`. Завершальна гілка `else` не є обов'язковою. Якщо її немає, може статися, що не виконається жодна гілка:

    ```python run
    day = input("Day: ")
    if day == "Friday":
        print("Tonight: disco swim at 7 pm")
    elif day == "Saturday":
        print("Today: swimming lessons for kids")
    elif day == "Sunday":
        print("Today: family swim all day")
    print("The pool is open from 8 am to 8 pm.")
    ```

    ```input
    Tuesday
    ```

    ```output
    Day: Tuesday
    The pool is open from 8 am to 8 pm.
    ```

    У вівторок (*Tuesday*) жодна з умов не є істинною, тому програма відразу переходить до команди після умовної інструкції. Якщо ввести `Friday`, спочатку виконається перша гілка.

    Порядок частин завжди такий: спочатку один `if`, потім скільки завгодно `elif`, а в кінці — не більше одного `else`. Кожна частина має двокрапку та власний блок із відступом. `if`, `elif` та `else` записують на одному рівні відступу.

    ### `elif` — одне слово

    У багатьох мовах програмування використовують конструкцію `else if` із двох слів, але Python розуміє лише `elif`:

    ```python run crash
    guess = 40
    if guess < 37:
        print("Too small!")
    else if guess > 37:
        print("Too big!")
    ```

    ```crash
      File "main.py", line 4
        else if guess > 37:
             ^^
    SyntaxError: expected ':'
    ```

    Python бачить `else` й очікує одразу після нього двокрапку. Щоб виправити помилку, слід написати `elif guess > 37:`.

    **Your turn:** заповни пропуски в програмі, яка радить одяг залежно від температури: понад `25` градусів — футболка, понад `10` — светр, а в інших випадках — тепле пальто.

    ```
    Temperature: 30
    T-shirt weather
    ```
  hints:
  - Середня гілка має власну умову, а остання охоплює решту можливих випадків.
  - У перший пропуск впиши `elif`, у другий — `else`.
  more:
  - index: 0
    task: |
      Напиши програму для світлофора. Вона запитує колір сигналу: для `red` виводить `Stop`, для `yellow` — `Get ready`, для `green` — `Go`. Якщо введено будь-який інший колір, виводить `Unknown color`.

      ```
      Light color: green
      Go
      ```
    hints:
    - 'Порівняй колір із кожним словом по черзі: `if color == "red":`, а для двох інших кольорів використай `elif`.'
    - Останній `else` обробляє будь-які інші відповіді.
  - index: 1
    task: |
      Напиши програму, яка запитує час двох бігунів у секундах і повідомляє, хто пробіг швидше та на скільки секунд. Якщо результати однакові, виведи `It's a tie!`.

      ```
      Time of runner A: 52
      Time of runner B: 49
      Runner B was faster by 3 seconds.
      ```
    hints:
    - Швидшим є бігун, який витратив менше часу.
    - Спочатку перевір `time_a < time_b`, далі через `elif` — `time_b < time_a`, а нічийний результат залиш для
      `else`.
    - Від більшого часу відніми менший, щоб різниця не була від’ємною.
- id: elif-order
  sourceTitle: The order of conditions
  title: Порядок перевірки умов
  text: |
    Python перевіряє гілки умовної інструкції зверху вниз і виконує лише першу гілку з істинною умовою. Тому **порядок умов** (*order of conditions*) має значення. Ця програма повинна відзначити дуже хороший результат, але чомусь цього не робить:

    ```python run
    points = 95
    if points >= 50:
        print("Passed")
    elif points >= 90:
        print("Passed with distinction")
    else:
        print("Failed")
    ```

    ```output
    Passed
    ```

    Число `95` не менше ніж `50`, отже, виконується перша гілка, а решта пропускається. Насправді гілка `elif points >= 90` узагалі ніколи не виконається: будь-яке число від `90` і вище також не менше ніж `50`, тож перша умова завжди перехоплює його. Виправлення — спочатку перевірити суворішу умову:

    ```python run
    points = 95
    if points >= 90:
        print("Passed with distinction")
    elif points >= 50:
        print("Passed")
    else:
        print("Failed")
    ```

    ```output
    Passed with distinction
    ```

    Корисне правило для таких меж: якщо використовуєш `>=` або `>`, перевіряй пороги від найбільшого до найменшого; якщо `<=` або `<` — від найменшого до найбільшого.

    ### Кожна гілка враховує попередні перевірки

    Коли Python доходить до `elif points >= 50`, він уже знає, що умова `points >= 90` хибна. Тому ця гілка фактично відповідає кількості балів від `50` до `89`, хоча ми не записуємо обидві межі. Не потрібно повторювати попередні умови в наступних гілках.

    ### Один ланцюжок чи кілька окремих інструкцій

    Ланцюжок `if` — `elif` — `else` становить **одну умовну інструкцію** (*conditional statement*), у якій виконується не більше однієї гілки. Окремі інструкції `if` перевіряються незалежно, тому можуть виконатися кілька блоків:

    ```python run
    speed = 85
    if speed > 80:
        print("Fine: 200 euros")
    if speed > 60:
        print("Fine: 100 euros")
    ```

    ```output
    Fine: 200 euros
    Fine: 100 euros
    ```

    Водій отримує два штрафи. Якщо замінити другий `if` на `elif`, програма виведе лише перший штраф. Користуйся окремими `if`, коли перевірки незалежні одна від одної, і ланцюжком `if` — `elif` — `else`, коли потрібно вибрати тільки один результат.

    **Your turn:** діти молодші за `7` років проходять безкоштовно, але зараз програма видає п'ятирічній дитині дитячий квиток. Виправ порядок перевірок:

    ```
    Age: 5
    Free entry
    ```
  hints:
  - П’ятирічній дитині ще немає `18`, тому перша умова спрацьовує раніше, ніж програма доходить до `age < 7`.
  - 'Поміняй місцями перші дві умови разом із їхніми блоками: спочатку `if age < 7:`, потім `elif age < 18:`.'
