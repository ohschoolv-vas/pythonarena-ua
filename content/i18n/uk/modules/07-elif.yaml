      В інтернет-магазині доставка коштує `5` євро, але для замовлень на `50` євро або більше вона безкоштовна. Напиши програму, яка запитує суму замовлення (ціле число євро) і виводить вартість доставки та загальну суму до сплати. У кожній гілці зберігай вартість доставки у змінну, а обидва рядки результату виводь після завершення умовної інструкції.

      ```
