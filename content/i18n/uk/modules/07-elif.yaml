id: elif
summary: 'Умовні інструкції з кількома гілками: `else` для решти випадків, `elif` для додаткових варіантів, важливість
  порядку умов та порівняння рядків за алфавітним порядком (alphabetical order).'
steps:
- id: elif-else
  sourceTitle: Two branches with else
  title: Дві гілки з `else`
  text: |
    Часто програма має виконати одну дію, якщо умова істинна, й іншу — якщо хибна. З тим, що ти вже знаєш, можна було б написати дві інструкції `if` із протилежними умовами:

    ```python run
    age = int(input("Your age: "))
    if age < 18:
        print("Youth ticket: 6 euros")
    if age >= 18:
        print("Adult ticket: 10 euros")
    ```

    ```input
    15
    ```

    ```output
    Your age: 15
    Youth ticket: 6 euros
    ```

    Такий спосіб працює, але обидві умови мають точно доповнювати одна одну. Якщо змінити число `18` в одній умові та забути змінити в іншій, для певного віку програма може вивести обидва види квитків або не вивести жодного.

    ### Гілка `else`

    **Гілка `else`** (*else branch*) виконується тоді, коли умова відповідного `if` хибна. Вона охоплює всі інші випадки, тому окрема умова для неї не потрібна:

    ```python run
    age = int(input("Your age: "))
    if age < 18:
        print("Youth ticket: 6 euros")
    else:
        print("Adult ticket: 10 euros")
    print("Enjoy the movie!")
    ```

    ```input
    34
    ```

    ```output
    Your age: 34
    Adult ticket: 10 euros
    Enjoy the movie!
    ```

    Після `else` ставлять двокрапку, а команди цієї гілки записують окремим блоком із відступом. `else` і відповідний `if` мають однаковий відступ. Виконується рівно один із двох блоків — не обидва і не жоден. Разом `if` та `else` утворюють одну **умовну інструкцію** (*conditional statement*). Тому `else` не може стояти самостійно: воно розташовується відразу після блоку свого `if`.

    ### Парне чи непарне

    Число парне, якщо під час ділення на `2` остача дорівнює нулю. Без `else` для розрізнення парних і непарних чисел знадобилися б дві інструкції `if`. З `else` достатньо однієї умови:

    ```python run
    number = int(input("Type a whole number: "))
    if number % 2 == 0:
        print(f"{number} is even")
    else:
        print(f"{number} is odd")
    ```

    ```input
    7
    ```

    ```output
    Type a whole number: 7
    7 is odd
    ```

    Той самий принцип допомагає визначити, чи ділиться одне число на інше без остачі: вираз `minutes % 60 == 0` істинний, коли кількість хвилин становить ціле число годин.

    Поширена помилка — додавати умову після `else`, ніби це ще одна інструкція `if`:

    ```python run crash
    temperature = 15
    if temperature > 20:
        print("Wear shorts")
    else temperature <= 20:
        print("Wear jeans")
    ```

    ```crash
      File "main.py", line 4
        else temperature <= 20:
             ^^^^^^^^^^^
    SyntaxError: expected ':'
    ```

    Python очікує двокрапку відразу після `else`. Умову писати не потрібно: `else` вже означає «в усіх інших випадках».

    **Your turn:** заповни пропуск, щоб вікторина виводила `Not quite. It's Jupiter.`, якщо користувач указав будь-яку іншу відповідь:

    ```
    What is the largest planet? Jupiter
    Correct!
    ```
  hints:
  - Друга гілка повинна виконуватися тоді, коли умова `if` хибна.
  - Впиши в пропуск `else`. Двокрапка після пропуску вже є.
