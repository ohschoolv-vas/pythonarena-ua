      ```
    hints:
    - 'Рухайся від найнижчих порогів до найвищих: спочатку `if speed < 1:`, потім `elif speed <= 5:` тощо.'
    - Кожна гілка `elif` виконується лише тоді, коли всі попередні умови хибні, тому повторювати нижню межу не потрібно.
    - Останній випадок, `18` або більше, охоплює все, що залишилося, тому його можна записати через `else`.
- id: elif-comparing-strings
  sourceTitle: Comparing strings
  title: Порівняння рядків
  text: |
    Ти вже порівнював рядки за допомогою `==` та `!=`. Два рядки рівні лише тоді, коли всі їхні символи повністю збігаються, включно з великими літерами та пробілами:

    ```python repl
    >>> "Python" == "python"
    False
    >>> "yes" == "yes "
    False
    >>> "cat" != "dog"
    True
    ```

    ### Алфавітний порядок (alphabetical order)

    Оператори `<` та `>` працюють і з рядками. У простому випадку один рядок вважається «меншим» за інший, якщо відповідне слово стоїть раніше за алфавітом, як у словнику:

    ```python repl
    >>> "apple" < "banana"
    True
    >>> "cat" > "car"
    True
    >>> "car" < "cart"
    True
    ```

    Python порівнює два рядки посимвольно від початку. Вирішальним стає перший символ, який відрізняється. Рядки `"cat"` і `"car"` відрізняються третьою літерою: `t` стоїть після `r`. Якщо один рядок закінчується раніше, як `"car"` порівняно з `"cart"`, коротший рядок іде першим.

    Разом з `elif` так можна розташувати два слова в потрібному порядку:

    ```python run
    first = input("First word: ")
    second = input("Second word: ")
    if first < second:
        print(f"{first} comes before {second}")
    elif first > second:
        print(f"{second} comes before {first}")
    else:
        print("The words are the same")
    ```

    ```input
    pear
    apple
    ```

    ```output
    First word: pear
    Second word: apple
    apple comes before pear
    ```

    ### Великі літери та цифри

    Порядок порівняння Python не зовсім відповідає порядку звичайного словника. Python порівнює числові коди символів: великі латинські літери мають менші коди, ніж малі. Літери з діакритичними знаками, наприклад `é`, мають інші, більші коди. Цифри всередині рядка теж є символами, які порівнюються по одному:

    ```python repl
    >>> "Zebra" < "apple"
    True
    >>> "10" < "9"
    True
    >>> 10 < 9
    False
    ```

    Рядок `"10"` стоїть перед `"9"`, оскільки його перший символ `1` менший за `9`. Тому для коректного порівняння слів варто записувати їх в одному регістрі (наприклад, лише малими літерами), а введені користувачем числа спочатку перетворювати за допомогою `int`.

    **Your turn:** визнач, що виведе програма. Запиши кожен рядок результату.
  hints:
  - Літера `d` розташована в алфавіті після `c`, отже, `"dog"` не менше за `"cat"`.
  - Кожна велика латинська літера має менший код, ніж будь-яка мала латинська літера.
  - 'Рядок `"pen"` закінчується раніше, тому він стоїть перед `"pencil"`. А `"7"` і `"10"` — це рядки: результат
    порівняння визначають їхні перші символи `7` та `1`.'
  more:
