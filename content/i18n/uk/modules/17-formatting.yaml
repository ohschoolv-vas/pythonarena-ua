- id: formatting-widths
  title: Ширина поля та вирівнювання
  text: |
    Значення різної довжини можуть виглядати нерівно. Таблицю легше читати, коли кожен стовпець має власну ширину. У специфікаторі формату число саме по собі задає **ширину поля**: значення займає щонайменше стільки символів, а решту місця заповнюють пробіли.

    ```python run
    fruit = ["fig", "banana", "kiwi"]
    prices = [3, 12, 5]
    for i in range(len(fruit)):
        print(f"{fruit[i]:8}|{prices[i]:4}|")
    ```

    ```output
    fig     |   3|
    banana  |  12|
    kiwi    |   5|
    ```

    Для назв виділено 8 символів, а для цін — 4. Рядки розташовуються біля лівого краю поля, числа — біля правого. Зазвичай це зручно: слова вирівнюються за початком, а числа — за останньою цифрою.

    ### Як вибрати вирівнювання

    Символ перед шириною поля задає вирівнювання: `<` — ліворуч, `>` — праворуч, `^` — по центру:

    ```python run
    word = "cat"
    print(f"[{word:<7}]")
    print(f"[{word:>7}]")
    print(f"[{word:^7}]")
    ```

    ```output
    [cat    ]
    [    cat]
    [  cat  ]
    ```

    Ширина поля визначає **мінімум**, а не максимум символів. Довше значення не обрізається: `{"elephant":4}` усе одно виведе `elephant`, а наступний стовпець зміститься. Вибирайте ширину з урахуванням найдовшого можливого значення.

    ### Ширина поля та знаки після крапки

    Для дробових чисел ширину записують перед крапкою. `{price:7.2f}` показує ціну з двома знаками після крапки в полі шириною 7 символів. Так можна вирівняти десяткові крапки в чеку:

    ```python run
    items = ["Coffee", "Croissant", "Water"]
    prices = [3.5, 2.95, 1.2]
    for i in range(len(items)):
        print(f"{items[i]:<12}{prices[i]:7.2f}")
    print("-" * 19)
    print(f"{'Разом':<12}{sum(prices):7.2f}")
    ```

    ```output
    Coffee         3.50
    Croissant      2.95
    Water          1.20
    -------------------
    Разом          7.65
    ```

    Сума двох значень ширини дорівнює 19 — саме стільки символів у лінії з дефісів. Усередині f-рядка, обмеженого подвійними лапками, текст у фігурних дужках можна записати в одинарних лапках, як `'Разом'`.

    **Термінологія:** `format specifier` — специфікатор формату.

    **Your turn:** заповни пропуски, щоб імена виводилися в стовпці шириною 10 символів із вирівнюванням ліворуч, а бали — у стовпці шириною 4 символи з вирівнюванням праворуч:

    ```
    Ada         12
    Linus        7
    Grace      105
    ```
  hints:
  - Ширину задають числом після двокрапки. `<` вирівнює ліворуч, а `>` — праворуч.
  - Для імен використовуй `<10`, а для балів — `>4`. (Рядки й так вирівнюються ліворуч, а числа — праворуч, тому варіанти `10` і `4` також працюють.)
