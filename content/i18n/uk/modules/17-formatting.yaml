id: formatting
summary: 'Форматування виводу за власними потребами: аргументи sep і end функції print, задана кількість знаків після крапки у f-рядках, ширина поля та вирівнювання для охайних стовпців.'
steps:
- id: formatting-sep-and-end
  title: "Об’єднання значень у print: sep і end"
  text: |
    Дата складається з трьох чисел: день 15, місяць 3, рік 2026. Як вивести їх у вигляді `15.3.2026`? Ось способи, які ви вже знаєте:

    ```python run
    day = 15
    month = 3
    year = 2026
    print(str(day) + "." + str(month) + "." + str(year))
    print(day, ".", month, ".", year)
    print(f"{day}.{month}.{year}")
    ```

    ```output
    15.3.2026
    15 . 3 . 2026
    15.3.2026
    ```

    Об’єднання за допомогою `+` працює, але об’єднувати можна лише рядки, тому кожне число потрібно перетворювати функцією `str`. Якщо передати значення через коми, `str` не потрібна, проте `print` додає між значеннями пробіли, а тут вони зайві. f-рядок одразу дає потрібний результат.

    У способу з `+` є пастка: якщо забути хоча б один виклик `str`, програма завершиться з помилкою.

    ```python run crash
    day = 15
    print("Day " + day)
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        print("Day " + day)
              ~~~~~~~^~~~~
    TypeError: can only concatenate str (not "int") to str
    ```

    ### Роздільник: sep

    Коли ви передаєте функції `print` кілька значень через коми, вона ставить між ними пробіли. Але цей роздільник можна змінити за допомогою аргументу **`sep`**: після значень напишіть `sep=` і потрібний рядок. Перший рядок коду розв’язує задачу з датою:

    ```python run
    print(15, 3, 2026, sep=".")
    print("a", "b", "c", sep=", ")
    print("без", "зайвих", "пробілів", sep="")
    print("один", "рядок", "кожен", sep="\n")
    ```

    ```output
    15.3.2026
    a, b, c
    беззайвихпробілів
    один
    рядок
    кожен
    ```

    `sep=""` об’єднує значення без жодного символу між ними, а `"\n"` — це символ переходу на новий рядок. Тому `sep="\n"` виводить кожне значення з нового рядка.

    `sep` — це **іменований аргумент** (keyword argument): його задають за назвою, `sep=`, а не за позицією. Так `print` відрізняє його від значень, які потрібно вивести.

    ### Завершення рядка: end

    За замовчуванням кожен `print` завершує вивід переходом на новий рядок. Тому наступний `print` починає друкувати з нового рядка. Іменований аргумент **`end`** дозволяє змінити завершення виводу:

    ```python run
    print("Завантаження", end="")
    print("...", end="")
    print("готово")
    for i in range(1, 6):
        print(i, end=" ")
    print()
    print("Наступний рядок")
    ```

    ```output
    Завантаження...готово
    1 2 3 4 5
    Наступний рядок
    ```

    З `end=""` наступний `print` продовжує вивід у тому самому рядку. У циклі `end=" "` дозволяє вивести всі числа в одному рядку, розділивши їх пробілами. Порожній `print()` після циклу завершує цей рядок. Без нього напис `Наступний рядок` з’явився б одразу після числа 5.

    В одному виклику можна одночасно використовувати `sep` і `end`: `print(1, 2, sep="+", end="=3\n")` виведе `1+2=3`.

    **Your turn:** заповни пропуски назвами іменованих аргументів, щоб програма вивела:

    ```
    15.3.2026
    Loading...done
    ```
  hints:
  - Один аргумент задає, що буде між значеннями, а інший — що буде наприкінці рядка.
  - '`sep` — це роздільник між значеннями, а `end` замінює символ переходу на новий рядок наприкінці виводу.'
