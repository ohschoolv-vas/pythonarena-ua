    - '`sep="\n"` розміщує кожне значення в окремому рядку.'
- id: formatting-decimals
  title: Знаки після крапки у f-рядках
  text: |
    Після ділення можна отримати число з багатьма знаками після крапки. Звичайний вивід показує всі ці знаки:

    ```python run
    total = 10
    people = 3
    share = total / people
    print(f"Кожен платить {share}")
    ```

    ```output
    Кожен платить 3.3333333333333335
    ```

    За допомогою f-рядка можна задати спосіб відображення значення. Після значення у фігурних дужках поставте двокрапку та **специфікатор формату** (format specifier). `.2f` означає «число з двома знаками після крапки»:

    ```python run
    total = 10
    people = 3
    share = total / people
    print(f"Кожен платить {share:.2f}")
    print(f"Точно: {share:.5f}")
    print(f"Приблизно: {share:.0f}")
    ```

    ```output
    Кожен платить 3.33
    Точно: 3.33333
    Приблизно: 3
    ```

    Число перед літерою `f` задає кількість знаків після крапки, а останній знак округлюється: наприклад, для 2/3 із `.2f` отримаємо `0.67`. Літера `f` походить від слова **float** — число з рухомою крапкою. Саме значення при цьому не змінюється: змінюється лише його відображення.

    Специфікатор також додає відсутні знаки після крапки, що зручно для цін. Наприклад, до цілого числа додаються нулі:

    ```python run
    price = 4
    discount = 0.5
    print(f"{price:.2f} {discount:.2f} {price - discount:.2f}")
    ```

    ```output
    4.00 0.50 3.50
    ```

    Останнє значення показує, що всередині фігурних дужок можна виконувати обчислення, а після них указувати специфікатор формату.

    ### f-рядок — це теж рядок

    f-рядок не обов’язково відразу передавати функції `print`. Він створює звичайний рядок, який можна зберегти у змінній, об’єднати з іншими рядками або повернути з функції:

    ```python run
    def receipt_line(item: str, price: float) -> str:
        return f"{item}: {price:.2f}"


    line = receipt_line("Tea", 2.5)
    print(line)
    print(receipt_line("Cake", 3.75) + " (сьогоднішня пропозиція)")
    print(len(line))
    ```

    ```output
    Tea: 2.50
    Cake: 3.75 (сьогоднішня пропозиція)
    9
    ```

    Функція `receipt_line` повертає відформатований текст, а код, який її викликає, вирішує, що з ним робити. `len(line)` підтверджує, що `line` — звичайний рядок із 9 символів.

    **Your turn:** заповни пропуск специфікатором формату, щоб програма вивела середнє значення з двома знаками після крапки:

    ```
    Average: 7.67
    ```
  hints:
  - Специфікатор формату записують після двокрапки всередині фігурних дужок.
  - 'Два знаки після крапки задаються як `.2f`: крапка, кількість знаків і літера `f`.'
