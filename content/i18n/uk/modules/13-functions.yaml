# Українська локалізація Python Arena.
# Перекладено лише навчальні тексти, заголовки, завдання та підказки.
# Код, перевірки та очікувані результати беруться з оригінального модуля.
id: functions
summary: 'Створення власних функцій: визначення через `def`, виклики, передавання параметрів і аргументів, а також пояснення,
  чому функція має використовувати свої параметри, а не зовнішні змінні.'
steps:
- id: functions-define
  sourceTitle: Your own functions
  title: Власні функції
  text: |
    Ти вже не раз викликав готові функції: `print`, `input`, `int`, `len`. Вони входять до складу Python. Тепер навчишся створювати власні. **Функція (function)** — це іменований фрагмент коду: його пишуть один раз, а потім запускають за назвою щоразу, коли він потрібен.

    ### Визначення функції

    ```python run
    def greet():
        print("Hello!")
        print("Nice to see you.")
    ```

    **Визначення функції (function definition)** починається з ключового слова `def` (скорочення від *define* — «визначити»). Далі йдуть назва функції, круглі дужки та двокрапка. Цей перший рядок — **заголовок функції (header)**. Під ним, із відступом, як у блоці `if` або `while`, записують **тіло функції (body)** — код, що виконується під час її використання.

    Запусти цю програму — і нічого не станеться. Це не помилка: `def` лише визначає функцію, тобто повідомляє Python, що означає назва `greet`. Її тіло виконується тільки тоді, коли функцію **викликають (call)**.

    ### Виклик функції

    Щоб викликати функцію, напиши її назву, а після неї — круглі дужки, як у випадку з `print`:

    ```python run
    def greet():
        print("Hello!")
        print("Nice to see you.")


    greet()
    print("...")
    greet()
    ```

    ```output
    Hello!
    Nice to see you.
    ...
    Hello!
    Nice to see you.
    ```

    Python читає визначення й запам’ятовує функцію. Потім кожен виклик запускає її тіло один раз. Функцію можна викликати скільки завгодно разів — саме заради цього її й визначають.

    Назви функцій підпорядковуються тим самим правилам, що й назви змінних: малі літери та символи підкреслення між словами, наприклад `print_menu` (стиль *snake_case*). Після визначення функції перед наступним кодом залишай два порожні рядки. Python цього не вимагає, але так програму легше читати; це звичний стиль оформлення коду Python.

    ### Функції на цьому сайті

    Відтепер у багатьох завданнях потрібно буде написати функцію. Система перевірки **сама викликає твою функцію**, тому зазвичай достатньо лише її визначення — без власних викликів і без `input`. Наприклад, перевірка з викликом `greet()` запускає `greet()` і порівнює вивід з очікуваним. Щоб перевірити функцію кнопкою **Run**, можеш додати виклик під визначенням; під час автоматичної перевірки враховуватиметься вивід її власних викликів.

    У початковому коді завдань на функції часто бачиш `pass` замість тіла. Це інструкція, яка нічого не робить. Тіло функції не може бути порожнім, тому `pass` тимчасово займає місце, доки ти не напишеш справжній код. Заміни її власними інструкціями.

    **Your turn:** заповни пропуск так, щоб програма визначила функцію `cheer`, яка під час виклику виводить `Hip hip hooray!`.
  hints:
  - Визначення функції починається з ключового слова, після якого йдуть назва функції, круглі дужки та двокрапка.
  - Це ключове слово — скорочення від англійського *define* («визначити»).
  more:
  - index: 0
    task: |
      Напиши функцію `print_menu()`, яка виводить таке меню:

      ```
      1. Start
      2. Settings
      3. Quit
      ```
    hints:
    - Заміни `pass` трьома викликами `print` з відступом чотири пробіли — таким самим, як у `pass`.
    - Система перевірки самостійно викликає `print_menu()`, тому додавати власний виклик не потрібно.
  - index: 1
    task: |
      Визнач, що виведе ця програма. Запиши кожен рядок результату.
    hints:
    - Саме визначення функції нічого не виводить. Тіло `chorus` виконується лише під час виклику.
    - 'Простеж рядки під визначенням зверху вниз: кожен виклик `chorus()` виводить рядок зі свого тіла.'
- id: functions-calling
  sourceTitle: Calling functions
  title: Виклик функцій
  text: |
    Англійський термін: **function call** — виклик функції.
    

    Коли Python зустрічає виклик функції, він переходить до її тіла, виконує інструкції, а потім повертається до рядка відразу після виклику. Тому порядок виконання рядків має значення.

    ### Спочатку визнач, потім викликай

    Python виконує програму зверху вниз, а `def` — така сама інструкція, як інші. Поки Python не виконає визначення, назви функції ще не існує. Тому виклик перед визначенням спричиняє помилку:

    ```python run crash
    greet()


    def greet():
        print("Hello!")
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 1, in <module>
        greet()
        ^^^^^
    NameError: name 'greet' is not defined
    ```

    Розміщуй визначення функцій на початку програми, а код, який їх використовує, — нижче.

    ### Функції, які викликають інші функції

    Тіло функції може викликати інші функції, зокрема створені тобою. Тут `title` двічі викликає `line`:

    ```python run
    def line():
        print("-" * 20)


    def title():
        line()
        print("   Weekly report")
        line()


    title()
    print("All tasks done.")
    ```

    ```output
    --------------------
       Weekly report
    --------------------
    All tasks done.
    ```

    Простежмо за викликами. `title()` переходить до тіла `title`. Його перший рядок викликає `line()`: ця функція виводить риски й повертає керування до `title` саме туди, де виконання зупинилося. Далі виводиться заголовок, `line()` виконується ще раз, а після завершення `title` Python повертається до основної програми й виводить останній рядок.

    Функція може викликати й іншу функцію, визначення якої стоїть нижче у файлі. Головне, щоб на момент **виконання виклику** друга функція вже була визначена. Тіло `title` почне працювати лише після виклику `title()`, а на той час Python уже виконає обидва визначення.

    ### Не забувай круглі дужки

    Саме дужки перетворюють назву функції на її виклик. Одна лише назва позначає функцію, але не запускає її:

    ```python run
    def beep():
        print("Beep!")


    beep
    print("Was there a beep?")
    ```

    ```output
    Was there a beep?
    ```

    Python навіть не повідомляє про помилку: окремий рядок із назвою дозволений, проте нічого корисного не робить. Якщо твоя функція чомусь не запускається, перевір, чи є `()` після її назви.

    **Your turn:** заповни пропуски так, щоб функція `banner` використовувала `stars` для першого й останнього рядків. Виклик `banner()` має вивести:

    ```
    **********
    * SALE!  *
    **********
    ```
  hints:
  - Перший і останній рядки банера точно збігаються з тим, що виводить `stars`.
  - 'У кожному пропуску виклич `stars`: запиши її назву з круглими дужками.'
  more:
  - index: 0
    task: |
      Напиши дві функції. `countdown()` виводить числа 3, 2 і 1 (кожне з нового рядка) за допомогою циклу. `launch()` викликає `countdown()`, а потім виводить `Liftoff!`. Виклик `launch()` має вивести:

      ```
      3
      2
      1
      Liftoff!
      ```
    hints:
    - 'У `countdown` запиши звичайний цикл: допоміжна змінна починається з 3, є умова й оновлення. Усі рядки циклу мають бути
      всередині функції.'
    - 'Функція `launch` містить два рядки: виклик `countdown()` і виклик `print`.'
  - index: 1
    task: |
      Визнач, що виведе ця програма. Запиши кожен рядок результату.
    hints:
    - '`a` викликає `b`, хоча `b` визначено нижче. Це працює, бо на момент виклику `a()` функцію `b` уже визначено.'
    - Після завершення `b` Python повертається до `a` й продовжує з рядка після виклику.
- id: functions-parameters
  sourceTitle: Parameters and arguments
  title: Параметри та аргументи
  text: |
    Функція `print` виводить усе, що ти передаєш їй у круглих дужках. Твої власні функції також можуть отримувати значення. У заголовку функції запиши назву змінної в дужках — і під час кожного виклику ця змінна отримуватиме передане значення:

    ```python run
    def greet(name):
        print(f"Hello, {name}!")


    greet("Ada")
    greet("Linus")
    ```

    ```output
    Hello, Ada!
    Hello, Linus!
    ```

    Змінна `name` у заголовку — це **параметр (parameter)**. Значення `"Ada"` у виклику — це **аргумент (argument)**. Під час виклику параметр отримує значення аргументу, після чого виконується тіло функції. Кожен виклик може передавати інший аргумент, тож одна функція виконує ту саму дію з різними даними.

    Ці два слова легко переплутати, і програмісти іноді вживають їх як синоніми. Але різницю варто знати: **параметр** — це назва, яку функція використовує всередині, а **аргумент** — значення, передане ззовні під час виклику.

    ### Аргументом може бути будь-яке значення

    Аргументом може бути будь-який вираз: записане безпосередньо значення, змінна або обчислення. Спочатку Python обчислює вираз, а потім передає результат:

    ```python run
    def show_square(number):
        print(f"{number} squared is {number * number}")


    show_square(4)
    side = 7
    show_square(side)
    show_square(side + 1)
    ```

    ```output
    4 squared is 16
    7 squared is 49
    8 squared is 64
    ```

    У виклику `show_square(side)` параметр `number` отримує значення змінної `side`, тобто 7. Назви не зобов’язані збігатися: функція отримує лише значення.

    Усередині тіла параметр поводиться як звичайна змінна. Його можна використовувати в обчисленнях, `if`, циклах або f-рядках і навіть змінювати. Така зміна залишатиметься всередині функції.

    ### Якщо аргумент не передано

    Якщо функція має параметр, під час кожного виклику потрібно передати відповідний аргумент:

    ```python run crash
    def greet(name):
        print(f"Hello, {name}!")


    greet()
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 5, in <module>
        greet()
        ~~~~~^^
    TypeError: greet() missing 1 required positional argument: 'name'
    ```

    У повідомленні вказано назву функції та параметр, для якого не передали значення. Слово *positional* означає, що аргументи зіставляються з параметрами за порядком: перший — із першим. Це особливо важливо, коли параметрів більше ніж один, як у наступному уроці.

    **Your turn:** заповни пропуск параметром, щоб функція вітала гостя, ім’я якого передано під час виклику. Виклик `welcome("Grace")` має вивести:

    ```
    Welcome, Grace!
    Your table is ready, Grace.
    ```
  hints:
  - Тіло використовує змінну, яка ще не отримала значення. Його потрібно передати під час виклику.
  - 'Параметр записується в дужках заголовка. Його назва має збігатися з тією, яку використовує тіло: `guest`.'
  more:
  - index: 0
    task: |
      Напиши функцію `underline(text)`, яка виводить текст, а в рядку під ним — стільки символів `=`, скільки символів має текст. Виклик `underline("Hello")` виводить:

      ```
      Hello
      =====
      ```
    hints:
    - Параметр `text` містить рядок, переданий під час виклику. Спочатку виведи цей рядок.
    - Під ним виведи символ `"="`, повторений `len(text)` разів.
  - index: 1
    task: |
      Напиши функцію `countdown(start)`, яка в одному рядку виводить числа від `start` до 1, додаючи пробіл після кожного числа, а потім — `Go!`. Виклик `countdown(3)` виводить:

      ```
      3 2 1 Go!
      ```

      Якщо передати аргумент 0, функція виведе лише `Go!`.
    hints:
    - Створи рядок, який спочатку порожній. У циклі додавай поточне число та пробіл, зменшуючи число від `start` до 1.
    - 'Параметр `start` може бути лічильником циклу: `while start > 0:` і `start -= 1` у тілі.'
    - Після циклу додай до рядка `Go!` і виведи результат.
- id: functions-several-parameters
  sourceTitle: Several parameters
  title: Кілька параметрів
  text: |
    Англійський термін: **parameter** — параметр.
    

    Функція може мати кілька параметрів, розділених комами. Під час виклику їй передають відповідну кількість аргументів. Вони зіставляються **за порядком**: перший аргумент — першому параметру, другий — другому тощо.

    ```python run
    def introduce(name, age):
        print(f"{name} is {age} years old.")


    introduce("Mia", 12)
    introduce(40, "Leo")
    ```

    ```output
    Mia is 12 years old.
    40 is Leo years old.
    ```

    У другому виклику аргументи передано в неправильному порядку. Python не знає, що вони означають: він просто записує перший аргумент у параметр `name`. Передавай аргументи в тому порядку, у якому параметри оголошено в заголовку.

    ### Допоміжні змінні та розгалуження

    У тілі функції, як і в будь-якій програмі, можуть бути власні допоміжні змінні, інструкції `if` та цикли:

    ```python run
    def compare(a, b):
        difference = a - b
        if difference > 0:
            print(f"{a} is {difference} more than {b}")
        elif difference < 0:
            print(f"{a} is {-difference} less than {b}")
        else:
            print(f"{a} and {b} are equal")


    compare(10, 4)
    compare(3, 8)
    compare(5, 5)
    ```

    ```output
    10 is 6 more than 4
    3 is 5 less than 8
    5 and 5 are equal
    ```

    Змінна `difference` створюється всередині функції кожного разу, коли та виконується. Вона належить функції, і решта програми не може звертатися до неї напряму.

    ### Назви параметрів належать функції

    Назви параметрів не пов’язані зі змінними поза функцією, навіть якщо вони збігаються. Тут в основній програмі теж є змінні `width` і `height`:

    ```python run
    def area(width, height):
        print(f"A {width} by {height} rectangle has an area of {width * height}")


    width = 2
    height = 3
    area(10, 5)
    area(height, width)
    ```

    ```output
    A 10 by 5 rectangle has an area of 50
    A 3 by 2 rectangle has an area of 6
    ```

    Під час першого виклику `width` усередині функції дорівнює 10 незалежно від значення зовнішньої змінної `width`. У другому виклику перший аргумент — зовнішня змінна `height`, що має значення 3. Тому всередині функції `width` дорівнює 3. Значення має лише **порядок аргументів**, а не назви змінних у місці виклику.

    **Your turn:** визнач, що виведе ця програма. Запиши кожен рядок результату.
  hints:
  - Перший аргумент завжди потрапляє в `item`, а другий — у `price`.
  - У другому виклику спочатку обчислюється `cost + 1`, результат — 6.
  - В останньому виклику аргументи переплутані місцями, але Python усе одно використовує їх у переданому порядку.
  more:
  - index: 0
    task: |
      Напиши функцію `times_table(number, count)`, яка виводить перші `count` рядків таблиці множення для числа `number`. Виклик `times_table(3, 4)` виводить:

      ```
      3 x 1 = 3
      3 x 2 = 6
      3 x 3 = 9
      3 x 4 = 12
      ```
    hints:
    - Скористайся допоміжною змінною, яка в циклі змінюється від 1 до `count`.
    - 'На кожній ітерації виводь один рядок за допомогою f-рядка: число, текст ` x `, лічильник, текст ` = ` і добуток.'
  - index: 1
    task: |
      Напиши функцію `report(points, maximum)`, яка виводить набрані бали відносно максимальної кількості та відсоток — ціле число з округленням донизу, як у прикладі. У наступному рядку функція виводить `Passed`, якщо відсоток не менший за 50, або `Try again` в іншому випадку. Виклик `report(45, 60)` виводить:

      ```
      45/60 points (75%)
      Passed
      ```
    hints:
    - Відсоток — це набрані бали, помножені на 100 і поділені на максимальну кількість. Оператор `//` ділить з округленням
      донизу.
    - Збережи відсоток у допоміжній змінній, виведи перший рядок через f-рядок, а потім вибери повідомлення за допомогою `if`
      і `else`.
- id: functions-global-variables
  sourceTitle: Parameters, not outside variables
  title: Параметри замість зовнішніх змінних
  text: |
    Досі функції отримували всі потрібні дані через свої параметри. Але функція може також бачити змінні основної програми — ті, що створено **поза всіма функціями**. Їх називають **глобальними змінними (global variables)**. Python дозволяє функціям використовувати їх, але краще уникати цієї звички: вона може спричиняти помилки, які важко помітити.

    Ось приклад. Спочатку програма працювала з однією температурою у змінній `temperature`. Потім перетворення градусів Цельсія на градуси Фаренгейта винесли в окрему функцію, але одну назву в обчисленні забули змінити:

    ```python run
    temperature = 25


    def to_fahrenheit(celsius):
        fahrenheit = temperature * 9 / 5 + 32
        print(f"{celsius} C is {fahrenheit} F")


    to_fahrenheit(0)
    to_fahrenheit(100)
    to_fahrenheit(25)
    ```

    ```output
    0 C is 77.0 F
    100 C is 77.0 F
    25 C is 77.0 F
    ```

    Вода не замерзає за 77 градусів Фаренгейта й не кипить за такої температури. Параметр `celsius` використовується лише у тексті виводу, а обчислення досі бере `temperature` — глобальну змінну. Тому кожен виклик перетворює ті самі 25 градусів. Останній рядок правильний лише випадково: аргумент збігся зі значенням глобальної змінної. Якби функцію перевірили тільки з аргументом 25, могло б здатися, що все працює.

    ### Чому виникає помилка

    Функція, яка використовує лише параметри, виконує ту саму роботу незалежно від місця виклику: усі потрібні дані надходять разом із викликом. Функція, що читає глобальну змінну, залежить від зовнішнього стану. Якщо ця змінна зміниться або взагалі не існуватиме, поведінка функції зміниться, хоча її код ніхто не редагував. Ось та сама функція в програмі без глобальної змінної:

    ```python run crash
    def to_fahrenheit(celsius):
        fahrenheit = temperature * 9 / 5 + 32
        print(f"{celsius} C is {fahrenheit} F")


    to_fahrenheit(100)
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 6, in <module>
        to_fahrenheit(100)
        ~~~~~~~~~~~~~^^^^^
      File "main.py", line 2, in to_fahrenheit
        fahrenheit = temperature * 9 / 5 + 32
                     ^^^^^^^^^^^
    NameError: name 'temperature' is not defined
    ```

    У цьому *traceback* показано два місця: спочатку виклик у рядку 6, потім рядок 2 всередині `to_fahrenheit`, де виникла помилка. Читай повідомлення знизу: останні рядки показують, на чому зупинилася програма.

    Перевірки на цьому сайті працюють схожим чином. Вони завантажують твою програму та самостійно викликають функцію зі своїми аргументами. Якщо функція залежить від глобальної змінної, під час перевірки її може не існувати або вона матиме значення, не пов’язане з переданими аргументами.

    ### Усі потрібні дані — через параметри

    Коли функції потрібне значення, оголоси для нього параметр і передавай його як аргумент під час виклику. Власні змінні, які функція створює для обчислень, наприклад `total` нижче, використовувати можна: вони належать самій функції.

    ```python run
    def price_with_tax(price, tax_percent):
        total = price + price * tax_percent // 100
        print(f"{price} with {tax_percent}% tax is {total}")


    price_with_tax(100, 24)
    price_with_tax(50, 10)
    ```

    ```output
    100 with 24% tax is 124
    50 with 10% tax is 55
    ```

    **Your turn:** цю функцію раніше перевіряли в програмі, де випадково існувала глобальна змінна `count`, тому здавалося, що все працює. Коли функцію викликають окремо, вона завершується помилкою. Виправ код так, щоб використовувалися лише параметри функції. Виклик `order_summary("soup", 2)` має вивести:

    ```
    Order: 2 x soup
    Kitchen, please make 2 portions.
    ```
  hints:
  - Запусти перевірку й прочитай повідомлення про помилку. Яку назву не визначено і в якому рядку?
  - '`count` не є параметром функції. Кількість порцій міститься в параметрі `amount`.'
