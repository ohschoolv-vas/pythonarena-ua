# Українська локалізація Python Arena.
# Перекладено лише навчальні тексти, заголовки, завдання та підказки.
# Код, приклади введення/виведення і тести успадковуються з оригінального YAML.
id: loop-conditions
summary: Цикли `while` з умовою, три частини циклу з лічильником (initialization, condition, update), умови на основі `and`,
  `or`, `not`, запобігання нескінченним циклам, налагодження (*debugging*) і поступове створення рядків.
steps:
- id: loop-conditions-while-condition
  sourceTitle: A loop with a condition
  title: Цикл `while` з умовою
  text: |
    Англійський термін: **loop condition** — умова циклу.
    

    У попередньому модулі кожен цикл починався з `while True:`. Оскільки `True` завжди означає істину, такий цикл сам по собі виконувався б безкінечно — його зупиняла команда `break` усередині. Але можливості `while` ширші: як і `if`, ця інструкція може перевіряти будь-яку **умову** (*condition*). Цикл виконується доти, доки умова істинна.

    Ось цикл у стилі попереднього модуля. Він рахує до трьох:

    ```python run
    number = 1
    while True:
        if number > 3:
            break
        print(number)
        number += 1
    print("Done")
    ```

    ```output
    1
    2
    3
    Done
    ```

    А ось такий самий цикл, але з умовою:

    ```python run
    number = 1
    while number <= 3:
        print(number)
        number += 1
    print("Done")
    ```

    ```output
    1
    2
    3
    Done
    ```

    Ось як Python виконує його:

    1. Перевіряє умову `number <= 3`. Якщо вона істинна, виконує рядки з відступом під `while` — **тіло циклу** (*body*).
    2. Коли тіло виконано, повертається до рядка `while` і знову перевіряє умову.
    3. Щойно умова стає хибною, пропускає тіло та переходить до першого рядка після циклу.

    Одне виконання тіла називається **ітерацією** (*iteration*), як і в попередньому модулі. Тут також використовуємо коротше слово **повторення** (*round*). У цьому прикладі тіло виконується тричі, коли `number` має значення `1`, `2` та `3`. Після третьої ітерації `number` стає рівним `4`, умова `4 <= 3` є хибною, і цикл завершується.

    Порівняй дві умови. `if` перед `break` указує, **коли зупинитися**: `number > 3`. Умова `while` указує, **поки продовжувати**: `number <= 3`. Це протилежні перевірки. Варіант з умовою коротший, а читач відразу бачить, доки виконуватиметься цикл.

    ### Умова перевіряється перед виконанням тіла

    Python перевіряє умову перед кожною ітерацією, навіть першою. Якщо вона хибна від самого початку, тіло циклу не виконається жодного разу:

    ```python run
    lap = int(input("Starting lap: "))
    while lap <= 5:
        print(f"Lap {lap}")
        lap += 1
    print("Race over")
    ```

    ```input
    3
    ```

    ```output
    Starting lap: 3
    Lap 3
    Lap 4
    Lap 5
    Race over
    ```

    Якщо ввести `8`, умова `8 <= 5` одразу буде хибною. Тому після запрошення до введення програма виведе лише `Race over`.

    Умова перевіряється тільки на початку кожного повторення. Якщо вона стала хибною посеред тіла, решта команд тіла все одно виконається. Цикл завершиться, коли Python повернеться до рядка `while` і знову перевірить умову.

    **Your turn:** заповни пропуск в умові, щоб програма вивела числа, кратні `5`, від `5` до `50` включно — кожне з нового рядка.
  hints:
  - Цикл повинен продовжуватися, доки `number` не перевищує `50`.
  - «Не більше ніж» означає `<=`. Порівняй `number` із `50`.
  more:
  - index: 0
    task: |
      Визнач, що виведе ця програма. Запиши кожен рядок результату.
    hints:
    - '`//` виконує цілочисельне ділення з округленням униз: `5 // 2` дорівнює `2`.'
    - Перед кожною ітерацією перевіряй, чи досі істинна умова `x > 1`. Записуй значення `x` після кожного повторення.
    - 'Значення `x` змінюються так: `20`, `10`, `5`, `2`, а потім `1`. Які з них виводяться всередині циклу?'
  - index: 1
    task: |
      Напиши програму, яка запитує `How many steps? ` і виводить по одному рядку для кожної сходинки — від `Step 1` до номера, який увів користувач. Після цього вона має вивести `At the top!`. Використай цикл `while` з умовою, а не `while True`.

      ```
      How many steps? 3
      Step 1
      Step 2
      Step 3
      At the top!
      ```
    hints:
    - Потрібна друга змінна для підрахунку сходинок. Перед циклом надай їй значення `1`.
    - 'Цикл продовжується, поки лічильник не перевищує `steps`: `while step <= steps:`.'
    - У тілі циклу виведи рядок через f-string, а потім збільш лічильник на `1`. Команда `At the top!` має стояти після циклу,
      без відступу.
- id: loop-conditions-three-parts
  sourceTitle: Start, condition, update
  title: Початок, умова й оновлення
  text: |
    Цикл із лічильником потребує трьох складових. Розгляньмо їх на прикладі програми, яка виводить час відправлення автобуса кожні дві години:

    ```python run
    hour = 9  # 1. the start value
    while hour <= 17:  # 2. the condition
        print(f"{hour}:00")
        hour += 2  # 3. the update
    ```

    ```output
    9:00
    11:00
    13:00
    15:00
    17:00
    ```

    1. **Початкове значення** (*initialization*): перед циклом змінна, яку перевіряє умова, отримує перше значення. Тут `hour` починається з `9`.
    2. **Умова** (*condition*): на початку кожного повторення визначає, чи потрібно ще виконувати тіло циклу.
    3. **Оновлення** (*update*): усередині тіла змінна змінюється так, щоб кожне повторення наближало цикл до завершення. Тут `hour` щоразу зростає на `2`, тому рано чи пізно умова `hour <= 17` стане хибною.

    Якщо хоча б одну із цих складових пропустити або записати неправильно, цикл працюватиме не так, як очікувалося.

    ### Забули початкове значення

    Якщо змінну не ініціалізувати, її ще не існуватиме, коли Python уперше спробує перевірити умову:

    ```python run crash
    while total < 100:
        total += 30
    print(total)
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 1, in <module>
        while total < 100:
              ^^^^^
    NameError: name 'total' is not defined
    ```

    Виправлення просте: перед циклом потрібно надати `total` початкове значення, наприклад `total = 0`.

    ### Забули оновлення

    Без оновлення значення в умові не змінюється. Якщо умова одного разу істинна, вона такою й залишиться назавжди:

    ```python fragment
    hour = 9
    while hour <= 17:
        print(f"{hour}:00")
    ```

    Така програма без кінця виводить `9:00` — це нескінченний цикл (*infinite loop*), як у попередньому модулі. На власному комп'ютері його можна зупинити комбінацією **Ctrl+C**. На цьому сайті програму зупиняють автоматично, якщо вона працює понад кілька секунд або виводить надто багато даних.

    Є й підступніша помилка: команду оновлення записано без потрібного відступу:

    ```python fragment
    hour = 9
    while hour <= 17:
        print(f"{hour}:00")
    hour += 2
    ```

    Рядок `hour += 2` не має відступу, отже, він не належить до тіла циклу. Повторюються лише рядки з відступом. Ця команда мала б виконатися один раз після завершення циклу, але цикл ніколи не завершиться.

    Змінна може також змінюватися в неправильному напрямку. Якщо написати `hour -= 2`, значення `hour` щоразу зменшуватиметься й завжди залишатиметься меншим за `17`. Тому перед запуском циклу запитай себе: чи наближає кожна ітерація момент, коли умова стане хибною?

    **Your turn:** програма повинна виводити рядки від `Round 1` до `Round 4`, а потім `Game over`, проте ніколи не зупиняється. Виправ помилку.

    ```
    Round 1
    Round 2
    Round 3
    Round 4
    Game over
    ```
  hints:
  - Які рядки повторюються? Тільки рядки з відступом під `while` входять до тіла циклу.
  - Оновлення `round_number += 1` стоїть поза циклом, тож цикл ніколи до нього не доходить. Зроби відступ у чотири пробіли,
    як у `print` над ним.
  more:
  - index: 0
    task: |
      Заповни початкове значення, умову та команду оновлення так, щоб програма вивела показані рівні заряду батареї, а потім `Empty`.

      ```
      100
      75
      50
      25
      Empty
      ```
    hints:
    - Перше виведене число — початкове значення. Кожне наступне на `25` менше за попереднє.
    - Цикл має тривати, поки в батареї ще є заряд. Порівняй `battery` з `0`.
    - 'Оновлення зменшує `battery` на `25`: `battery -= 25`.'
  - index: 1
    task: |
      Напиши програму, яка запитує два цілі числа через підказки `From: ` та `To: ` і виводить усі цілі числа від першого до другого включно, у правильному порядку. Якщо перше число більше за друге, програма не повинна виводити жодного числа.

      ```
      From: 4
      To: 7
      4
      5
      6
      7
      ```
    hints:
    - 'Спочатку визнач три частини циклу: початкове значення — перше число; умова — доки поточне число не перевищує останнє;
      оновлення — збільшення на `1`.'
    - 'Використай лічильник із початковим значенням `first`: `number = first`. Тоді цикл матиме умову `while number <= last:`.'
    - Якщо перше число більше за друге, умова хибна відразу, тому тіло циклу не виведе нічого.
- id: loop-conditions-writing-conditions
  sourceTitle: Writing conditions
  title: Складання умов для циклів
  text: |
    Англійський термін: **loop condition** — умова циклу.
    

    Умовою циклу може бути будь-який вираз, який можна записати після `if`: одне порівняння або кілька порівнянь, об'єднаних операторами `and`, `or` та `not`. З оператором `and` цикл продовжується лише тоді, коли **обидві** частини умови істинні. Щойно хоча б одна стає хибною, цикл завершується.

    У цій невеликій грі турист проходить `4` км за одну ітерацію та витрачає `3` одиниці енергії. Похід закінчується, коли турист пройде `12` км або коли вичерпається енергія — залежно від того, що станеться раніше:

    ```python run
    energy = int(input("Energy: "))
    distance = 0
    while distance < 12 and energy > 0:
        distance += 4
        energy -= 3
        print(f"{distance} km walked, energy {energy}")
    print("The hike is over")
    ```

    ```input
    10
    ```

    ```output
    Energy: 10
    4 km walked, energy 7
    8 km walked, energy 4
    12 km walked, energy 1
    The hike is over
    ```

    За початкових `10` одиниць енергії турист доходить до `12` км, і цикл завершується через умову `distance < 12`. Якщо енергії лише `5`, вона вичерпується раніше: після двох повторень стає `-1`, тож похід закінчується після `8` км.

    ### Переконайся, що цикл завершиться

    Перш ніж покладатися на цикл, перевір, чи справді його умова колись стане хибною за будь-яких вхідних даних. У цій грі кожен удар зменшує здоров'я дракона на `3` одиниці. Дракон падає, коли здоров'я закінчується:

    ```python run
    health = int(input("Dragon's health: "))
    hits = 0
    while health != 0:
        health -= 3
        hits += 1
    print(f"The dragon falls after {hits} hits")
    ```

    ```input
    9
    ```

    ```output
    Dragon's health: 9
    The dragon falls after 3 hits
    ```

    Якщо в дракона `9` одиниць здоров'я, значення змінюється так: `6`, `3`, `0`. Після цього `health != 0` стає хибною умовою. Але якщо спочатку здоров'я дорівнює `10`, послідовність буде `7`, `4`, `1`, `-2`, `-5` і далі: значення перестрибує через `0` й ніколи не дорівнює йому. Цикл не завершується, і здається, що програма зависла. Перевірка каже «поки здоров'я не дорівнює точно нулю», але потрібно «поки здоров'я ще є»: `while health > 0:`. Така умова стає хибною і за `0`, і за від'ємного значення. Якщо здоров'я спочатку `10`, дракон падає після чотирьох ударів. Так само під час збільшення лічильника порівняння `<` або `<=` надійніше зупинить цикл, який може перестрибнути межу, ніж `!=`.

    ### Налагодження циклу (*debugging*)

    Якщо цикл поводиться неправильно, спочатку перевір його умову. Знак `<` замість `<=` може пропустити останню ітерацію, а `!=`, якщо змінна перестрибує потрібне значення, — зробити цикл нескінченним. Допоможуть дві звички:

    - **Зафіксуй вхідні дані під час перевірки.** Щоразу вручну вводити відповідь на `input` незручно. Тимчасово закоментуй рядок із `input`, а нижче задай змінній потрібне значення. Щоб повернути введення, віднови початковий рядок. Якщо перевірка не проходить для певного числа, використовуй саме його: так кожен запуск відтворюватиме помилку.
    - **Виводь значення на кожній ітерації.** Додатковий налагоджувальний `print` у тілі циклу показує зміну змінних. Коли програму виправлено, прибери ці рядки, інакше зайвий вивід заважатиме проходити тести.

    У наступному прикладі програма рахує, скільки квадратів (`1 * 1`, `2 * 2`, `3 * 3` тощо) треба додати, щоб сума досягла цілі. Тут використано обидва прийоми:

    ```python run
    # goal = int(input("Goal: "))
    goal = 30
    total = 0
    count = 0
    while total < goal:
        count += 1
        total += count * count
        print("debug:", count, total)
    print(f"{count} squares add up to at least {goal}")
    ```

    ```output
    debug: 1 1
    debug: 2 5
    debug: 3 14
    debug: 4 30
    4 squares add up to at least 30
    ```

    Налагоджувальні рядки показують кожне повторення й підтверджують, що цикл зупиняється, щойно `total` досягає `30`.

    **Your turn:** у цій грі за кожну спробу нараховується однакова кількість очок. Цикл має продовжуватися, поки зроблено **менше ніж 5 спроб** **і** сума очок **менша за 10**. Заповни умову.

    ```
    Points per try: 3
    Try 1: score 3
    Try 2: score 6
    Try 3: score 9
    Try 4: score 12
    ```
  hints:
  - 'Умова складається з двох частин: одна про `tries`, друга про `score`. Цикл працює лише тоді, коли обидві частини істинні.'
  - Менше п’яти спроб — це `tries < 5`, а кількість очок менша за десять — `score < 10`. Об’єднай порівняння через `and`.
  more:
  - index: 0
    task: |
      Програма виводить числа від початкового значення, збільшуючи їх на `4`, доки вони менші за `30`. Для початкового значення `2` вона працює, але для `3` ніколи не завершується. Виправ умову, щоб програма працювала для будь-якого початкового значення.

      ```
      Start: 2
      2
      6
      10
      14
      18
      22
      26
      Done
      ```
    hints:
    - 'Перевір із початковим значенням `3`: на папері або підставивши його у код. Послідовність буде `3`, `7`, `11`, ...,
      `27`, `31`. Чи дорівнює число коли-небудь `30`?'
    - Цикл має працювати, доки число **менше за** `30`, а не доки воно просто відрізняється від `30`.
  - index: 1
    task: |
      Напиши програму, яка запитує мету заощадження й суму, що відкладається кожного тижня, за допомогою підказок `Goal: ` та `Saved per week: `. Потім вона щотижня додає суму та виводить загальні заощадження після кожного тижня — доти, доки сума не досягне мети. Наприкінці програма виводить кількість витрачених тижнів.

      ```
      Goal: 100
      Saved per week: 30
      Week 1: 30
      Week 2: 60
      Week 3: 90
      Week 4: 120
      Weeks needed: 4
      ```
    hints:
    - 'Потрібні дві допоміжні змінні з початковим значенням `0`: загальна сума заощаджень і кількість тижнів.'
    - Цикл триває, поки загальна сума менша за мету. На кожній ітерації додай `1` до кількості тижнів, щотижневий внесок —
      до суми, а потім виведи рядок.
    - 'Останній рядок виводиться після циклу, коли суму вже накопичено: `Weeks needed: ...`.'
- id: loop-conditions-building-strings
  sourceTitle: Strings that grow round by round
  title: Рядки, що зростають на кожній ітерації
  text: |
    У попередньому модулі ти збирав рядки всередині циклу: починав із **порожнього рядка** (*empty string*) `""` і на кожній ітерації додавав нову частину за допомогою `+=`. Так само можна працювати і в циклі з умовою. Частини можуть бути f-рядками (*f-strings*), тож для чисел не знадобиться окреме перетворення через `str()`:

    ```python run
    countdown = ""
    number = 5
    while number > 0:
        countdown += f"{number}... "
        number -= 1
    countdown += "Go!"
    print(countdown)
    ```

    ```output
    5... 4... 3... 2... 1... Go!
    ```

    Чому не виводити кожну частину відразу? Тому що кожен виклик `print` починає новий рядок, а весь зворотний відлік потрібно показати в одному рядку. Крім того, зібраний рядок можна використати пізніше: після циклу додати до нього текст, як тут `Go!`, вивести його двічі або спочатку перевірити.

    ### Вибір частини рядка

    На кожній ітерації можна вирішувати, який символ додати. Цей цикл малює лінійку: символ `|` стоїть на кожній п'ятій позиції, а в усіх інших місцях — крапка:

    ```python run
    ruler = ""
    position = 0
    while position <= 20:
        if position % 5 == 0:
            ruler += "|"
        else:
            ruler += "."
        position += 1
    print(ruler)
    ```

    ```output
    |....|....|....|....|
    ```

    Цикл виконує `21` ітерацію для позицій від `0` до `20`. На кожній з них умова `if` обирає потрібний символ. Оператор `%` дає остачу від ділення, тому `position % 5 == 0` істинне для позицій `0`, `5`, `10`, `15` і `20`.

    ### Роздільники: спочатку перша частина

    У попередньому модулі ми використовували `if`, щоб роздільник не опинився наприкінці рядка: додавали його лише тоді, коли рядок уже не був порожнім. Але якщо першу частину відомо ще до початку циклу, є простіший спосіб. Запиши її в рядок перед циклом, а кожну наступну частину додавай разом із роздільником **перед** нею:

    ```python run
    evens = "2"
    number = 4
    while number <= 10:
        evens += f", {number}"
        number += 2
    print(f"Even numbers: {evens}")
    ```

    ```output
    Even numbers: 2, 4, 6, 8, 10
    ```

    Кожна кома опиняється між двома числами, а всередині циклу не потрібен `if`. Зверни увагу: початкове значення `number` тут `4`, а не `2`, бо число `2` вже є в рядку.

    **Your turn:** програма малює індикатор прогресу з `10` позицій: символ `#` для кожного виконаного завдання та `-` — для кожного невиконаного. Заповни рядок, який додає символ `#` до індикатора.

    ```
    Tasks done (out of 10): 4
    [####------]
    ```
