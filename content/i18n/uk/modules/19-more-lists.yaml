id: more-lists
summary: Списки рядків, дійсних чисел і значень різних типів; три типові помилки у функціях, що перебирають списки; вкладені списки як записи даних; матриці з рядками й стовпцями та ігрове поле.
steps:
- id: more-lists-any-type
  title: Списки рядків, дійсних чисел та інших значень
  text: |
    Досі більшість ваших списків містили цілі числа. Але список може зберігати значення будь-якого типу: рядки, дійсні числа, логічні значення і навіть інші списки (про це йтиметься в третьому кроці цього модуля). Усе, що ви вже знаєте про списки, працює однаково незалежно від типу їхніх елементів.

    ### Список рядків

    ```python run
    guests = ["Maya", "Leo", "Iris"]
    guests.append("Omar")
    print(guests)
    print("Гостей:", len(guests))

    guests.sort()
    for guest in guests:
        print(guest)
    ```

    ```output
    ['Maya', 'Leo', 'Iris', 'Omar']
    Гостей: 4
    Iris
    Leo
    Maya
    Omar
    ```

    Коли Python виводить цілий список, кожен рядок показується в лапках: так видно, де один елемент закінчується, а наступний починається. Метод `sort` впорядковує рядки за алфавітом.

    Зверніть увагу на великі літери: Python порівнює рядки посимвольно, причому кожна велика літера стоїть перед будь-якою малою. Тому `"Zoe"` буде перед `"adam"`:

    ```python repl
    >>> sorted(["adam", "Zoe", "bea"])
    ['Zoe', 'adam', 'bea']
    ```

    ### Список дійсних чисел

    Для списків дійсних чисел функції `sum`, `min` і `max` працюють так само, як і для списків цілих чисел:

    ```python run
    rainfall = [12.5, 0.0, 3.2, 8.8, 0.4]

    print("Найбільше опадів за день:", max(rainfall))
    mean = sum(rainfall) / len(rainfall)
    print(f"Середнє: {mean:.2f} mm")
    ```

    ```output
    Найбільше опадів за день: 12.5
    Середнє: 4.98 mm
    ```

    ### Поєднання різних типів

    Один список може навіть містити значення різних типів, наприклад назву товару, кількість на складі та ціну: `["lamp", 3, 19.99]`. Це дозволено, але деякі операції вже не працюватимуть. Під час сортування Python порівнює елементи між собою, а порівняти число з рядком за величиною він не може:

    ```python run crash
    mixed = [3, "lamp", 19.99]
    mixed.sort()
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        mixed.sort()
        ~~~~~~~~~~^^
    TypeError: '<' not supported between instances of 'str' and 'int'
    ```

    Знак `<` у повідомленні вказує на порівняння, яке намагався виконати метод `sort`. Зазвичай список містить значення одного типу. У третьому кроці ви побачите, коли змішаний список може бути корисним.

    **Your turn:** довжини стрибків жаби збережено в метрах. Заповніть пропуски, щоб програма вивела найдовший стрибок і середню довжину стрибка:

    ```
    Longest: 3.15
    Mean: 2.50
    ```
  hints:
  - Для кожного пропуску в Python є вбудована функція. Вони однаково працюють зі списками дійсних і цілих чисел.
  - "Найбільший елемент знаходить `max(jumps)`. Середнє — це сума елементів, поділена на їхню кількість: `sum(jumps) / len(jumps)`."
  more:
  - index: 0
    task: |
      Що виведе ця програма? Запишіть кожен рядок виводу.
    hints:
    - "`sort` впорядковує рядки за алфавітом, але всі великі літери стоять перед малими."
    - "Після сортування список має вигляд `['Bob', 'Dan', 'alice', 'eve']`."
    - "`names[2]` — це `'alice'`, а `len` рахує кількість літер у ньому."
  - index: 1
    task: |
      Напишіть функцію `above_average(values)`, яка приймає список дійсних чисел і повертає новий список значень, більших за середнє арифметичне всіх значень, зберігаючи початковий порядок.

      Наприклад, середнє для `[2.5, 4.0, 1.5, 6.0]` дорівнює 3.5, тому `above_average([2.5, 4.0, 1.5, 6.0])` повертає `[4.0, 6.0]`. Якщо жодне значення не перевищує середнього, функція повертає порожній список.
    hints:
    - Спочатку один раз обчисліть середнє арифметичне перед циклом. Потім переберіть значення й порівняйте кожне із середнім.
    - "Почніть із порожнього списку `result = []` і додавайте через `append` кожне значення, більше за середнє. Поверніть `result` після циклу."
    - "Середнє арифметичне обчислюється так: `sum(values) / len(values)`."
- id: more-lists-function-bugs
  title: Три поширені помилки у функціях
  text: |
    У функціях, які перебирають список, трапляються кілька типових помилок. Вони не завжди викликають повідомлення про помилку: функція виконується, але повертає неправильну відповідь. Через це їх складно помітити. Варто навчитися їх розпізнавати.

    ### Помилка 1: використання змінної поза функцією

    Функція може звертатися до змінних основної частини програми. Якщо випадково використати таку змінну, функція лише здаватиметься правильною:

    ```python run
    def print_items(items: list):
        for item in shopping:
            print(item)


    shopping = ["milk", "eggs"]
    print_items(shopping)
    print_items(["tea", "rice"])
    ```

    ```output
    milk
    eggs
    milk
    eggs
    ```

    Цикл перебирає список `shopping`, а не параметр `items`, тому функція друкує той самий список незалежно від переданого аргументу. Гірше того: у ваших програмах виклики для перевірки функцій часто розміщені під умовою `if __name__ == "__main__":`, а перевірки на цьому сайті викликають функцію без виконання цього блоку. Тоді змінна `shopping` взагалі не існує, і виникає `NameError`. Усередині функції використовуйте її параметри та створені в ній змінні.

    ### Помилка 2: перезапис параметра

    Ця функція повинна підраховувати оцінки, не менші за задану межу:

    ```python run
    def count_at_least(scores: list, score: int) -> int:
        count = 0
        for score in scores:
            if score >= score:
                count += 1
        return count


    print(count_at_least([3, 8, 5, 10], 6))
    ```

    ```output
    4
    ```

    Правильна відповідь — 2 (для 8 і 10). Але змінна циклу має те саме ім’я, що й другий параметр, тому вже на першій ітерації значення межі 6 замінюється оцінкою 3. Після цього умова `score >= score` порівнює число із самим собою і завжди є істинною. Давайте змінним різні назви:

    ```python fragment
    def count_at_least(scores: list, limit: int) -> int:
        count = 0
        for score in scores:
            if score >= limit:
                count += 1
        return count
    ```

    Те саме станеться, якщо назвати допоміжний список усередині функції так само, як параметр, наприклад `scores = []`: переданий до функції список буде замінено.

    ### Помилка 3: надто ранній `return`

    Оператор `return` одразу завершує виконання функції, навіть посеред циклу. Ця функція має визначати, чи є у списку хоча б одне від’ємне число:

    ```python run
    def has_negative(numbers: list) -> bool:
        for number in numbers:
            if number < 0:
                return True
            else:
                return False


    print(has_negative([4, -2, 7]))
    ```

    ```output
    False
    ```

    Перше число, 4, не є від’ємним, тому гілка `else` повертає `False` ще до того, як цикл дійде до -2. Одного від’ємного числа достатньо, щоб відповісти «так», але для відповіді «ні» треба перевірити всі числа. Тому `return False` має стояти після циклу:

    ```python run
    def has_negative(numbers: list) -> bool:
        for number in numbers:
            if number < 0:
                return True
        return False


    print(has_negative([4, -2, 7]))
    print(has_negative([4, 2, 7]))
    ```

    ```output
    True
    False
    ```

    **Your turn:** функція `all_even(numbers)` має повертати `True`, якщо всі числа списку парні, та `False` в іншому разі. Зараз вона завершує роботу надто рано: `all_even([2, 4, 5])` повертає `True`. Виправте помилку.
  hints:
  - Яку відповідь можна повернути відразу після перевірки одного числа, а для якої потрібно перевірити всі числа?
  - Достатньо одного непарного числа, щоб повернути `False`. Тому всередині циклу повертайте `False`, якщо число непарне (`number % 2 != 0`).
  - "`return True` має бути після циклу, на тому самому рівні відступу, що й `for`: якщо цикл завершився, жодного непарного числа не було."
  more:
  - index: 0
    task: |
      Що виведе ця програма? Запишіть кожен рядок виводу.
    hints:
    - Змінна циклу має те саме ім’я, що й другий параметр. Що станеться зі словом, яке передали як параметр?
    - "На кожній ітерації `word` містить поточне слово зі списку, тому вираз `word == word` порівнює його із самим собою."
    - Умова істинна на кожній ітерації, тож функція рахує всі слова списку.
  - index: 1
    task: |
      Напишіть функцію `first_long_word(words, min_length)`, яка повертає перше слово зі списку, що містить щонайменше `min_length` символів. Якщо такого слова немає, повертає порожній рядок `""`.

      Наприклад, `first_long_word(["sun", "planet", "galaxy"], 5)` повертає `"planet"`, а `first_long_word(["sun", "moon"], 5)` — `""`.
    hints:
    - Переберіть слова циклом `for`. Щойно знайдете достатньо довге слово, відповідь уже відома — його можна одразу повернути.
    - "Порожній рядок потрібен лише тоді, коли жодне слово не підійшло. Тому `return \"\"` слід поставити після циклу, а не в блоці `else`."
    - Назвіть змінну циклу інакше, ніж параметри, наприклад `word`.
- id: more-lists-nested
  title: Списки всередині списків
  text: |
    Елементами списку можуть бути інші списки:

    ```python run
    teams = [["Ana", "Ben"], ["Cleo", "Dev", "Eli"], ["Finn"]]
    print(teams)
    print(teams[1])
    print(teams[1][0])
    print(len(teams), len(teams[1]))
    ```

    ```output
    [['Ana', 'Ben'], ['Cleo', 'Dev', 'Eli'], ['Finn']]
    ['Cleo', 'Dev', 'Eli']
    Cleo
    3 3
    ```

    Читайте вираз `teams[1][0]` зліва направо: `teams[1]` — друга команда, тобто ще один список, а `[0]` вибирає перше ім’я в ньому. Зовнішній список має три елементи, і кожен із них теж є списком.

    ### Список як запис даних

    Невеликий список може зберігати відомості про один об’єкт, причому кожне поле має свій індекс. Наприклад, у записі про книгу назва може бути за індексом 0, рік видання — за індексом 1, а кількість сторінок — за індексом 2:

    ```python fragment
    ["The Glass Garden", 2011, 312]
    ```

    Список із таких списків — це невелика база даних. Цикл `for` перебирає її по одному запису:

    ```python run
    books = [
        ["The Glass Garden", 2011, 312],
        ["Night Trains", 1998, 205],
        ["River of Salt", 2020, 448],
    ]

    for book in books:
        title = book[0]
        year = book[1]
        pages = book[2]
        print(f"{title} ({year}), {pages} стор.")
    ```

    ```output
    The Glass Garden (2011), 312 стор.
    Night Trains (1998), 205 стор.
    River of Salt (2020), 448 стор.
    ```

    На кожній ітерації змінна `book` містить один із внутрішніх списків. Якщо зберегти його елементи в змінних зі зрозумілими назвами, решту коду буде легше читати.

    Додавання запису — це виклик `append` з цілим списком. Пошук найкращого запису схожий на пошук найбільшого числа, але тепер порівнюють окреме поле, а зберігають увесь запис:

    ```python run
    books = [
        ["The Glass Garden", 2011, 312],
        ["Night Trains", 1998, 205],
        ["River of Salt", 2020, 448],
    ]
    books.append(["Paper Moons", 1987, 260])

    oldest = books[0]
    for book in books:
        if book[1] < oldest[1]:
            oldest = book

    print("Найстаріша книга:", oldest[0], oldest[1])
    ```

    ```output
    Найстаріша книга: Paper Moons 1987
    ```

    Недолік такого запису — необхідність пам’ятати значення кожного індексу: з виразу `book[2]` не видно, що це кількість сторінок. Словники, з якими ви ознайомитеся трохи пізніше, дають змогу задавати назву кожному полю.

    **Термінологія:** `list of lists` — список списків.

    **Your turn:** кожна тварина представлена списком із клички, виду та віку. Заповніть пропуски, щоб програма вивела:

    ```
    Rex is a dog, 4 years old
    Tom is a cat, 7 years old
    Polly is a parrot, 12 years old
    ```
  hints:
  - На кожній ітерації `pet` — це один із внутрішніх списків, наприклад `["Rex", "собака", 4]`.
  - Кличка має індекс 0, вид тварини — 1, а вік — 2.
