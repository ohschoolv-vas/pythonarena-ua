- id: more-lists-matrices
  title: "Матриці: рядки та стовпці"
  text: |
    Таблиця чисел із рядками та стовпцями називається **матрицею**. У Python це список рядків, кожен із яких теж є списком чисел. Розгляньмо продажі в кафе за три дні: один рядок відповідає дню, а один стовпець — товару (кава, чай, тістечка):

    ```python run
    sales = [
        [14, 6, 3],
        [20, 4, 7],
        [11, 9, 5],
    ]

    print(sales[1][2])
    sales[1][2] = 8
    print(sales[1])
    ```

    ```output
    7
    [20, 4, 8]
    ```

    Перший індекс вибирає рядок, а другий — стовпець. Обидва відлічуються від нуля: `sales[1][2]` — кількість тістечок за другий день. За допомогою цих двох індексів також можна змінити значення.

    ### Перебір елементів матриці

    Цикл `for` перебирає матрицю по одному рядку. Ще один цикл усередині першого перебирає числа цього рядка:

    ```python run
    sales = [
        [14, 6, 3],
        [20, 4, 7],
        [11, 9, 5],
    ]

    total = 0
    for row in sales:
        for amount in row:
            print(amount, end=" ")
            total += amount
        print()

    print("Усього:", total)
    ```

    ```output
    14 6 3
    20 4 7
    11 9 5
    Усього: 79
    ```

    ### Рядок і стовпець

    Отримати окремий рядок просто: `sales[0]` уже є списком. А значення одного стовпця розміщені в різних рядках за однаковим індексом. Тому функція для обробки стовпця проходить по рядках і бере елемент із потрібним індексом:

    ```python run
    def row_total(matrix: list, row_index: int) -> int:
        return sum(matrix[row_index])


    def column_total(matrix: list, column_index: int) -> int:
        total = 0
        for row in matrix:
            total += row[column_index]
        return total


    sales = [
        [14, 6, 3],
        [20, 4, 7],
        [11, 9, 5],
    ]
    print("День 1:", row_total(sales, 0))
    print("Чай:", column_total(sales, 1))
    ```

    ```output
    День 1: 23
    Чай: 19
    ```

    ### Зміна кожного значення

    Ця спроба помножити всі числа на десять нічого не змінить у матриці:

    ```python run
    grid = [[1, 2], [3, 4]]
    for row in grid:
        for number in row:
            number *= 10
    print(grid)
    ```

    ```output
    [[1, 2], [3, 4]]
    ```

    Операція `number *= 10` змінює тільки змінну `number`, а не елемент списку, із якого взяли значення. Щоб змінити список, потрібно звертатися за індексами. За допомогою `range` індекси рядків перебирають від 0 до `len(grid) - 1`, а індекси стовпців рядка `i` — від 0 до `len(grid[i]) - 1`:

    ```python run
    grid = [[1, 2], [3, 4]]
    for i in range(len(grid)):
        for j in range(len(grid[i])):
            grid[i][j] *= 10
    print(grid)
    ```

    ```output
    [[10, 20], [30, 40]]
