  - "Функція, яка підраховує елементи списку, — та сама, що й для підрахунку символів у рядку."
  - "Перший елемент має індекс 0. Порахуйте від 0, щоб знайти індекс `\"Earth\"`."
  - "`len(planets)` дорівнює 4, перша планета — `planets[0]`, а `Earth` має індекс 2."
