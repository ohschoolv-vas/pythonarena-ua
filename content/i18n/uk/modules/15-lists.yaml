    - "Після `scores.sort()` найменший бал буде першим елементом, а найбільший — останнім."
    - "Перший елемент — `scores[0]`, останній — `scores[-1]`."
- id: lists-functions
  title: 'max, min, sum: методи та функції'
  text: |
    У Python є функції для найпоширеніших дій зі списком чисел. **`max`** повертає найбільший елемент, **`min`** — найменший, а **`sum`** — суму всіх елементів:

    ```python run
    sales = [120, 75, 210, 95]
    print("Найкращий день:", max(sales))
    print("Найгірший день:", min(sales))
    print("Усього:", sum(sales))
    print("Середнє:", sum(sales) / len(sales))
    ```

    ```output
    Найкращий день: 210
    Найгірший день: 75
    Усього: 500
    Середнє: 125.0
    ```

    Середнє арифметичне — це сума, поділена на кількість елементів. Функції `max` і `min` працюють також із рядками: тоді вони повертають останній і перший елементи за порядком сортування відповідно.

    ### Методи та функції

    Тепер ви знаєте два види команд для роботи зі списками. Записуються вони по-різному:

    - **Методи** записують після назви списку через крапку: `sales.append(80)`, `sales.sort()`, `sales.pop()`. Більшість із них змінює список.
    - **Функції** отримують список як аргумент у дужках: `len(sales)`, `max(sales)`, `sum(sales)`, `sorted(sales)`. Вони повертають значення й не змінюють початковий список.

    ```python run
    sales = [120, 75, 210]
    sales.append(95)
    sales.sort()
    print(sales)
    print(len(sales), max(sales), sorted(sales))
    ```

    ```output
    [75, 95, 120, 210]
    4 210 [75, 95, 120, 210]
    ```

    Їх легко переплутати, але Python повідомить про помилку. Наприклад, методу `max` у списку немає:

    ```python run crash
    sales = [120, 75, 210]
    print(sales.max())
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        print(sales.max())
              ^^^^^^^^^
    AttributeError: 'list' object has no attribute 'max'
    ```

    Так само немає окремої функції `sort`:

    ```python run crash
    sales = [120, 75, 210]
    sort(sales)
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        sort(sales)
        ^^^^
    NameError: name 'sort' is not defined. Did you mean: 'sorted'?
    ```

    Помилка `AttributeError`, у якій згадано `'list' object`, може означати, що ви викликали функцію як метод. А `NameError` може виникнути, якщо написати назву методу як назву звичайної функції.

    У порожнього списку немає найбільшого чи найменшого елемента, тому `max([])` і `min([])` спричиняють `ValueError`. Натомість `sum([])` повертає 0.

    **Your turn:** заповніть пропуски, щоб програма вивела загальну кількість кроків, найбільший і найменший показники:

    ```
    Total: 31200
    Highest: 9800
    Lowest: 3100
    ```
  hints:
  - "Кожен пропуск — це назва функції, яка приймає список як аргумент."
  - "`sum` обчислює суму елементів, `max` знаходить найбільший, а `min` — найменший."
