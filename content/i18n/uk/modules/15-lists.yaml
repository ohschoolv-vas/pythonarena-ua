    - "Видаліть її через `playlist.remove(song)` — це видалення за значенням."
- id: lists-sorting
  title: "Сортування: sort та sorted"
  text: |
    Метод **`sort`** упорядковує елементи списку за зростанням: від найменшого до найбільшого. Рядки він сортує за алфавітом:

    ```python run
    scores = [12, 30, 7, 18]
    scores.sort()
    print(scores)
    names = ["Linus", "Ada", "Grace"]
    names.sort()
    print(names)
    ```

    ```output
    [7, 12, 18, 30]
    ['Ada', 'Grace', 'Linus']
    ```

    `sort` змінює сам список, тому початковий порядок втрачається. Якщо потрібно зберегти оригінал, використайте функцію **`sorted`**. Вона не змінює переданий список, а повертає новий відсортований список:

    ```python run
    arrivals = ["Linus", "Ada", "Grace"]
    alphabetical = sorted(arrivals)
    print(arrivals)
    print(alphabetical)
    ```

    ```output
    ['Linus', 'Ada', 'Grace']
    ['Ada', 'Grace', 'Linus']
    ```

    Отже, список `arrivals` і далі показує порядок прибуття, а `alphabetical` містить його відсортовану копію.

    Щоб упорядкувати елементи від найбільшого до найменшого, відсортуйте список, а потім розверніть його методом **`reverse`**, який змінює порядок елементів на протилежний:

    ```python run
    scores = [12, 30, 7, 18]
    scores.sort()
    scores.reverse()
    print(scores)
    ```

    ```output
    [30, 18, 12, 7]
    ```

    ### Поширена помилка

    Метод `sort` змінює список, але нічого не повертає (точніше, повертає `None`). Якщо зберегти результат його виклику, отримаєте `None`, а не відсортований список:

    ```python run
    scores = [12, 30, 7]
    ordered = scores.sort()
    print(ordered)
    print(scores)
    ```

    ```output
    None
    [7, 12, 30]
    ```

    Можна відсортувати сам список методом `scores.sort()` і далі працювати з `scores`, або створити відсортовану копію через `ordered = sorted(scores)`. Так само працюють `append`, `insert` і `remove`: вони змінюють список і повертають `None`. Тому вираз `scores = scores.append(5)` замінить список у змінній `scores` на `None`.

    ### Великі літери

    Під час сортування рядків Python ставить усі великі латинські літери перед малими. Тому `"Zebra"` опиниться перед `"apple"`:

    ```python repl
    >>> sorted(["banana", "Zebra", "apple"])
    ['Zebra', 'apple', 'banana']
    ```

    Якщо потрібний звичний алфавітний порядок, записуйте всі рядки в одному регістрі.

    **Your turn:** програма повинна вивести оцінки спочатку в початковому порядку, а потім — за зростанням. Але другий рядок зараз показує `None`. Виправте код так, щоб отримати:

    ```
    [12, 30, 7, 18]
    [7, 12, 18, 30]
    ```
  hints:
  - "`scores.sort()` сортує сам список `scores` і повертає `None`, тому змінна `ordered` містить `None`, а початковий порядок `scores` втрачається."
  - "Натомість створіть відсортовану копію: `ordered = sorted(scores)`. Тоді `scores` залишиться незмінним."
