id: lists
summary: Зберігання багатьох значень в одному списку. Індекси, додавання елементів за допомогою append та insert, видалення через pop і remove, сортування методами sort і sorted, функції max, min і sum, відмінності між методами та функціями, а також передавання списків у власні функції та повернення списків із них.
steps:
- id: lists-items
  title: Списки та індекси
  text: |
    Уявіть програму, яка зберігає температуру за тиждень. З тим, що ви вже знаєте, для неї знадобилося б сім змінних — від `monday` до `sunday`. А програма, яка зчитує значення, доки користувач не зупиниться, узагалі не змогла б працювати так: під час виконання вона не вміє вигадувати нові назви змінних. **Список** (*list*) розв’язує обидві проблеми: дає змогу зберігати будь-яку кількість значень під одним ім’ям. Список записують у квадратних дужках, розділяючи значення комами:

    ```python run
    temperatures = [18, 21, 17, 25]  # список із чотирьох чисел
    names = ["Ada", "Linus", "Grace"]
    empty = []
    print(temperatures)
    print(names)
    print(empty)
    ```

    ```output
    [18, 21, 17, 25]
    ['Ada', 'Linus', 'Grace']
    []
    ```

    Значення у списку називаються **елементами** (*items*). `[]` — це порожній список, у якому ще немає елементів. Коли ви виводите список, Python показує його так, як він записується в коді. Тому рядки у списку відображаються в лапках, як і в інтерпретаторі.

    ### Індекси

    Кожен елемент має **індекс** — його позицію у списку. Як і для символів рядка, індексація починається з 0, а індекс `-1` позначає останній елемент:

    ```python run
    temperatures = [18, 21, 17, 25]
    print(temperatures[0])
    print(temperatures[2])
    print(temperatures[-1])
    print("Зміна від першого до останнього:", temperatures[-1] - temperatures[0])
    ```

    ```output
    18
    17
    25
    Зміна від першого до останнього: 7
    ```

    Функція `len` повертає кількість елементів, тому індекс останнього елемента дорівнює `len(temperatures) - 1`. Звернення до неіснуючого індексу призводить до помилки:

    ```python run crash
    temperatures = [18, 21, 17, 25]
    print(len(temperatures))
    print(temperatures[4])
    ```

    ```output
    4
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 3, in <module>
        print(temperatures[4])
              ~~~~~~~~~~~~^^^
    IndexError: list index out of range
    ```

    У списку є 4 елементи з індексами від 0 до 3. Індекс 4 вказував би на п’ятий елемент, якого немає.

    ### Зміна елемента

    На відміну від рядка, список можна змінювати після створення. Щоб змінити елемент, присвойте йому нове значення так само, як змінній:

    ```python run
    temperatures = [18, 21, 17, 25]
    temperatures[2] = 19
    temperatures[0] = temperatures[0] + 1
    print(temperatures)
    ```

    ```output
    [19, 21, 19, 25]
    ```

    Інші елементи залишаться без змін. Індекс у квадратних дужках ліворуч від `=` вказує, якому саме елементу присвоїти нове значення.

    **Your turn:** заповніть пропуски так, щоб програма вивела кількість планет у списку, першу планету, а потім список, у якому назву `Earth` замінено на `Terra`:

    ```
    Planets: 4
    Closest to the sun: Mercury
    ['Mercury', 'Venus', 'Terra', 'Mars']
    ```
