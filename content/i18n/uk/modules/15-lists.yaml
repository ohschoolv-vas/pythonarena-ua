- id: lists-in-functions
  title: Списки як аргументи та значення, що повертаються
  text: |
    Ваші власні функції теж можуть приймати список як аргумент — так само, як це роблять `len` і `max`. Для позначення типу списку використовують `list`:

    ```python run
    def summary(numbers: list) -> str:
        return f"Кількість чисел: {len(numbers)}; від {min(numbers)} до {max(numbers)}"


    print(summary([4, 18, 9]))
    ages = [34, 7, 61, 25, 12]
    print(summary(ages))
    ```

    ```output
    Кількість чисел: 3; від 4 до 18
    Кількість чисел: 5; від 7 до 61
    ```

    Усередині функції параметр `numbers` — це список, переданий під час виклику: спочатку `[4, 18, 9]`, а потім список зі змінної `ages`.

    Функція може також повертати список. Ось приклад: вона зчитує слова до введення порожнього рядка й повертає всі введені слова:

    ```python run
    def read_words(prompt: str) -> list:
        words = []
        while True:
            word = input(prompt)
            if word == "":
                break
            words.append(word)
        return words


    fruit = read_words("Фрукт: ")
    print("За порядком:", sorted(fruit))
    print("Останній за алфавітом:", max(fruit))
    ```

    ```input
    plum
    banana
    fig

    ```

    ```output
    Фрукт: plum
    Фрукт: banana
    Фрукт: fig
    Фрукт:
    За порядком: ['banana', 'fig', 'plum']
    Останній за алфавітом: plum
    ```

    Функція створює список у власній змінній і повертає його після завершення циклу. Код, який викликав функцію, зберігає повернутий список і далі працює з ним.

    ### Навіщо потрібні функції

    Подивіться на три останні рядки цієї програми: зчитати назви фруктів, вивести їх за порядком, вивести останню за алфавітом назву. Кожен рядок описує, *що* потрібно зробити, а *як* це реалізовано (цикл, порожній рядок, `append`) — приховано всередині `read_words`. Програму, поділену на зрозумілі частини з назвами, легше читати та виправляти.

    Крім того, функцію можна використовувати в різних місцях. Тут `spread` визначено лише один раз, але її викликають дві інші функції:

    ```python run
    def spread(numbers: list) -> int:
        return max(numbers) - min(numbers)


    def weather(temperatures: list) -> str:
        if spread(temperatures) > 10:
            return "день із великими змінами"
        return "день зі стабільною температурою"


    def judges(scores: list) -> str:
        return f"Різниця між оцінками суддів: {spread(scores)}"


    print(weather([12, 19, 25, 14]))
    print(weather([20, 22, 21]))
    print(judges([7, 9, 8, 6]))
    ```

    ```output
    день із великими змінами
    день зі стабільною температурою
    Різниця між оцінками суддів: 3
    ```

    Якби у `spread` була помилка, її вистачило б виправити в одному місці — і обидві функції почали б працювати правильно.

    **Your turn:** напишіть функцію `price_range(prices: list) -> str`, яка повертає найнижчу й найвищу ціну зі списку у вигляді рядка. Наприклад, `price_range([12, 3, 8])` повертає `'від 3 до 12'`.
  hints:
  - "`min(prices)` і `max(prices)` повертають найнижчу та найвищу ціну."
  - "Поверніть f-рядок, у якому вирази `min(prices)` і `max(prices)` у фігурних дужках розміщені між словами `від` і `до`."
