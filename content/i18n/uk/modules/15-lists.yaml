- id: lists-adding
  title: "Додавання елементів: append та insert"
  text: |
    Список часто спочатку порожній і поступово збільшується під час виконання програми. Метод **`append`** додає елемент у кінець списку:

    ```python run
    scores = []
    scores.append(12)
    scores.append(30)
    scores.append(7)
    print(scores)
    print(len(scores))
    ```

    ```output
    [12, 30, 7]
    3
    ```

    Як і `upper` для рядків, `append` — це метод: його записують після назви списку через крапку. Він змінює саме той список, для якого його викликано. Отже, `scores.append(12)` додасть 12 до `scores`, а не до будь-якого іншого списку.

    Особливо зручно використовувати `append` у циклі. Ця програма зчитує імена, доки користувач не введе порожній рядок:

    ```python run
    names = []
    while True:
        name = input("Ім’я: ")
        if name == "":
            break
        names.append(name)
    print(names)
    print("Імен:", len(names))
    ```

    ```input
    Ada
    Linus
    Grace

    ```

    ```output
    Ім’я: Ada
    Ім’я: Linus
    Ім’я: Grace
    Ім’я:
    ['Ada', 'Linus', 'Grace']
    Імен: 3
    ```

    Програмі не потрібно заздалегідь знати, скільки імен буде введено: після кожного введення список просто збільшується на один елемент.

    Метод `append` приймає рівно один елемент. Щоб додати два, викличте метод двічі:

    ```python run crash
    scores = [12, 30]
    scores.append(7, 9)
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        scores.append(7, 9)
        ~~~~~~~~~~~~~^^^^^^
    TypeError: list.append() takes exactly one argument (2 given)
    ```

    ### Додавання в певну позицію

    Метод **`insert`** вставляє елемент за вказаним індексом. Він приймає два аргументи: спочатку індекс, а потім елемент. Елементи, починаючи з цієї позиції, зсуваються на одне місце праворуч:

    ```python run
    queue = ["Ada", "Linus", "Grace"]
    queue.insert(0, "Guido")
    print(queue)
    queue.insert(2, "Margaret")
    print(queue)
    ```

    ```output
    ['Guido', 'Ada', 'Linus', 'Grace']
    ['Guido', 'Ada', 'Margaret', 'Linus', 'Grace']
    ```

    Виклик `insert(0, ...)` вставляє елемент на самий початок. Після першої вставки Ada перемістилася з індексу 0 на індекс 1, тому `"Margaret"` з індексом 2 опинилася між Ada та Linus.

    **Your turn:** заповніть пропуски, щоб програма додала `milk` у кінець списку покупок, а `bread` — на його початок:

    ```
    ['bread', 'eggs', 'apples', 'milk']
    ```
  hints:
  - "Один метод додає елемент у кінець списку, а інший — за заданим індексом."
  - "`append` додає в кінець; `insert` спочатку приймає індекс, тому `insert(0, ...)` вставляє елемент на початок."
