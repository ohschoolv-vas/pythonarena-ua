  - index: 1
    task: |
      Напишіть програму, яка зчитує екзаменаційні бали (цілі числа) до введення порожнього рядка. Потім вона виводить бали за зростанням, найменший і найбільший бал:

      ```
      Score: 15
      Score: 9
      Score: 20
      Score:
      [9, 15, 20]
      Lowest: 9
      Highest: 20
      ```

      Можна вважати, що користувач введе принаймні один бал.
