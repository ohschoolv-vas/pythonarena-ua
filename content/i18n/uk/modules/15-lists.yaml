- id: lists-removing
  title: "Видалення елементів: pop та remove"
  text: |
    Черга біля стійки скорочується з початку: наступним обслуговують того, хто стоїть першим, незалежно від його імені. А зі списку гостей людину видаляють за іменем: наприклад, Linus скасовує візит, хоч би де він був у списку. Для обох випадків у Python є окремі методи.

    Метод **`pop`** працює з позиціями. Він видаляє елемент за вказаним індексом, а всі наступні елементи зсуваються на одне місце ліворуч. Метод також повертає видалений елемент, тому його можна використати далі:

    ```python run
    queue = ["Ada", "Linus", "Grace", "Guido"]
    first = queue.pop(0)
    print("Зараз обслуговують", first)
    print(queue)
    last = queue.pop()
    print(last, "залишив чергу")
    print(queue)
    ```

    ```output
    Зараз обслуговують Ada
    ['Linus', 'Grace', 'Guido']
    Guido залишив чергу
    ['Linus', 'Grace']
    ```

    Без аргументу `pop()` видаляє останній елемент.

    Метод **`remove`** працює зі значеннями: він потрібний, коли ви знаєте, що видалити, але не знаєте, де це розташовано. Він шукає та видаляє задане значення. Якщо воно трапляється кілька разів, буде видалено лише перший збіг:

    ```python run
    colors = ["red", "blue", "green", "blue"]
    colors.remove("blue")
    print(colors)
    colors.remove("blue")
    print(colors)
    ```

    ```output
    ['red', 'green', 'blue']
    ['red', 'green']
    ```

    Якщо такого значення у списку немає, `remove` спричиняє помилку:

    ```python run crash
    colors = ["red", "green"]
    colors.remove("pink")
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        colors.remove("pink")
        ~~~~~~~~~~~~~^^^^^^^^
    ValueError: list.remove(x): x not in list
    ```

    ### Чи є елемент у списку?

    Оператор `in`, уже знайомий вам із рядків, працює і зі списками: вираз `value in my_list` дає `True`, якщо значення є серед елементів списку. Перед видаленням елемента, якого може не бути, перевірте це за допомогою `in`. Оператор `not in` означає протилежне:

    ```python run
    colors = ["red", "green"]
    if "pink" in colors:
        colors.remove("pink")
    else:
        print("Немає рожевого кольору для видалення")
    if "yellow" not in colors:
        colors.append("yellow")
    print(colors)
    ```

    ```output
    Немає рожевого кольору для видалення
    ['red', 'green', 'yellow']
    ```

    **Your turn:** заповніть пропуски. Програма має вилучити з черги першу людину, вивести, кого обслуговують, а потім видалити Linus, якому набридло чекати:

    ```
    Serving Ada
    ['Grace', 'Guido']
    ```
  hints:
  - "Щоб видалити елемент з індексом 0 і отримати його значення, використайте метод видалення за індексом."
  - "`pop` видаляє елемент за індексом і повертає його, а `remove` видаляє за значенням."
