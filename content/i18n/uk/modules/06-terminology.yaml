# Українська локалізація Python Arena.
# Навчальний Python-код, тести, seed, solution та службові поля залишаються в upstream.
id: terminology
summary: 'Терміни програмування: інструкції (statements), блоки (blocks), вирази (expressions) та типи даних, функції (functions),
  аргументи (arguments) й повернені значення (return values), помилки виконання (runtime errors) та налагодження (debugging).'
steps:
- id: terminology-statements-blocks
  sourceTitle: Statements and blocks
  title: Інструкції та блоки коду
  text: |
    У першій частині курсу ти вже писав програми, майже не замислюючись над назвами їхніх складових. Програмісти постійно використовують кілька важливих термінів. Знаючи їх, легше розуміти повідомлення про помилки, документацію та наступні уроки. У цьому модулі розглянемо найважливіші з них.

    ### Інструкції (statements)

    **Інструкція** (*statement*) — це завершена команда програми, яку виконує Python. У першій частині курсу ти вже використовував такі інструкції: `name = input("Your name: ")` запитує ім'я та зберігає відповідь у змінній, а `print(f"Hi, {name}!")` вітає користувача. Зазвичай Python виконує інструкції послідовно, зверху вниз. Більшість інструкцій займає один рядок.

    Інструкція може містити інші інструкції. Наприклад, `if` — одна складена інструкція: вона складається з рядка з умовою та команд, які їй підпорядковані:

    ```python run
    temperature = 28

    if temperature > 25:
        print("It's a warm day.")
        print("Remember to drink water.")

    print("See you later!")
    ```

    ```output
    It's a warm day.
    Remember to drink water.
    See you later!
    ```

    На верхньому рівні цієї програми є три інструкції: присвоювання, `if` та `print`. Усередині інструкції `if` розташовані ще дві інструкції.

    ### Блоки коду (blocks)

    Ти вже використовував **блоки** (*blocks*) разом із `if`. Блок — це послідовність інструкцій, які Python розглядає як одне ціле. У Python блок визначається **відступами**: усі його рядки починаються з однакової кількості пробілів. У прикладі вище два рядки `print` із відступами утворюють блок `if`. Якщо умова істинна, виконується весь блок; якщо хибна — весь блок пропускається. Де закінчуються відступи, там закінчується і блок. Тому останній `print` виконується завжди. Належність інструкції до блоку визначається її відступом, тож переміщення рядка на чотири пробіли може змінити поведінку програми.

    Усе, що записано без відступу, належить до **головного блоку** (*main block*) — зовнішнього рівня програми. Його рядки починаються від самого лівого краю. Навіть один зайвий пробіл перед інструкцією головного блоку спричиняє помилку:

    ```python run crash
    print("Line one")
     print("Line two")
    ```

    ```crash
      File "main.py", line 2
        print("Line two")
    IndentationError: unexpected indent
    ```

    `IndentationError` — різновид синтаксичної помилки. У такому разі Python не виконує взагалі нічого, навіть перший рядок. Те саме відбувається, коли після рядка з двокрапкою немає потрібного блоку з відступом: Python повідомляє `IndentationError: expected an indented block`.

    **Your turn:** визнач, що виведе програма. Запиши кожен рядок результату.
  hints:
  - Перша умова хибна (`3` не більше за `5`), тому Python пропускає обидва рядки її блоку `if`.
  - '`print("Level", level)` починається від лівого краю, отже, не належить до вкладеного блоку і виконується завжди.'
  - Друга умова істинна, тому її блок виконається. Останній рядок знову належить до головного блоку.
  more:
  - index: 0
    task: |
      Кожен гравець завжди має бачити, скільки в нього монет. Лише гравців із щонайменше `100` монетами потрібно запрошувати до магазину. Рядок із подякою має з'являтися для всіх. Зараз два рядки перебувають у неправильних блоках. Виправ програму, щоб за `150` монет вона виводила:

      ```
      How many coins do you have? 150
      You have 150 coins.
      You can buy the sword.
      Visit the shop!
      Thanks for playing.
      ```
    hints:
    - 'Спробуй запустити програму з `40` монетами: вона не повідомляє їхню кількість, але все одно запрошує до магазину.'
    - Рядок із кількістю монет повинен виконуватися завжди. Перемісти його перед `if`, без відступу, до головного блоку.
    - '`Visit the shop!` має належати до блоку `if`: додай перед цим рядком чотири пробіли, як у рядку вище.'
  - index: 1
    task: |
      Бібліотека нараховує штраф `2` євро за кожен день прострочення повернення книжки. Напиши програму, яка запитує кількість днів прострочення. Якщо книжку повернули із запізненням (більше ніж `0` днів), програма повинна вивести два рядки: `The book is late.` і суму штрафу. Завершуватися програма завжди повинна повідомленням `Thank you for returning the book.`

      ```
      How many days late is the book? 4
      The book is late.
      Late fee: 8 euros
      Thank you for returning the book.
      ```
    hints:
    - Зчитай кількість днів через `int(input(...))`, щоб можна було її порівнювати й використовувати в обчисленнях.
    - Два рядки про прострочення та штраф мають утворювати блок `if days > 0:` з відступом у чотири пробіли.
    - 'Штраф дорівнює `days * 2`. Його можна вставити у f-рядок: `f"Late fee: {days * 2} euros"`. Рядок із подякою має бути
      без відступу.'
- id: terminology-expressions-types
  sourceTitle: Expressions, values and types
  title: Вирази, значення й типи даних
  text: |
    **Вираз** (*expression*) — це фрагмент коду, значення якого Python може обчислити. Наприклад, `2 + 3` — вираз, його значення — `5`. Процес обчислення значення називають **обчисленням виразу** (*evaluating*). Окреме число або змінна також є виразом: значення `score` — це значення, яке змінна має саме зараз.

    Вираз можна записати всюди, де Python очікує значення: праворуч від `=`, у дужках `print`, у фігурних дужках f-рядка або в умові `if`. У цьому й різниця між виразом та інструкцією: **інструкція** (*statement*) виконує дію, а **вираз** (*expression*) має значення. `total = 5` — інструкція, тоді як `total + 5` — вираз.

    **Інтерактивний інтерпретатор** (*interactive interpreter*) добре показує цю різницю. Він виконує команди по одній, а коли після запрошення `>>>` ти вводиш вираз, одразу показує його значення:

    ```python repl
    >>> 7 + 8 * 2
    23
    >>> 9 / 4
    2.25
    >>> "rain" + "bow"
    'rainbow'
    >>> 20 - 6 < 10
    False
    ```

    Рядок `'rainbow'` показано в лапках, щоб було зрозуміло: це текст. Останній вираз — порівняння, яке має значення `False`.

    ### Обчислення крок за кроком

    Невеликі вирази можна поєднувати у складніші. Python обчислює складний вираз частинами, щоразу підставляючи результат замість обчисленого фрагмента. Нехай `price = 4`, а `count = 3`. Тоді умову `price * count + 5 > 20` можна розібрати так:

    ```
    price * count + 5 > 20
    4 * 3 + 5 > 20
    12 + 5 > 20
    17 > 20
    False
    ```

    Множення виконується перед додаванням, як у математиці, а порівняння — після арифметичних дій.

    ### Кожен вираз має тип даних (data type)

    Оскільки вираз має значення, він має і **тип даних** (*data type*). У першій частині ти знайомився з функцією `type`. Передай їй будь-який вираз — і вона повідомить тип отриманого значення:

    ```python run
    print(type(42))
    print(type(3.5 * 2))
    print(type("4" + "2"))
    print(type(42 > 7))
    ```

    ```output
    <class 'int'>
    <class 'float'>
    <class 'str'>
    <class 'bool'>
    ```

    Це чотири вже відомі тобі типи: `int` — цілі числа, `float` — числа з плаваючою крапкою, `str` — рядки, `bool` — логічні значення `True` і `False`. Порівняння є виразом типу `bool`, тому його можна використовувати як умову `if` або виводити на екран:

    ```python run
    price = 4
    count = 3
    total = price * count + 5
    print(f"Total: {total}, over 20: {total > 20}")
    ```

    ```output
    Total: 17, over 20: False
    ```

    **Your turn:** визнач, що виведе програма. Запиши кожен рядок результату.
  hints:
  - 'Множення виконується першим: `b * 3` дорівнює `6` і в першому, і в другому `print`.'
  - '`a > b * 3` — це порівняння `7 > 6`, тому його результат логічний. `str(a) + str(b)` з’єднує два рядки.'
  - Порівняння має тип `bool`, який виводиться як `<class 'bool'>`.
  more:
  - index: 0
    task: |
      Заповни кожен пропуск значенням типу, який указано в коментарі, щоб програма надрукувала:

      ```
      <class 'int'>
      <class 'float'>
      <class 'str'>
      <class 'bool'>
      ```
    hints:
    - Ціле число не має десяткової крапки (`25`), а число з плаваючою крапкою може її мати (`2.5`).
    - Текст має тип `str` і повинен бути в лапках, навіть якщо складається тільки з цифр.
    - Логічне значення записують як `True` або `False` — із великої літери та без лапок. Підійде також порівняння, наприклад
      `3 > 1`.
  - index: 1
    task: |
      Напиши програму, яка запитує два цілі числа й виводить результати трьох порівнянь між ними. Кожне порівняння розмісти у фігурних дужках f-рядка, щоб Python сам вивів його значення.

      ```
      First number: 5
      Second number: 8
      Is the first smaller? True
      Are they equal? False
      Is their sum over 10? True
      ```
    hints:
    - Порівняння — це вираз зі значенням `True` або `False`, тому його можна записати у фігурних дужках f-рядка, як і будь-який
      інший вираз.
    - 'Три потрібні порівняння: `first < second`, `first == second` та `first + second > 10`.'
    - 'Наприклад: `print(f"Are they equal? {first == second}")`.'
- id: terminology-functions
  sourceTitle: Functions, arguments and return values
  title: Функції, аргументи та повернені значення
  text: |
    **Функція** (*function*) — це частина програми з певною назвою, яка виконує визначену дію. Ти вже користувався функціями `print`, `input`, `int`, `float`, `str` і `type`. Використання функції називають її **викликом** (*function call*): після назви записують круглі дужки.

    Значення, передані в дужках, називають **аргументами** (*arguments*) — це дані, з якими працює функція. У `print("Score:", score)` два аргументи: рядок `"Score:"` і значення змінної `score`. Деякі функції викликають без аргументів (`print()` виводить порожній рядок), інші приймають декілька аргументів, розділених комами. У розмові програмісти іноді називають аргумент **параметром** (*parameter*). Точніше, параметр — це ім'я всередині визначення функції, яке отримує переданий аргумент. Різницю ти побачиш пізніше, коли навчишся створювати власні функції.

    ### Повернені значення (return values)

    Багато функцій після виклику **повертають значення** (*return value*). Коли виклик завершується, Python підставляє це значення на місце виклику, тому виклик функції теж може бути виразом. Наприклад, `input` повертає введений користувачем рядок — саме тому його результат зазвичай зберігають у змінній.

    Це добре видно на прикладі нової функції `len`: вона повертає довжину рядка — кількість його символів, включно з пробілами та розділовими знаками.

    ```python run
    sentence = input("Type a sentence: ")
    print(f"That's {len(sentence)} characters.")
    ```

    ```input
    I like tea.
    ```

    ```output
    Type a sentence: I like tea.
    That's 11 characters.
    ```

    Літери становлять 8 з 11 символів; ще три — це два пробіли й крапка. Якщо користувач просто натисне Enter, `input` поверне **порожній рядок** (*empty string*) `""`, у якому немає жодного символу, тому його довжина дорівнює нулю. Оскільки `len(...)` повертає число типу `int`, його можна зберігати, використовувати в обчисленнях та порівняннях, як і будь-яке інше число:

    ```python run
    name = input("Choose a username: ")
    length = len(name)
    if length < 5:
        print(f"{name} has only {length} characters. Use at least 5.")
    ```

    ```input
    ada
    ```

    ```output
    Choose a username: ada
    ada has only 3 characters. Use at least 5.
    ```

    ### Виклики функцій усередині інших викликів

    Оскільки виклик функції є виразом, він може слугувати аргументом іншого виклику. Ти вже робив так у першій частині: у `int(input("Age: "))` Python спочатку викликає `input`, а отриманий рядок передає функції `int`. Функції перетворення `int`, `float` і `str` працюють так само, як інші: отримують аргумент і повертають значення іншого типу.

    Не кожен аргумент підходить будь-якій функції. `len` рахує символи рядка, але у числа немає символів, які можна порахувати:

    ```python run crash
    year = 2026
    print(len(year))
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        print(len(year))
              ~~~^^^^^^
    TypeError: object of type 'int' has no len()
    ```

    Повідомлення означає, що для значення типу `int` не можна визначити довжину через `len`. Спочатку перетвори число на рядок, а потім порахуй символи: `len(str(year))` дасть `4`, бо `str(year)` поверне рядок `"2026"`.

    **Your turn:** заповни пропуск викликом функції, щоб програма вивела кількість символів у слові:

    ```
    Type a word: keyboard
    The word keyboard has 8 characters.
    ```
  hints:
  - Функція, що повертає кількість символів рядка, називається `len`.
  - 'Виклич її, передавши змінну як аргумент: `len(word)`.'
  more:
  - index: 0
    task: |
      Початковий код зчитує ціле число через `int`. Додай рядок, який виводить кількість цифр у числі. Якщо передати число безпосередньо у `len`, виникне помилка, тому спочатку потрібно перетворити його на рядок.

      ```
      Type a whole number: 2026
      The number 2026 has 4 digits.
      ```
    hints:
    - '`len` рахує символи рядка, тому спочатку перетвори число на рядок через `str(number)`.'
    - 'Вклади один виклик в інший: `len(str(number))`. Спершу Python викличе `str`, а отриманий рядок передасть у `len`.'
    - Весь вираз можна записати всередині фігурних дужок f-рядка.
  - index: 1
    task: |
      Повідомлення про статус може містити не більше `30` символів. Напиши програму, яка запитує текст статусу, виводить кількість символів, а якщо їх більше ніж `30`, додатково повідомляє, на скільки символів перевищено обмеження.

      ```
      Status: Learning Python one step at a time
      34 characters
      Too long by 4 characters.
      ```
    hints:
    - '`len(status)` повертає кількість символів. Збережи результат у змінній, адже він знадобиться двічі.'
    - Виведи перший рядок через f-рядок, а для другого використай `if length > 30:`.
    - Кількість зайвих символів — це довжина рядка мінус `30`.
- id: terminology-errors-debugging
  sourceTitle: Errors and debugging
  title: Помилки та налагодження
  text: |
    **Синтаксис** (*syntax*) мови програмування — це правила запису коду: після умови `if` ставлять двокрапку, команди блоку записують з відступом, а рядок беруть у лапки. Якщо порушити правило, Python не зможе прочитати програму й нічого не виконає. Він повідомить про **синтаксичну помилку** (*syntax error*):

    ```python run crash
    speed = 50
    if speed > 40
        print("Slow down!")
    ```

    ```crash
      File "main.py", line 2
        if speed > 40
                     ^
    SyntaxError: expected ':'
    ```

    Навіть за правильного синтаксису програма може завершитися з помилкою під час роботи. Це **помилка виконання** (*runtime error*). Python зупиняється на команді, яку не може виконати, але попередні команди вже встигли відпрацювати:

    ```python run crash
    pizzas = 3
    people = 0
    print("Sharing the pizzas...")
    share = pizzas / people
    print(share)
    ```

    ```output
    Sharing the pizzas...
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 4, in <module>
        share = pizzas / people
                ~~~~~~~^~~~~~~~
    ZeroDivisionError: division by zero
    ```

    `NameError`, `TypeError` і `ValueError` теж належать до помилок виконання. Повідомлення про перебіг помилки (*traceback*) вказує рядок, на якому програма зупинилася, а останній рядок пояснює проблему. Водночас справжня причина може бути в іншому місці: тут усе почалося з того, що `people` дорівнює `0`.

    ### Помилки в логіці програми та налагодження (bugs and debugging)

    Найпідступніші помилки не спричиняють жодного повідомлення: програма запускається, але дає неправильний результат. Таку помилку називають **багом** (*bug*), а процес пошуку та виправлення — **налагодженням** (*debugging*). У цій грі за кожну повну тисячу балів гравець отримує додаткове життя, а за три або більше додаткових життів — медаль. Гравець із `3000` балами мав би отримати медаль, але цього не стається:

    ```python run
    points = 3000
    lives = points % 1000
    if lives > 3:
        print("Medal earned!")
    print("Game over.")
    ```

    ```output
    Game over.
    ```

    Простий і дієвий спосіб налагодження — додати **діагностичні виведення** (*debugging prints*): додаткові команди `print`, які показують поточні значення змінних та умов. У прикладі ми не бачимо, скільки життів обчислила програма та чому вирішила не видавати медаль. Виведемо обидва значення з підписами:

    ```python run
    points = 3000
    lives = points % 1000
    print("lives:", lives)
    print("medal condition:", lives > 3)
    if lives > 3:
        print("Medal earned!")
    print("Game over.")
    ```

    ```output
    lives: 0
    medal condition: False
    Game over.
    ```

    Тепер можна порівняти результати з очікуваннями. `3000` балів — це три повні тисячі, але `lives` дорівнює `0`. Отже, помилка в обчисленні: оператор `%` повертає остачу від ділення, а не кількість повних тисяч. Тут потрібен `points // 1000`. Після виправлення `lives` дорівнюватиме `3`, але умова для медалі все одно покаже `False`. Значення вже правильне, отже, помилка в умові: «три або більше» записують як `lives >= 3`, а `lives > 3` не враховує рівно три життя.

    Зверни увагу, що `3000` — вдале тестове значення. Помилки на кшталт `>` замість `>=` проявляються саме на межі, тому потрібно перевіряти й **граничні значення**, а не тільки звичайні. Коли баг виправлено, прибери діагностичні `print`, інакше система перевірки на сайті побачить зайві рядки у виводі.

    **Your turn:** у цій програмі є чотири синтаксичні помилки. Виправляй їх по черзі (Python зазвичай повідомляє про одну з них за раз), щоб програма працювала так:

    ```
    How many tickets? 6
    Group discount!
    Total: 50 euros
    ```
