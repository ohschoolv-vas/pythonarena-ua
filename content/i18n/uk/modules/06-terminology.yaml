    Виправ її та перевір програму ще раз.
  - 'Перше повідомлення стосується останнього рядка: його текст не має закривальних лапок. У першому рядку відкрито дві дужки
    — `int(` і `input(`, — але закрито лише одну.'
  - Рядок `if` має закінчуватися двокрапкою, а обидва рядки його блоку повинні мати однаковий відступ у чотири пробіли.
