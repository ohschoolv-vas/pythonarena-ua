    - 'У перших трьох викликах заміни перехід на новий рядок пробілом: `print("3...", end=" ")`.'
    - Останній виклик `print` має завершувати рядок як звичайно, тому його не змінюй.
- id: variables-f-strings
  sourceTitle: F-strings
  title: Форматовані рядки (f-strings)
  text: |
    З’єднувати текст оператором `+` і функцією `str` можна, але довгі вирази стають незручними. До того ж коми у `print` додають пробіли, які не завжди потрібні. **Форматований рядок** (*f-string*) дозволяє відразу записати текст так, як він має виглядати, і позначити місця для значень. Для цього перед початковими лапками ставлять літеру `f`, а назву змінної всередині рядка беруть у фігурні дужки `{ }`. Python підставляє значення змінної замість цього виразу:

    ```python run
    item = "pencils"
    count = 12
    print(f"You ordered {count} {item}.")
    ```

    ```output
    You ordered 12 pencils.
    ```

    Літера `f` походить від слова *formatted* («форматований»). Значення можуть мати різні типи, тому окремий виклик `str` не потрібний. Усе за межами фігурних дужок виводиться точно так, як записано, — з потрібними пробілами та розділовими знаками.

    ### Кілька значень і обчислення

    У форматованому рядку можна використати скільки завгодно пар фігурних дужок. Усередині них може бути не лише змінна, а й обчислення:

    ```python run
    name = "Ada"
    price = 3
    count = 12
    print(f"{name} buys {count} pencils at {price} each.")
    print(f"That's {count * price} in all.")
    ```

    ```output
    Ada buys 12 pencils at 3 each.
    That's 36 in all.
    ```

    ### Порівняння з виводом через коми

    Ось початковий приклад, але з комами замість f-string. Автоматичні пробіли додають небажаний пробіл перед крапкою:

    ```python run
    item = "pencils"
    count = 12
    print("You ordered", count, item, ".")
    ```

    ```output
    You ordered 12 pencils .
    ```

    Щоб позбутися цього пробілу, довелося б поєднувати обидва способи: `print("You ordered", count, item + ".")`. Це працює, але потрібно окремо продумувати кожен пробіл. Натомість f-string описує весь результат одним рядком у потрібному форматі.

    Коми зручні, коли треба швидко переглянути значення. А коли важлива точність оформлення виводу, форматований рядок зазвичай простіший.

    ### Якщо забути літеру `f`

    Без початкової літери `f` Python сприймає текст як звичайний рядок і виводить фігурні дужки буквально:

    ```python run
    city = "Oslo"
    print("Welcome to {city}!")
    print(f"Welcome to {city}!")
    ```

    ```output
    Welcome to {city}!
    Welcome to Oslo!
    ```

    При цьому помилки не буде: Python не знає, що ти хотів використати f-string. Якщо у виводі видно фігурні дужки замість значень, перевір наявність літери `f` перед лапками.

    Форматований рядок — це звичайне рядкове значення, тому його також можна зберегти у змінній: `label = f"{count} {item}"`.

    **Your turn:** заповни пропуск, щоб програма привітала користувача. Якщо користувач введе `Ada`, результат буде таким:

    ```
    Name: Ada
    Hello, Ada!
    ```
  hints:
  - Якщо не додати нічого в пропуск, програма буквально виведе `{name}`.
  - Літера `f` безпосередньо перед відкривальними лапками перетворює текст на форматований рядок.
