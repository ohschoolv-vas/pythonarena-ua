    - Символи `x` і `=` — звичайний текст за межами фігурних дужок.
- id: variables-floats
  sourceTitle: Floating point numbers
  title: Числа з плаваючою крапкою
  text: |
    Цілих чисел недостатньо, щоб записувати ціни, вимірювання та середні значення. Число з десятковою крапкою, наприклад `2.5`, `-0.75` або `3.0`, називають **числом із плаваючою крапкою** (*floating point number*), скорочено **float**. У Python відповідний тип має назву `float`.

    Значення типу `float` можна використовувати в обчисленнях так само, як і цілі числа. Наприклад, ця програма обчислює площу килима та довжину його периметра в метрах:

    ```python run
    length = 2.5
    width = 1.25
    print(f"Area: {length * width} square meters")
    print(f"Edge all around: {2 * (length + width)} meters")
    ```

    ```output
    Area: 3.125 square meters
    Edge all around: 7.5 meters
    ```

    Дужки тут важливі. Множення виконується раніше за додавання, тому без дужок Python спочатку обчислив би `2 * length`, а потім додав би `width` лише один раз замість двох.

    ### Ділення повертає `float`

    Оператор `/` завжди повертає значення типу `float`, навіть якщо числа діляться без остачі:

    ```python repl
    >>> 7 / 2
    3.5
    >>> 6 / 3
    2.0
    >>> 1.5 + 1.5
    3.0
    ```

    За значенням `2.0` дорівнює `2`, але це число типу `float`, тому Python показує десяткову крапку. У наступному модулі ми докладніше розглянемо типи результатів обчислень.

    ### Крапка, а не кома

    У Python десяткові дроби записують **через крапку**. Кома розділяє значення, тому `print(2,5)` виведе два числа, а не число два з половиною:

    ```python run
    print(2.5)
    print(2,5)
    ```

    ```output
    2.5
    2 5
    ```

    ### Дробові числа не завжди зберігаються точно

    Комп’ютер зберігає числа типу `float` у двійковому вигляді з обмеженою кількістю розрядів. Через це більшість десяткових дробів подані наближеними значеннями. Зазвичай цього не помітно, але іноді різниця з’являється в останніх цифрах:

    ```python repl
    >>> 0.1 + 0.2
    0.30000000000000004
    ```

    Це не помилка твоєї програми — подібна особливість є майже в усіх мовах програмування. В одному з наступних модулів ми навчимося округлювати числа під час виведення.

    **Your turn:** заповни пропуск, щоб програма обчислила та вивела середнє арифметичне двох оцінок:

    ```
    Average: 8.25
    ```
  hints:
  - Середнє арифметичне двох чисел дорівнює їхній сумі, поділеній на кількість чисел.
  - Є дві оцінки, отже суму потрібно поділити на `2`.
