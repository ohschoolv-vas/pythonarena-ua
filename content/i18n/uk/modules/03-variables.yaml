# Український переклад пояснень і завдань Python Arena.
# Оригінальні Python-код, еталонні результати, тести та правила перевірки не змінюються.
id: variables
summary: 'Поглиблене вивчення змінних (variables): зміна значень, цілі числа (int) і рядки (str), виведення
  чисел разом із текстом, форматовані рядки (f-strings) та числа з плаваючою крапкою (float).'
steps:
- id: variables-changing
  sourceTitle: Changing a value
  title: Зміна значення змінної
  text: |
    Змінна (**variable**) створюється, коли ми вперше зберігаємо в ній значення за допомогою `name = value`. У попередньому модулі більшість значень надходили через `input`. Але значення можна записати безпосередньо в коді або створити нове на основі інших змінних:

    ```python run
    greeting = "Good morning"
    city = "Lisbon"
    message = greeting + ", " + city + "!"
    print(message)
    ```

    ```output
    Good morning, Lisbon!
    ```

    Цього разу програма не отримує даних від користувача. Тому під час кожного запуску вона вітає Лісабон, доки хтось не змінить код. Значення, заздалегідь записані в програмі, називають **жорстко заданими** (*hard-coded*).

    ### Значення змінної може змінюватися

    Як підказує сама назва, змінна може набувати різних значень. Кожне присвоювання (`assignment`) замінює попереднє значення. У змінній завжди зберігається останнє присвоєне значення:

    ```python run
    status = "waiting"
    print(status)
    status = "running"
    print(status)
    status = "done"
    print(status)
    ```

    ```output
    waiting
    running
    done
    ```

    ### Нове значення на основі попереднього

    Нове значення можна обчислити, використавши поточне значення тієї самої змінної:

    ```python run
    title = input("Title: ")
    title = "* " + title + " *"
    print(title)
    title = title + " (draft)"
    print(title)
    ```

    ```input
    Summer plans
    ```

    ```output
    Title: Summer plans
    * Summer plans *
    * Summer plans * (draft)
    ```

    Запис `title = "* " + title + " *"` виглядав би дивно в математиці. Але в Python знак `=` означає **присвоювання**, а не твердження про рівність. Спочатку Python обчислює праву частину, використовуючи поточне значення `title`: `"* " + "Summer plans" + " *"`. Лише після цього результат записується назад у `title`.

    ### Кожен рядок використовує значення на момент виконання

    Python виконує команди послідовно. Кожен рядок працює з тими значеннями змінних, які існують **саме в цей момент**. Якщо пізніше змінити змінну, уже створені на її основі значення не зміняться:

    ```python run
    pet = "cat"
    sentence = "My " + pet + " is asleep."
    pet = "dog"
    print(sentence)
    print(pet)
    ```

    ```output
    My cat is asleep.
    dog
    ```

    Змінну `sentence` сформовано тоді, коли `pet` ще містила `"cat"`. Після цього `sentence` стала готовим рядком: вона не зберігає зв’язку зі змінними, з яких утворилася.

    **Your turn:** заповни пропуск так, щоб програма додавала почесне означення до введеного імені. Якщо користувач введе `Ada`, результат буде таким:

    ```
    Name: Ada
    Ada the Great
    ```
  hints:
  - Нове значення утворюється зі старого значення тієї самої змінної, до якого додається текст наприкінці.
  - 'Впиши у пропуск назву змінної: `name = name + " the Great"`.'
  more:
  - index: 0
    task: |
      Який результат виведе ця програма? Запиши всі рядки в порядку появи.
    hints:
    - Значення `meal` формується у другому рядку, коли `food` ще дорівнює `"rice"`.
    - Зміна `food` у третьому рядку не змінює `meal`, адже цей рядок уже створено.
  - index: 1
    task: |
      Напиши програму, яка запитує ім’я користувача та послідовно додає до нього титули. Використовуй лише одну змінну `name`: спочатку виведи її, потім додай на початку `Dr. ` і виведи ще раз, а насамкінець додай ` PhD` і виведи втретє. Якщо користувач введе `Ada`, результат має бути таким:

      ```
      Name: Ada
      Ada
      Dr. Ada
      Dr. Ada PhD
      ```
    hints:
    - 'Послідовність така: вивести, змінити, вивести, змінити, вивести. У програмі мають бути три виклики `print(name)`,
      а між ними — присвоювання.'
    - 'Щоб додати текст на початку, постав його перед старим значенням: `name = "Dr. " + name`.'
    - 'Щоб додати текст у кінці, постав його після старого значення: `name = name + " PhD"`.'
- id: variables-integers
  sourceTitle: Numbers and strings
  title: Числа та рядки
  text: |
    Змінні можуть зберігати не лише рядки, а й числа. Ціле число, наприклад `7`, `-40` або `1000000`, називають **цілим числом** (*integer*). У Python цілі числа записують без лапок:

    ```python run
    year = 2026
    print(year)
    print(year + 1)
    ```

    ```output
    2026
    2027
    ```

    ### `"25"` — це не те саме, що `25`

    У лапках `"25"` — це текстовий рядок із двох символів-цифр. Номер шафки та код дверей можуть виглядати однаково на екрані, проте Python обробляє їх по-різному:

    ```python run
    lockers = 25
    door_code = "25"
    print(lockers)
    print(door_code)
    print(lockers + lockers)
    print(door_code + door_code)
    ```

    ```output
    25
    25
    50
    2525
    ```

    Для чисел оператор `+` виконує додавання. Для рядків він з’єднує їх. Результат операції залежить від **типу даних** (*type*): це можуть бути цілі числа, рядки тощо. У Python тип цілих чисел називається `int`, а тип рядків — `str`.

    ### Робота в інтерактивному інтерпретаторі

    Python також має **інтерактивний інтерпретатор**. Після запрошення `>>>` можна вводити команди по одній, і Python відразу показуватиме результат. Рядкові значення він відображає з лапками, тому легко відрізнити рядок `'34'` від числа `34`:

    ```python repl
    >>> 3 + 4
    7
    >>> "3" + "4"
    '34'
    ```

    ### Не всі операції можливі для кожного типу

    Віднімати число від рядка немає сенсу, і Python повідомляє про помилку:

    ```python run crash
    width = "12"
    print(width - 2)
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        print(width - 2)
              ~~~~~~^~~
    TypeError: unsupported operand type(s) for -: 'str' and 'int'
    ```

    Помилка `TypeError` означає, що для операції використано значення несумісного типу. Останній рядок повідомлення пояснює: оператор `-` не працює зі значеннями типів `str` і `int`. Значення, над якими виконується операція, називаються **операндами**. Позначки `~` і `^` вказують на вираз, де виникла помилка. Тут потрібно прибрати лапки, щоб у `width` зберігалося число.

    Пам’ятай: `input` **завжди повертає рядок**, навіть якщо користувач вводить цифри. У наступному модулі навчимося перетворювати такий рядок на число.

    **Your turn:** визнач, що виведе наведена програма. Запиши кожен рядок результату у правильному порядку.
  hints:
  - У `x` зберігається ціле число `7`, а у `y` — рядок, тому що значення взято в лапки.
  - 'Оператор `+` додає цілі числа, але з’єднує рядки: `"7" + "7"` дає рядок `"77"`.'
