- id: variables-combining
  sourceTitle: Combining values when printing
  title: Поєднання значень під час виведення
  text: |
    Часто програма має вивести в одному рядку текст і число. Здається логічним з’єднати їх оператором `+`, але так не вийде:

    ```python run crash
    score = 7 * 6
    print("Your score: " + score)
    ```

    ```crash
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        print("Your score: " + score)
              ~~~~~~~~~~~~~~~^~~~~~~
    TypeError: can only concatenate str (not "int") to str
    ```

    **Конкатенація** (*concatenation*) — це з’єднання рядків. Оператор `+` може поєднати рядок з іншим рядком, але не ціле число з рядком. Python не здогадується, чи ти хочеш додати числа або з’єднати текст, тому зупиняє програму з помилкою.

    ### Перетворюємо число на рядок за допомогою `str`

    Функція `str` перетворює значення на рядок: результат `str(42)` — це рядок `"42"`. Команди на кшталт `str` і `print`, які отримують значення в дужках і виконують із ним певну дію, називають **функціями**. А рядок із рядком можна з’єднати без проблем:

    ```python run
    score = 7 * 6
    print("Your score: " + str(score))
    ```

    ```output
    Your score: 42
    ```

    ### Використання ком у `print`

    Ще один спосіб ми вже бачили: передавати значення до `print` через коми. Функція приймає значення різних типів і автоматично вставляє між ними пробіли:

    ```python run
    score = 7 * 6
    level = 3
    print("Your score:", score)
    print("Level", level, "of", 10)
    ```

    ```output
    Your score: 42
    Level 3 of 10
    ```

    Автоматичні пробіли зручні не завжди. Якщо потрібно точно контролювати формат виводу, можна з’єднати частини рядка через `+` та `str`:

    ```python run
    number = 42
    print("Order #", number)
    print("Order #" + str(number))
    ```

    ```output
    Order # 42
    Order #42
    ```

    ### Продовження виводу в тому самому рядку: `end`

    Зазвичай кожен виклик `print` завершує рядок, а наступний починає новий. Це можна змінити. Параметр `end=""` означає, що наприкінці нічого не додається замість переходу на новий рядок. Тому наступний виклик `print` продовжить той самий рядок:

    ```python run
    print("Loading", end="")
    print("...", end="")
    print(" done")
    ```

    ```output
    Loading... done
    ```

    Значення параметра `end` виводиться замість символу переходу на новий рядок. Наприклад, з `end=" "` після поточного тексту буде пробіл, а наступний `print` продовжить вивід у цьому самому рядку.

    **Your turn:** заповни пропуск, щоб програма вивела наведений рядок. Змінна `points` містить ціле число, яке не можна безпосередньо з’єднати з текстовим рядком.

    ```
    Points: 60
    ```
  hints:
  - Оператор `+` з’єднує рядок лише з іншим рядком. Яка функція перетворює число на рядок?
  - Вираз `str(points)` повертає рядок `"60"`.
  more:
