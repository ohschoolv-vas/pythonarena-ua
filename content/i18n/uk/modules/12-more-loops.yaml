# Українська локалізація Python Arena.
# Навчальні тексти, заголовки, завдання та підказки.
# Оригінальний Python-код, приклади, тести та перевірки не змінюються.
id: more-loops
summary: 'Додаткові можливості циклів (*loops*): дострокове завершення циклу через `break`, пропуск решти ітерації
  через `continue`, вкладені цикли (*nested loops*) та допоміжні змінні для керування ними.'
steps:
- id: more-loops-break
  sourceTitle: Ending a loop with break
  title: Завершення циклу за допомогою `break`
  text: |
    Ти використовував `break` ще від перших циклів: ця команда негайно завершує цикл, і програма переходить до першого рядка після нього. Тепер, коли цикл може мати умову, багато циклів можна написати двома способами. Обидві наведені програми підраховують введені імена гостей, доки користувач не введе `done`:

    ```python run
    guests = 0
    while True:
        name = input("Guest: ")
        if name == "done":
            break
        guests += 1
    print(f"{guests} guests")
    ```

    ```input
    Ada
    Linus
    done
    ```

    ```output
    Guest: Ada
    Guest: Linus
    Guest: done
    2 guests
    ```

    ```python fragment
    guests = 0
    name = ""
    while name != "done":
        name = input("Guest: ")
        if name != "done":
            guests += 1
    print(f"{guests} guests")
    ```

    За однакових вхідних даних результат буде однаковим. Однак у другій програмі потрібно задати початкове значення `name` лише для того, щоб цикл міг початися. Крім того, слово `done` перевіряється двічі: у самій умові циклу та в його тілі, щоб не зарахувати його як ім’я гостя. Із `break` перевірка потрібна лише в одному місці — відразу після введення. Саме тому цикл, який приймає дані до появи спеціального слова завершення, зазвичай записують через `while True` і `break`.

    ### Умова циклу та `break` разом

    Цикл може мати і звичайну умову завершення, і `break` для дострокового виходу. На цьому благодійному розпродажі печива продаж триває, доки не буде продано 50 штук. Але продавець може ввести 0, щоб завершити роботу раніше:

    ```python run
    sold = 0
    while sold < 50:
        cookies = int(input("Cookies sold (0 to close): "))
        if cookies == 0:
            break
        sold += cookies
    print(f"{sold} cookies sold")
    ```

    ```input
    12
    20
    0
    ```

    ```output
    Cookies sold (0 to close): 12
    Cookies sold (0 to close): 20
    Cookies sold (0 to close): 0
    32 cookies sold
    ```

    У прикладі продавець завершив роботу достроково. Якби він увів 30 і 25, цикл завершився б через свою умову: після другої ітерації `sold` дорівнював би 55, умова `55 < 50` стала б хибною, а програма вивела б `55 cookies sold`, не ставлячи нових запитань.

    В обох випадках виконання продовжиться після циклу. Якщо потрібно визначити, чому цикл завершився, це можна перевірити згодом, наприклад умовою `if sold >= 50:`.

    **Your turn:** заповни пропуск так, щоб цикл завершувався, коли користувач вводить `stop`.

    ```
    Word: hello
    hello!
    Word: stop
    Stopped
    ```
  hints:
  - Коли введено слово `stop`, цикл має негайно завершитися, ще до виведення цього слова.
  - Команда завершення циклу складається з одного слова. Ти вже використовував її в перших уроках про цикли.
  more:
  - index: 0
    task: |
      Напиши гру «Вгадай число». Загадане число — 7 (запиши його в програмі). Гравець має не більше ніж 4 спроби, для кожної з яких програма виводить запрошення `Guess: `. Якщо число вгадано, програма виводить `Correct!` і більше не запитує. Якщо всі чотири спроби невдалі, виводиться `Out of guesses`. Використай цикл, умова якого обмежує кількість спроб, і команду `break` для виходу після правильної відповіді.

      ```
      Guess: 3
      Guess: 9
      Guess: 7
      Correct!
      ```
    hints:
    - Підраховуй спроби за допомогою допоміжної змінної, початкове значення якої — 0. Цикл виконується, поки спроб
      менше ніж 4.
    - У тілі циклу зчитай спробу й збільш лічильник на 1. Якщо введене число дорівнює `secret`, виведи `Correct!`
      і виконай `break`.
    - 'Після циклу остання спроба підкаже, чому він завершився: якщо вона не дорівнює загаданому числу, усі чотири
      спроби були невдалими.'
  - index: 1
    task: |
      Визнач, що виведе ця програма. Запиши кожен рядок результату.
    hints:
    - 'Простеж виконання по ітераціях: після першої ітерації `n` дорівнює 3. Чи дорівнює це 6?'
    - На другій ітерації `n` стає рівним 6, і `break` завершує цикл до виконання `print` у його тілі.
    - Після завершення циклу змінна `n` зберігає значення, яке мала під час виходу.
- id: more-loops-continue
  sourceTitle: Skipping a round with continue
  title: Пропуск ітерації за допомогою `continue`
  text: |
    `break` завершує весь цикл. `continue` завершує лише поточну ітерацію: решта команд тіла пропускається, а Python повертається до початку циклу, перевіряє його умову та, якщо вона істинна, починає наступну ітерацію.

    Ця програма підсумовує ціни, але пропускає значення понад 100, вважаючи їх помилками введення:

    ```python run
    total = 0
    while True:
        price = int(input("Price (0 to stop): "))
        if price == 0:
            break
        if price > 100:
            print("Skipped, too big")
            continue
        total += price
    print(f"Total: {total}")
    ```

    ```input
    20
    500
    15
    0
    ```

    ```output
    Price (0 to stop): 20
    Price (0 to stop): 500
    Skipped, too big
    Price (0 to stop): 15
    Price (0 to stop): 0
    Total: 35
    ```

    Для ціни 500 команда `continue` пропускає `total += price`, а на наступній ітерації програма запитує нову ціну.

    Усе, що робить `continue`, можна реалізувати й через `if`: наприклад, розмістити `total += price` у гілці `else`. Однак, коли ітерацію потрібно пропускати з кількох причин, окремі перевірки з `continue` на початку тіла роблять код зрозумілішим і дозволяють уникнути багаторівневих вкладених `if`.

    ### `continue` та оновлення лічильника

    У циклах із лічильником `continue` може приховувати небезпеку. Цей цикл виводить числа від 1 до 10, пропускаючи кратні 3:

    ```python run
    number = 0
    while number < 10:
        number += 1
        if number % 3 == 0:
            continue
        print(number)
    ```

    ```output
    1
    2
    4
    5
    7
    8
    10
    ```

    Оновлення `number += 1` стоїть на початку тіла, перед командою `continue`. Подивись, що станеться, якщо перенести оновлення в кінець, як це зазвичай роблять:

    ```python fragment
    number = 1
    while number <= 10:
        if number % 3 == 0:
            continue
        print(number)
        number += 1
    ```

    Спочатку програма виводить 1 і 2. Коли `number` дорівнює 3, команда `continue` повертає виконання на початок циклу ще до оновлення лічильника. Значення `number` залишається 3, кожна наступна ітерація так само пропускається, і цикл ніколи не завершиться. Тому, використовуючи `continue`, переконайся, що лічильник змінюється на кожному можливому шляху виконання тіла циклу.

    **Your turn:** заповни пропуск так, щоб порожні рядки пропускалися й не враховувалися під час підрахунку імен.

    ```
    Name: Ada
    Name:
    Name: Linus
    Name: end
    2 names
    ```
  hints:
  - Якщо введено порожній рядок, решту поточної ітерації (зокрема підрахунок) потрібно пропустити й перейти до наступного
    імені.
  - Команда, яка переводить цикл до наступної ітерації, — `continue`.
  more:
  - index: 0
    task: |
      Напиши програму, яка зчитує рядки із запрошенням `> `, доки користувач не введе `quit`. Рядок, що починається символом `#`, вважається коментарем: його потрібно пропустити. Кожен інший рядок виводь повторно, додавши перед ним `You said: `. Можна вважати, що порожніх рядків не буде.

      ```
      > hello
      You said: hello
      > # just a note
      > bye
      You said: bye
      > quit
      ```
    hints:
    - Зчитуй рядки в циклі `while True` і виконуй `break`, коли введено `quit`.
    - Перший символ рядка — це `line[0]`. Якщо він дорівнює `"#"`, використай `continue`, щоб пропустити решту ітерації.
    - Команду `print` розташуй наприкінці тіла циклу, щоб вона виконувалася лише для рядків, які не були пропущені.
  - index: 1
    task: |
      Програма має вивести числа від 1 до 10, крім кратних 4, але натомість зациклюється. Виправ помилку, зберігши команду `continue`.

      ```
      1
      2
      3
      5
      6
      7
      9
      10
      ```
    hints:
    - Що відбувається, коли `number` дорівнює 4? Простеж команди по черзі й зверни увагу, що саме пропускає `continue`.
    - '`continue` пропускає оновлення лічильника, тому `number` назавжди залишається рівним 4. Оновлення має відбутися
      до `continue`.'
    - Перемісти `number += 1` на початок тіла циклу. Тоді початкове значення `number` має бути 0, а умова — `number
      < 10`, щоб число 10 теж було виведено.
- id: more-loops-nested
  sourceTitle: Loops inside loops
  title: Цикли всередині циклів
  text: |
    Тіло циклу може містити будь-які інструкції, зокрема інший цикл. Цикл усередині іншого називають **вкладеним циклом** (*nested loop*). Внутрішній цикл виконує всі свої ітерації під час кожної окремої ітерації зовнішнього циклу.

    Ця програма запитує розмір, доки користувач не введе 0. Для кожного розміру внутрішній цикл створює рядок із відповідної кількості блоків, додаючи по одному блоку за ітерацію:

    ```python run
    while True:
        size = int(input("Size: "))
        if size == 0:
            break
        row = ""
        while size > 0:
            row += "[]"
            size -= 1
        print(row)
    ```

    ```input
    3
    1
    0
    ```

    ```output
    Size: 3
    [][][]
    Size: 1
    []
    Size: 0
    ```

    (Вираз `"[]" * size` створив би такий самий рядок. Тут внутрішній цикл використано, щоб показати, як цикли працюють один усередині одного.)

    Читай програму від зовнішнього циклу до внутрішнього. Зовнішній цикл запитує розмір. Внутрішній цикл, розташований на додатковому рівні відступу, створює рядок. Після завершення внутрішнього циклу решта тіла зовнішнього виводить цей рядок, а потім зовнішній цикл починає наступну ітерацію.

    ### Скільки разів виконується код?

    Два лічильники допомагають побачити, скільки разів виконується кожна частина:

    ```python run
    outer = 1
    while outer <= 3:
        inner = 1
        while inner <= 2:
            print(f"outer {outer}, inner {inner}")
            inner += 1
        outer += 1
    ```

    ```output
    outer 1, inner 1
    outer 1, inner 2
    outer 2, inner 1
    outer 2, inner 2
    outer 3, inner 1
    outer 3, inner 2
    ```

    На кожній із трьох ітерацій зовнішнього циклу внутрішній виконується повністю — по дві ітерації. Отже, усього програма виводить шість рядків. Зверни увагу на розташування `inner = 1`: цей рядок стоїть усередині зовнішнього циклу, тому лічильник внутрішнього циклу щоразу знову починає з 1. Наступний урок детальніше пояснює цей момент.

    ### `break` і `continue` у вкладених циклах

    Команди `break` та `continue` діють на той цикл, усередині якого вони розміщені, тобто на найближчий цикл. У першому прикладі `break` належить зовнішньому циклу, тому завершує всю конструкцію. Якби `break` був у внутрішньому циклі, він завершив би лише внутрішній: зовнішній продовжив би виконання решти свого тіла, а потім наступної ітерації. Так само `continue` у внутрішньому циклі переходить до наступної ітерації саме внутрішнього циклу.

    **Your turn:** визнач, що виведе ця програма. Запиши кожен рядок результату.
  hints:
  - '`break` стоїть у внутрішньому циклі, тому завершує лише його. Зовнішній цикл переходить до наступного значення
    `number`.'
  - 'Коли `number` дорівнює 1, внутрішній цикл одразу завершується: `other` теж дорівнює 1. На цій ітерації нічого
    не виводиться.'
  - Коли `number` дорівнює 2, спочатку `other` дорівнює 1 (значення виводяться), а потім 2 (спрацьовує `break`).
  more:
