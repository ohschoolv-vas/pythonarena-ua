name: Sync upstream via PR

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout existing branch
        uses: actions/checkout@v4
        with:
          ref: upstream-sync
          fetch-depth: 0

      - name: Merge upstream changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream \
            https://github.com/AntonyPerez0/pythonarena.git

          git fetch origin main
          git fetch upstream main

          # Bring our integration branch up to date
          # with our own main first
          git merge --no-edit origin/main

          # Then integrate changes from upstream
          git merge --no-edit upstream/main

          # Update only upstream-sync, never main
          git push origin HEAD:upstream-sync

      - name: Create PR if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if git diff --quiet origin/main HEAD; then
            echo "No changes to propose"
            exit 0
          fi

          COUNT=$(gh pr list \
            --head upstream-sync \
            --base main \
            --state open \
            --json number \
            --jq 'length')

          if [ "$COUNT" -eq 0 ]; then
            gh pr create \
              --base main \
              --head upstream-sync \
              --title "Sync Python Arena upstream" \
              --body "Review upstream changes and Ukrainian localization before merging."
          else
            echo "Existing upstream-sync PR updated"
          fi
